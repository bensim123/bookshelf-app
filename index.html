<script>
  if('serviceWorker' in navigator){
    const SW=`
const CACHE='bookshelf-v318';
const SHELL=[
  'https://unpkg.com/react@18/umd/react.production.min.js',
  'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
  'https://unpkg.com/@babel/standalone/babel.min.js',
];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>Promise.allSettled(SHELL.map(u=>c.add(u).catch(()=>{})))).then(()=>self.skipWaiting()));});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});
self.addEventListener('fetch',e=>{
  const url=new URL(e.request.url);
  const noCache=url.pathname.endsWith('manifest.json');
  const skip=['openlibrary.org','googleapis.com','fonts.gstatic.com','amazon.com','barnesandnoble.com','halfpricebooks.com','hpb.com','workers.dev'].some(h=>url.hostname.includes(h));
  if(skip||noCache||e.request.method!=='GET')return;
  // Navigation (HTML page): always try network first so new deploys load immediately
  if(e.request.mode==='navigate'){
    e.respondWith(fetch(e.request).then(res=>{if(res&&res.status===200){caches.open(CACHE).then(c=>c.put(e.request,res.clone()));}return res;}).catch(()=>caches.match(e.request).then(r=>r||caches.match('/bookshelf-app/'))));
    return;
  }
  // Static assets: cache-first for speed
  e.respondWith(caches.match(e.request).then(hit=>{if(hit)return hit;return fetch(e.request).then(res=>{if(res&&res.status===200&&res.type!=='opaque'){caches.open(CACHE).then(c=>c.put(e.request,res.clone()));}return res;}).catch(()=>{});}));
});`;
    try{
      const blob=new Blob([SW],{type:'application/javascript'});
      const url=URL.createObjectURL(blob);
      navigator.serviceWorker.register(url,{scope:'/'}).then(reg=>{
        console.log('SW v318 ok');
        URL.revokeObjectURL(url);
        // When a new SW version installs, it calls skipWaiting() and clients.claim().
        // That fires 'controllerchange' here — reload once to pick up fresh assets.
        let reloading=false;
        navigator.serviceWorker.addEventListener('controllerchange',()=>{
          if(reloading)return;
          reloading=true;
          // Brief toast then reload so the user knows what's happening
          const t=document.createElement('div');
          t.textContent='✨ Updating Bookshelf…';
          Object.assign(t.style,{position:'fixed',bottom:'90px',left:'50%',transform:'translateX(-50%)',
            background:'#1e1e2e',color:'#f1f1f8',borderRadius:'12px',padding:'12px 20px',
            fontFamily:'Nunito,sans-serif',fontSize:'14px',fontWeight:'700',
            boxShadow:'0 8px 32px rgba(0,0,0,.6)',zIndex:'9999',whiteSpace:'nowrap'});
          document.body.appendChild(t);
          setTimeout(()=>window.location.reload(),1200);
        });
      }).catch(()=>{});
    }catch(e){}
  }
  // Apply saved theme before React renders (prevents flash)
  try{
    const t=JSON.parse(localStorage.getItem('bs_theme')||'"dark"');
    if(t==='light'){document.body.classList.add('light');document.body.style.background='#f5f5ff';document.body.style.color='#1a1a2e';}
  }catch(e){}
  // iOS install banner
  const standalone=window.navigator.standalone||window.matchMedia('(display-mode:standalone)').matches;
  const isSafari=/iP(hone|od|ad)/.test(navigator.userAgent)&&/Safari/.test(navigator.userAgent)&&!/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
  window.addEventListener('DOMContentLoaded',()=>{
    const banner=document.getElementById('install-banner');
    const close=document.getElementById('banner-close');
    if(isSafari&&!standalone&&!localStorage.getItem('banner_dismissed')){setTimeout(()=>banner.classList.add('show'),3000);}
    close.addEventListener('click',()=>{banner.classList.remove('show');localStorage.setItem('banner_dismissed','1');});
  });
</script>

// ─── Storage (Firestore-backed, localStorage fallback for theme) ──────────────
//
// Books are stored in a subcollection: users/{uid}/books/{bookId}
// Everything else (goal, theme, achievements, shelves, etc.) stays in users/{uid}.
// This removes the 1 MB per-document ceiling entirely — each book is its own doc.
//
let _userDocRef  = null;
let _booksColRef = null;   // users/{uid}/books subcollection reference
let _userCache   = null;
let _booksInFS   = null;   // Map<bookId, serialized> — tracks Firestore state for diffing
const _saveTimers = {};

// Trim long descriptions before writing — Open Library/Google Books descriptions
// can be 2000+ chars. 400 is plenty for display; trimming keeps individual book
// docs small and speeds up import/export operations.
function trimBook(b) {
  if (!b || !b.description || b.description.length <= 400) return b;
  return { ...b, description: b.description.slice(0, 400) + '…' };
}

// Write only the books that changed since the last Firestore write.
// Uses the _booksInFS map as the reference state. Batches in chunks of 500
// (Firestore per-batch limit). Safe to call synchronously in beforeunload.
function _flushBooksDiff(books) {
  if (!_booksColRef || _booksInFS === null) return;
  const db = firebase.firestore();
  const trimmed = (books || []).map(trimBook);
  const newMap  = new Map(trimmed.map(b => [b.id, JSON.stringify(b)]));
  const ops = [];

  for (const [id, serial] of newMap) {
    if (_booksInFS.get(id) !== serial) ops.push({ type:'set', id, data: trimmed.find(b=>b.id===id) });
  }
  for (const [id] of _booksInFS) {
    if (!newMap.has(id)) ops.push({ type:'delete', id });
  }

  if (!ops.length) return;

  for (let i = 0; i < ops.length; i += 500) {
    const batch = db.batch();
    for (const op of ops.slice(i, i + 500)) {
      const ref = _booksColRef.doc(op.id);
      op.type === 'set' ? batch.set(ref, op.data) : batch.delete(ref);
    }
    batch.commit().catch(e => console.error('Books batch write failed:', e));
  }

  _booksInFS = newMap; // optimistic update — matches what we just sent
}

const load = (k, d) => {
  if (_userCache !== null && k in _userCache) return _userCache[k];
  // Theme is kept in localStorage so it applies instantly before auth loads
  try { const v = localStorage.getItem(`bs_${k}`); return v ? JSON.parse(v) : d; } catch { return d; }
};

const save = (k, v) => {
  if (_userCache !== null) _userCache[k] = v;
  if (k === 'theme') { try { localStorage.setItem('bs_theme', JSON.stringify(v)); } catch {} }
  if (!_userDocRef) return;

  if (k === 'books') {
    // Books go to the subcollection, not the user document
    clearTimeout(_saveTimers.books);
    _saveTimers.books = setTimeout(() => _flushBooksDiff(v), 600);
    return;
  }

  clearTimeout(_saveTimers[k]);
  _saveTimers[k] = setTimeout(() => {
    if (!_userDocRef) return;
    _userDocRef.set({ [k]: v }, { merge: true }).catch(e => console.error('Firestore save failed:', e));
  }, 0);
};

const AI_PROXY_URL = "https://calm-butterfly-1f95.bensim123.workers.dev/";
const GROQ_MODEL   = "llama-3.3-70b-versatile";

async function aiText(prompt, maxTokens=5000) {
  const r = await fetch(AI_PROXY_URL, {method:"POST",headers:{"Content-Type":"application/json"},
    body: JSON.stringify({model:GROQ_MODEL,messages:[{role:"user",content:prompt}],max_tokens:maxTokens})});
  const d = await r.json();
  if(d.error) throw new Error(d.error.message||JSON.stringify(d.error));
  return d?.choices?.[0]?.message?.content || "";
}

// Best-effort flush on page unload — fire-and-forget (browser may not wait)
window.addEventListener('beforeunload', () => {
  if (!_userDocRef || !_userCache) return;
  Object.keys(_saveTimers).forEach(k => {
    clearTimeout(_saveTimers[k]);
    if (k === 'books') {

    } else {

// ─── Monthly Challenge helpers ───────────────────────────────────────────────
function booksReadInMonth(books,y,m){
  return books.filter(b=>{
    if(b.status!=="read")return false;
    if(b.readDates&&b.readDates.length)
      return b.readDates.some(d=>{const dt=new Date(d);return dt.getFullYear()===y&&dt.getMonth()+1===m;});
    if(b.addedAt){const dt=new Date(b.addedAt);return dt.getFullYear()===y&&dt.getMonth()+1===m;}
    return false;
  });
}
function booksAddedInMonth(books,y,m){
  return books.filter(b=>{
    if(!b.addedAt)return false;
    const dt=new Date(b.addedAt);
    return dt.getFullYear()===y&&dt.getMonth()+1===m;
  });
}

function calcXP(books, goal, earned=[], completedChallenges=[]) {
  const readAll   = books.filter(b=>b.status==="read");
  const physical  = readAll.filter(b=>(b.bookFormat||"physical")==="physical").length;
  const ebooks    = readAll.filter(b=>b.bookFormat==="ebook").length;
  const audio     = readAll.filter(b=>b.bookFormat==="audiobook").length;
  const baseXP    = physical * 50 + ebooks * 55 + audio * 60; // slight bonus for tracked formats
  const ratingXP  = books.filter(b=>b.rating>0).length * 10;
  const noteXP    = books.filter(b=>b.notes?.trim()).length * 5;
  const highlightXP = books.reduce((s,b)=>s+(b.highlights?.length||0),0) * 8;
  // Bonus XP for owning the same title across multiple formats (excludes wishlist)
  const formatComboXP = (() => {
    const active = books.filter(b=>b.status!=="wishlist"&&b.status!=="suggestion");
    const byTitle = {};
    active.forEach(b=>{const t=b.title.toLowerCase(),f=b.bookFormat||"physical";if(!byTitle[t])byTitle[t]=new Set();byTitle[t].add(f);});
    return Object.values(byTitle).reduce((s,fmts)=>s+(fmts.size>=3?30:fmts.size>=2?15:0),0);
  })();
  // XP from earned achievements
  const achievementXP = ACHIEVEMENTS.filter(a=>earned.includes(a.id)).reduce((s,a)=>s+a.xp,0);
  // XP from completed monthly challenges
  const challengeXP = completedChallenges.reduce((s,ym)=>{const ch=MONTHLY_CHALLENGES.find(c=>c.ym===ym);return s+(ch?ch.xp:0);},0);
  return baseXP + ratingXP + noteXP + highlightXP + formatComboXP + achievementXP + challengeXP;
}

function calcLevel(xp) {
  // Level thresholds: 0,100,250,500,900,1400,2100,3000,4200,6000,...
  const thresholds = [0,100,250,500,900,1400,2100,3000,4200,6000,9000,14000];
  let level = 1;
  for (let i = 1; i < thresholds.length; i++) {
    if (xp >= thresholds[i]) level = i + 1;
    else break;
  }
  const curThresh = thresholds[Math.min(level-1, thresholds.length-1)];
  const nextThresh = thresholds[Math.min(level, thresholds.length-1)];
  const progress = nextThresh > curThresh ? (xp - curThresh) / (nextThresh - curThresh) : 1;
  return { level, xp, progress: Math.min(progress, 1), nextThresh };
}

// Language codes OL uses vs ISO
const OL_LANG = {
  en:"eng", fr:"fre", de:"ger", es:"spa", it:"ita", pt:"por",
  ja:"jpn", zh:"chi", nl:"dut", ru:"rus", ko:"kor", ar:"ara",
  pl:"pol", sv:"swe", da:"dan", fi:"fin", no:"nor", cs:"cze",

function enCover(i13,i10,cid) {
  // cover_i is OL's curated work cover — more reliable than ISBN-based lookups which
  // aggregate all editions and may return a non-English or placeholder image
  if(cid) return `https://covers.openlibrary.org/b/id/${cid}-L.jpg`;
  if(i13) return `https://covers.openlibrary.org/b/isbn/${i13}-L.jpg`;
  if(i10) return `https://covers.openlibrary.org/b/isbn/${i10}-L.jpg`;
  return null;
}
// Build an array of candidate cover URLs for a result (all ISBN variants + cover_i ids)
function coverCandidates(doc) {
  const urls = [];
  // cover_i first — it's the curated work cover and most likely to load successfully
  if(doc.cover_i) urls.push(`https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg`);
  const isbns = (doc.isbn || []);
  isbns.filter(i=>i.length===13).forEach(i=>urls.push(`https://covers.openlibrary.org/b/isbn/${i}-L.jpg`));
  isbns.filter(i=>i.length===10).forEach(i=>urls.push(`https://covers.openlibrary.org/b/isbn/${i}-L.jpg`));
  return [...new Set(urls)];
}
// Detect binding from OL physical_format string
function detectBinding(physicalFormat) {
  if(!physicalFormat) return "unknown";
  const f = physicalFormat.toLowerCase();
  if(f.includes("mass market")) return "mass_market";
  if(f.includes("hardcover")||f.includes("hardback")) return "hardcover";
  if(f.includes("paperback")||f.includes("softcover")||f.includes("trade paper")) return "paperback";
  return "unknown";
}
// Fetch editions of a work to find one matching preferred binding; falls back to any edition
async function fetchEditionForBinding(workKey, preferredBinding) {
  try {
    const r = await fetch(`https://openlibrary.org${workKey}/editions.json?limit=20`);
    if(!r.ok) return null;
    const editions = (await r.json()).entries||[];
    const hasISBN = e => e.isbn_13?.length||e.isbn_10?.length;
    const getISBN = e => e.isbn_13?.[0]||e.isbn_10?.[0]||null;
    // Prefer exact binding match
    const match = editions.find(e=>detectBinding(e.physical_format||"")===preferredBinding&&hasISBN(e));
    if(match) return { isbn:getISBN(match), binding:preferredBinding };
    // Fall back to any edition with an ISBN
    const any = editions.find(e=>hasISBN(e));
    if(any) return { isbn:getISBN(any), binding:detectBinding(any.physical_format||"") };
    return null;
  } catch { return null; }
}
function parseDoc(doc) {
  if(!doc) return null;
  const i13=doc.isbn?.find(i=>i.length===13)||null, i10=doc.isbn?.find(i=>i.length===10)||null;
  const raw=doc.description;
  const olLang = doc.language?.[0]||"eng";
  const isoLang = Object.entries(OL_LANG).find(([,v])=>v===olLang)?.[0] || olLang.slice(0,2);
  return {
    id:doc.key?.replace("/works/","")||crypto.randomUUID(),
    title:doc.title||"Unknown Title", subtitle:doc.subtitle||"",
    authors:doc.author_name||["Unknown Author"],
    cover:enCover(i13,i10,doc.cover_i), coverCandidates:coverCandidates(doc),
    genre:doc.subject?.[0]||"",
    categories:doc.subject?.slice(0,4)||[],
    year:doc.first_publish_year?.toString()||"",
    publishedDate:doc.first_publish_year?.toString()||"",
    publisher:doc.publisher?.[0]||"", pages:doc.number_of_pages_median?.toString()||"",
    description:typeof raw==="string"?raw:raw?.value||"",
    language:isoLang, isbn13:i13||"", isbn10:i10||"",
    averageRating:0, ratingsCount:0,
    previewLink:doc.key?`https://openlibrary.org${doc.key}`:"",
    status:"owned", rating:0, notes:"", addedAt:Date.now(),
    bookFormat:"physical", bookBinding:"unknown",
    customShelves:[], readDates:[], highlights:[],
  };
}
// lang = ISO code e.g. "en", "de". If provided, restrict results to that language.
async function olSearch(q, lim=12, lang=null) {
  async function _fetch(withLang) {
    const params=new URLSearchParams({q,limit:String(lim),fields:OL_FIELDS});
    if(withLang&&lang) params.set('language',OL_LANG[lang]||'eng');
    const r=await fetch(`${OL_SEARCH}?${params}`);
    if(!r.ok) throw new Error("Search failed");
    return ((await r.json())?.docs||[]).map(parseDoc).filter(Boolean);
  }
  let results=await _fetch(true);
  // If language filter yielded nothing, retry without it
  if(results.length===0) results=await _fetch(false);
  // Secondary language filter — but only if it doesn't wipe all results
  if(lang&&results.length>0){
    const c=OL_LANG[lang]||lang;
    const filtered=results.filter(b=>{const bl=OL_LANG[b.language]||b.language;return bl===c||b.language===lang;});
    if(filtered.length>0) return filtered;
  }
  return results;
}
// Internal OL ISBN fetch — returns null instead of throwing
async function _olByISBN(isbn) {
  try {
    const r=await fetch(`https://openlibrary.org/isbn/${isbn}.json`);
    if(!r.ok) return null;
    const ed=await r.json();
    const wk=ed.works?.[0]?.key; let work={}, authorName="Unknown Author";
    if(wk){const wr=await fetch(`https://openlibrary.org${wk}.json`);if(wr.ok)work=await wr.json();}
    const ak=ed.authors?.[0]?.key||work?.authors?.[0]?.author?.key;
    if(ak){const ar=await fetch(`https://openlibrary.org${ak}.json`);if(ar.ok){const a=await ar.json();authorName=a.name||authorName;}}
    const i13=isbn.length===13?isbn:ed.isbn_13?.[0]||"", i10=isbn.length===10?isbn:ed.isbn_10?.[0]||"";
    const desc=work.description;
    const olLang=ed.languages?.[0]?.key?.replace("/languages/","")||"eng";
    const isoLang=Object.entries(OL_LANG).find(([,v])=>v===olLang)?.[0]||olLang.slice(0,2);
    const bookBinding=detectBinding(ed.physical_format||"");
    const candidates=[];
    if(i13) candidates.push(`https://covers.openlibrary.org/b/isbn/${i13}-L.jpg`);
    if(i10) candidates.push(`https://covers.openlibrary.org/b/isbn/${i10}-L.jpg`);
    (ed.covers||[]).forEach(id=>candidates.push(`https://covers.openlibrary.org/b/id/${id}-L.jpg`));
    (work.covers||[]).forEach(id=>candidates.push(`https://covers.openlibrary.org/b/id/${id}-L.jpg`));
    return {
      id:wk?.replace("/works/","")||isbn,title:ed.title||work.title||"Unknown Title",
      subtitle:ed.subtitle||work.subtitle||"",authors:[authorName],
      cover:candidates[0]||null,coverCandidates:[...new Set(candidates)],
      genre:work.subjects?.[0]||"",categories:work.subjects?.slice(0,4)||[],
      year:ed.publish_date||"",publishedDate:ed.publish_date||"",
      publisher:ed.publishers?.[0]||"",pages:ed.number_of_pages?.toString()||"",
      description:typeof desc==="string"?desc:desc?.value||"",language:isoLang,
      isbn13:i13,isbn10:i10,averageRating:0,ratingsCount:0,previewLink:"",
      status:"owned",rating:0,notes:"",addedAt:Date.now(),
      bookFormat:"physical",bookBinding,customShelves:[],readDates:[],highlights:[],
    };
  } catch { return null; }
}

// ─── ISBN-10 ↔ ISBN-13 conversion ────────────────────────────────────────────
function isbn10to13(i10){
  if(!i10)return null;
  const d=i10.replace(/[^0-9X]/gi,"");
  if(d.length<9)return null;
  const base="978"+d.slice(0,9);
  let s=0;for(let i=0;i<12;i++)s+=parseInt(base[i])*(i%2?3:1);
  return base+((10-(s%10))%10);
}
function isbn13to10(i13){
  if(!i13||i13.length!==13||!i13.startsWith("978"))return null;
  const base=i13.slice(3,12);
  let s=0;for(let i=0;i<9;i++)s+=parseInt(base[i])*(10-i);
  const c=(11-(s%11))%11;return base+(c===10?"X":c.toString());
}

// ─── Google Books API (no key required) ──────────────────────────────────────
function parseGoogleVolume(vol){
  if(!vol)return null;
  const vi=vol.volumeInfo||{};
  const ids=vi.industryIdentifiers||[];
  const i13=ids.find(x=>x.type==="ISBN_13")?.identifier||"";
  const i10=ids.find(x=>x.type==="ISBN_10")?.identifier||"";
  const raw=vi.imageLinks?.thumbnail||vi.imageLinks?.smallThumbnail||"";
  const cover=raw?raw.replace("http:","https:").replace(/zoom=\d/,"zoom=2"):null;
  return {
    id:i13||i10||vol.id||crypto.randomUUID(),
    title:vi.title||"Unknown Title",subtitle:vi.subtitle||"",
    authors:vi.authors||["Unknown Author"],
    cover,coverCandidates:cover?[cover]:[],
    genre:vi.categories?.[0]||"",categories:vi.categories?.slice(0,4)||[],
    year:vi.publishedDate?.slice(0,4)||"",publishedDate:vi.publishedDate||"",
    publisher:vi.publisher||"",pages:vi.pageCount?.toString()||"",

// Multi-source ISBN lookup: OL → OL(alt format) → Google Books → plain-text → B&N → AI bridge
async function fetchByISBN(isbn) {
  isbn=isbn.replace(/[^0-9X]/gi,"").trim();
  if(!isbn)return null;
  const alt=isbn.length===13?isbn13to10(isbn):isbn10to13(isbn);
  // Open Library (most metadata-rich for edition details)
  const ol1=await _olByISBN(isbn); if(ol1)return ol1;
  if(alt){const ol2=await _olByISBN(alt);if(ol2)return ol2;}
  // Google Books (better coverage, especially newer/self-published)
  const gb1=await fetchByISBNGoogle(isbn); if(gb1)return gb1;
  if(alt){const gb2=await fetchByISBNGoogle(alt);if(gb2)return gb2;}
  // Plain text search by ISBN number (different indexing than isbn: prefix)
  const res=await olSearch(isbn,1,null).catch(()=>null);
  if(res?.[0]) return res[0];
  try{
    const gbPlain=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(isbn)}&maxResults=1`);
    if(gbPlain.ok){const d=await gbPlain.json();const p=d.items?.[0]?parseGoogleVolume(d.items[0]):null;if(p)return p;}
  }catch{}
  // Barnes & Noble silent check
  const bn1=await _bnByISBN(isbn); if(bn1)return bn1;
  if(alt){const bn2=await _bnByISBN(alt);if(bn2)return bn2;}
  // AI bridge: ask Groq to identify the book by ISBN, then do a real title search
  try{
    const raw=await aiText(
      `What book has ISBN ${isbn}? Reply with ONLY a JSON object and nothing else: {"title":"...","authors":["..."],"year":"..."}. If you do not know this specific ISBN, reply with {"title":null}.`,
      120
    );
    const match=raw.match(/\{[\s\S]*\}/);
    if(match){
      const info=JSON.parse(match[0]);
      if(info.title){
        const author=info.authors?.[0]||"";
        // Try Google Books by title+author
        const q=`intitle:${encodeURIComponent(info.title)}${author?`+inauthor:${encodeURIComponent(author)}`:""}`;
        const gbT=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=1`).catch(()=>null);
        if(gbT?.ok){const d=await gbT.json();const p=d.items?.[0]?parseGoogleVolume(d.items[0]):null;if(p)return p;}
        // Try OL by title+author
        const olT=await olSearch(`${info.title} ${author}`,1,null).catch(()=>null);
        if(olT?.[0]) return olT[0];
      }
    }
  }catch{}
  return null;
}
function pLinks(book) {
  const isbn=book.isbn13||book.isbn10||"";
  const title=book.title||"";
  const author=book.authors?.[0]||"";
  // Amazon: ISBN is most precise; fall back to title+author keywords
  const amazonQ=isbn?isbn:`${title} ${author}`.trim();
  const amazon=`https://www.amazon.com/s?k=${encodeURIComponent(amazonQ)}&i=stripbooks`;
  // B&N: /s/ path with words joined by + — neither %20 nor ?q= forms work reliably
  const bnQ=isbn?isbn:`${title}${author?' '+author:''}`.trim();
  const bn=`https://www.barnesandnoble.com/s/${encodeURIComponent(bnQ).replace(/%20/g,'+')}`;
  // HPB: always search by title — their inventory isn't indexed by ISBN reliably
  const hpb=`https://www.hpb.com/search?q=${encodeURIComponent(title)}`;
  return {amazon,bn,hpb};
}
function extractSeries(book) {
  // Parenthetical: "Title (Series Name, #N)" or "Title (Series Name)"
  const paren=book.title.match(/\(([^,)]+?)(?:\s*[,#]\s*\d+)?\)/i);
  if(paren) return paren[1].trim();
  // OL dash format: "Franchise - Series - Title" → everything before last segment is series
  const parts=book.title.split(/\s*[-–]\s*/);
  if(parts.length>=3) return parts.slice(0,-1).join(" - ").trim();
  if(parts.length===2&&parts[0].trim().split(" ").length<=6) return parts[0].trim();
  // Subtitle clue
  if(book.subtitle){const s=book.subtitle.match(/^([^:,]+?)(?:\s+(?:novel|book|volume|series))?$/i);if(s&&s[1].split(" ").length<=5)return s[1].trim();}
  return null;
}
// Ask AI for the complete series book list, then enrich each with real covers/ISBNs
async function fetchSeriesTitles(book, existingBooks=[]) {
  const author=book.authors?.[0]||"";
  if(!book.title) return [];
  const exTitles=new Set([book.title.toLowerCase(),...existingBooks.map(b=>b.title.toLowerCase())]);
  try {
    const prompt=`The book "${book.title}" by ${author} — if it is part of a series, list ALL the other books in that same series (do NOT include "${book.title}" itself). If it is a standalone novel with no series, return an empty array.
Reply ONLY with a JSON array, no markdown fences:
[{"title":"","author":"","year":""}]`;
    const raw=(await aiText(prompt,1200)).replace(/```json|```/g,"").trim();
    const match=raw.match(/\[[\s\S]*\]/);
    if(!match) return [];
    const items=JSON.parse(match[0]).filter(b=>b.title&&!exTitles.has(b.title.toLowerCase())).slice(0,12);
    if(!items.length) return [];
    const base=items.map(s=>({...s,id:crypto.randomUUID(),authors:[s.author||author],cover:null,isbn13:"",isbn10:"",status:"suggestion"}));
    const enriched=await Promise.allSettled(base.map(b=>enrichSuggestion(b)));
    return enriched.map((r,i)=>r.status==="fulfilled"?r.value:base[i]);
  } catch { return []; }
}

async function nativeShare(title, text, fallbackFn) {
  if (navigator.share) {
    try {
      await navigator.share({ title, text });

function Sheet({children,onClose,noPad=false}) {

  // On iOS, position:fixed is anchored to the layout viewport (full screen), not the visual viewport

  return <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
    <div style={{position:"relative",width:size,height:size}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>

// ─── Reading Progress ─────────────────────────────────────────────────────────
// For audiobooks: progress stored as minutes listened in currentPage field (reusing field)
// audioLength stored in pages field (total minutes)
function fmtMinutes(mins) {
  const m = Math.max(0, Math.round(mins));
  const h = Math.floor(m/60), mm = m%60;
  return h>0 ? `${h}h ${mm}m` : `${mm}m`;
}
function ReadingProgressModal({book,onSave,onClose}) {
  const fmt = book.bookFormat||"physical";
  const isAudio = fmt==="audiobook";
  const pages=parseInt(book.pages)||0, current=book.currentPage||0;
  const [page,setPage]=useState(current);
  const [mode,setMode]=useState(isAudio?"pct":pages>0?"page":"pct");
  // For audiobooks: page = minutes listened, pages = total minutes
  const pct = isAudio
    ? (pages>0?Math.round((page/pages)*100):Math.min(page,100))
    : (mode==="page"&&pages>0?Math.round((page/pages)*100):page);
  const actualPage = isAudio
    ? page
    : (mode==="pct"&&pages>0?Math.round((page/100)*pages):page);
  const maxVal = isAudio ? (pages||0) : (mode==="page"?pages:100);
  function save(){
    const entry={date:today(),page:actualPage,pct:pages>0?Math.round((actualPage/pages)*100):(mode==="pct"?page:0)};
    const history=[...(book.progressHistory||[]).filter(h=>h.date!==entry.date),entry].sort((a,b)=>a.date.localeCompare(b.date));
    onSave({...book,currentPage:actualPage,progressHistory:history});onClose();
  }
  const last7=(book.progressHistory||[]).slice(-7);
  const unitLabel = isAudio
    ? (pages>0?`of ${fmtMinutes(pages)} total`:"min listened")
    : (mode==="page"?`of ${pages} pages`:"% complete");
  return <div>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
      <h3 style={{fontFamily:"'Playfair Display',serif",color:P.text,marginTop:0,fontSize:20,margin:0}}>{isAudio?"🎧":fmt==="ebook"?"📱":"📖"} {isAudio?"Listening":"Reading"} Progress</h3>
    </div>
    <p style={{fontFamily:"'Nunito',sans-serif",color:P.muted,fontSize:13,marginBottom:18,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{book.title}</p>
    {!isAudio&&pages>0&&<div style={{display:"flex",background:P.bgSurface,borderRadius:10,padding:3,marginBottom:16,width:"fit-content",border:`1px solid ${P.border}`}}>{[["page","Page #"],["pct","Percent"]].map(([m,l])=><button key={m} onClick={()=>setMode(m)} style={{background:mode===m?P.accent:"transparent",border:"none",borderRadius:8,padding:"6px 16px",fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:13,color:mode===m?"#fff":P.muted,cursor:"pointer",transition:"all .15s"}}>{l}</button>)}</div>}
    {isAudio&&<div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,marginBottom:12}}>Enter minutes listened so far (e.g. 90 = 1h 30m)</div>}
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
      <input type="number" value={page} min={0} max={maxVal>0?maxVal:undefined} onChange={e=>setPage(maxVal>0?Math.min(Number(e.target.value),maxVal):Math.max(0,Number(e.target.value)))} style={{width:90,border:`1.5px solid ${P.border}`,borderRadius:10,padding:"10px 12px",fontFamily:"'Nunito',sans-serif",fontSize:18,fontWeight:700,color:P.text,background:P.cream,outline:"none",textAlign:"center"}}/>
      <span style={{fontFamily:"'Nunito',sans-serif",color:P.muted,fontSize:13}}>{unitLabel}</span>
    </div>
    {maxVal>0&&<input type="range" min={0} max={maxVal} value={page} onChange={e=>setPage(Number(e.target.value))} style={{width:"100%",accentColor:P.accent,marginBottom:12}}/>}
    <ProgressBar value={pct} max={100}/>
    <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,marginTop:6,marginBottom:last7.length>1?16:20}}>
      {isAudio?`${fmtMinutes(page)} listened · ${pct}% complete`:(`${pct}% complete${pages>0&&mode==="pct"?` · ~${actualPage} of ${pages} pages`:""}`)}
    </div>
    {last7.length>1&&<div style={{marginBottom:20}}><div style={{fontFamily:"'Nunito',sans-serif",fontSize:11,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Progress History</div><div style={{display:"flex",alignItems:"flex-end",gap:5,height:60}}>{last7.map((h,i)=>{const maxP=Math.max(...last7.map(x=>x.pct),1),barH=Math.max((h.pct/maxP)*52,4);return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}><div style={{width:"100%",height:barH,background:i===last7.length-1?P.accent:`rgba(99,102,241,${0.15+i*0.06})`,borderRadius:3}} title={`${h.pct}% on ${h.date}`}/><span style={{fontFamily:"'Nunito',sans-serif",fontSize:8,color:P.muted}}>{h.date.slice(5)}</span></div>;})} </div></div>}

function BookCard({book,onClick,onContextMenu}) {

function BarcodeScanner({onDetected,onClose}) {
  const vidRef=useRef(null),streamRef=useRef(null);
  const [status,setStatus]=useState("Starting camera…");
  useEffect(()=>{
    let active=true, pending=null, confirmCount=0;
    (async()=>{
      try{
        const {BrowserMultiFormatReader}=await import("https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm");
        // Request high-res back camera so small barcodes are readable
        const stream=await navigator.mediaDevices.getUserMedia({
          video:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}}
        });
        if(!active){stream.getTracks().forEach(t=>t.stop());return;}
        streamRef.current=stream;
        if(vidRef.current)vidRef.current.srcObject=stream;
        // Give autofocus ~1s to settle before we start accepting results
        setStatus("Focusing camera…");
        await new Promise(r=>setTimeout(r,1000));
        if(!active)return;
        setStatus("Point at barcode — hold steady");
        const reader=new BrowserMultiFormatReader();
        reader.decodeFromStream(stream,vidRef.current,(result)=>{
          if(!result||result instanceof Error||!active)return;
          const t=result.getText().replace(/[^0-9X]/gi,"");
          if(!/^\d{13}$/.test(t)&&!/^\d{9}[\dX]$/i.test(t))return;
          if(t===pending){
            confirmCount++;
            if(confirmCount>=2){active=false;onDetected(t);}
            // still holding — keep status message
          } else {
            pending=t; confirmCount=1;
            setStatus("Hold steady…");
          }
        });
      }catch{setStatus("Camera unavailable — please allow camera access.");}
    })();
    return()=>{active=false;streamRef.current?.getTracks().forEach(t=>t.stop());};
  },[]);
  return <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16}}><div style={{position:"relative",width:"100%",borderRadius:14,overflow:"hidden",background:"#000",aspectRatio:"4/3"}}><video ref={vidRef} autoPlay playsInline muted style={{width:"100%",height:"100%",objectFit:"cover"}}/><div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}><div style={{width:"78%",height:90,border:`2px solid ${P.accent}`,borderRadius:10,boxShadow:`0 0 0 2000px rgba(0,0,0,.55), 0 0 20px ${P.accentGlow}`}}/></div></div><p style={{fontFamily:"'Nunito',sans-serif",color:P.textLt,fontSize:14}}>{status}</p><button onClick={onClose} style={{background:P.bgSurface,border:`1px solid ${P.border}`,borderRadius:20,padding:"9px 24px",fontFamily:"'Nunito',sans-serif",color:P.muted,cursor:"pointer"}}>Cancel</button></div>;
}

function useCoverValid(url) {
  const [ok,setOk]=useState(false);
  useEffect(()=>{
    if(!url){setOk(false);return;}
    const img=new Image();img.onload=()=>setOk(true);img.onerror=()=>setOk(false);img.src=url;
  },[url]);
  return ok;
}

function SearchPanel({onAdd,onAddWishlist,onClose}) {
  const [q,setQ]=useState("");const [res,setRes]=useState([]);const [busy,setBusy]=useState(false);const [err,setErr]=useState("");
  const [coverPickFor,setCoverPickFor]=useState(null);
  const [pendingBook,setPendingBook]=useState(null);
  const [pendingMode,setPendingMode]=useState("owned"); // "owned"|"wishlist"
  const [errIsbn,setErrIsbn]=useState("");
  async function go(){
    const query=q.trim();if(!query)return;
    setBusy(true);setErr("");setErrIsbn("");setRes([]);
    try{
      const clean=query.replace(/[^0-9X]/gi,"");
      const isISBN=/^\d{13}$/.test(clean)||/^\d{10}$/.test(clean)||/^\d{9}X$/i.test(clean);
      let books=[];
      if(isISBN){
        const b=await fetchByISBN(clean);
        if(b) books=[b];
      }
      // If ISBN lookup found nothing (or query wasn't an ISBN), run text search
      if(books.length===0){
        const textQ=isISBN?clean:query;
        const gbQ=isISBN?encodeURIComponent(clean):encodeURIComponent(query);
        // Run all three sources in parallel for speed; B&N silently returns [] on CORS/error
        const [olBooks,gbData,bnBooks]=await Promise.all([
          olSearch(textQ,12,null),
          fetch(`https://www.googleapis.com/books/v1/volumes?q=${gbQ}&maxResults=12`).then(r=>r.ok?r.json():null).catch(()=>null),
          isISBN?Promise.resolve([]):_bnSearch(query)
        ]);
        const gbBooks=(gbData?.items||[]).map(parseGoogleVolume).filter(Boolean);
        // Fuzzy title match handles subtitle variants e.g. "Onyx Storm" ↔ "Onyx Storm: Empyrean, Book 3"
        const fuzz=(a,b)=>{const ta=a.toLowerCase().trim(),tb=b.toLowerCase().trim();return ta===tb||ta.startsWith(tb+':')||ta.startsWith(tb+',')||tb.startsWith(ta+':')||tb.startsWith(ta+',');};
        // Enrich OL results: pull cover and authors from GB or BN when OL is missing them
        // (OL's first ISBN may be a non-English edition with a foreign cover; GB/BN always return
        // the English edition cover. OL sometimes lacks author data for newer books.)
        const allExt=[...gbBooks,...bnBooks];
        const olMerged=!isISBN?olBooks.map(b=>{
          const ext=allExt.find(g=>fuzz(b.title,g.title));
          if(!ext)return b;
          const cover=ext.cover||b.cover;
          const noAuthor=!b.authors?.length||b.authors[0]==="Unknown Author";
          const authors=noAuthor&&ext.authors?.length?ext.authors:b.authors;
          return{...b,cover,authors};
        }):olBooks;
        // Dedup: prefer OL (richest metadata), then GB, then BN
        const combined=[
          ...olMerged,
          ...gbBooks.filter(b=>!olMerged.some(o=>fuzz(o.title,b.title))),
          ...bnBooks.filter(b=>!olMerged.some(o=>fuzz(o.title,b.title))&&!gbBooks.some(g=>fuzz(g.title,b.title)))
        ];
        // Hard-filter non-English; fall back to unfiltered to allow intentional non-English searches
        if(!isISBN){const enOnly=combined.filter(b=>!b.language||b.language==='en');books=enOnly.length?enOnly:combined;}
        else books=combined;
      }
      setRes(books);
      if(!books.length){
        if(isISBN){setErr("ISBN not found — this edition may be too new for Open Library or Google Books. Try searching by title, or check:");setErrIsbn(clean);}
        else setErr("No books found — try a different title, author, or ISBN.");
      }
    }catch{setErr("Search failed. Check your connection and try again.");}
    finally{setBusy(false);}
  }
  if(coverPickFor) return <CoverPickerModal book={coverPickFor} onSelect={url=>{const updated={...coverPickFor,cover:url};if(pendingBook){if(pendingMode==="wishlist"&&onAddWishlist)onAddWishlist(updated);else onAdd(updated);}else{setRes(r=>r.map(b=>b.id===coverPickFor.id?{...b,cover:url}:b));} setCoverPickFor(null);setPendingBook(null);setPendingMode("owned");}} onClose={()=>{setCoverPickFor(null);setPendingBook(null);setPendingMode("owned");}}/>;
  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
      <span style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,color:P.muted,textTransform:"uppercase",letterSpacing:.6}}>Search Books</span>
      {onClose&&<button onClick={onClose} title="Close search" aria-label="Close search" style={{background:"none",border:"none",color:P.muted,cursor:"pointer",fontSize:22,lineHeight:1,padding:"2px 8px",borderRadius:8,fontFamily:"sans-serif"}}>✕</button>}
    </div>
    <div style={{display:"flex",gap:8,marginBottom:14}}><input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();go();}}} autoComplete="off" autoCorrect="off" spellCheck="false" placeholder="Title, author, or ISBN…" style={{flex:1,border:`1.5px solid ${P.border}`,borderRadius:12,padding:"12px 14px",fontFamily:"'Nunito',sans-serif",fontSize:15,background:P.bgSurface,color:P.text,outline:"none"}}/><button onClick={e=>{e.preventDefault();e.stopPropagation();go();}} disabled={busy} style={{background:busy?P.disabledBtn:P.accent,color:"#fff",border:"none",borderRadius:12,padding:"12px 20px",cursor:busy?"default":"pointer",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:15,minWidth:60}}>{busy?"…":"Go"}</button></div>
    {err&&<div style={{fontFamily:"'Nunito',sans-serif",color:"#c0392b",fontSize:13,marginBottom:12,lineHeight:1.6}}>{err}</div>}
    {busy&&<div style={{textAlign:"center",padding:"24px 0",color:P.muted,fontFamily:"'Nunito',sans-serif"}}>Searching…</div>}
    <div style={{display:"flex",flexDirection:"column",gap:10}}>{res.map(book=><div key={book.id} style={{display:"flex",gap:12,padding:"11px 12px",background:P.bgCard,borderRadius:12,border:`1px solid ${P.border}`,transition:"border-color .15s,background .15s"}} onMouseEnter={e=>{e.currentTarget.style.background=P.bgSurface;e.currentTarget.style.borderColor=P.accent;}} onMouseLeave={e=>{e.currentTarget.style.background=P.bgCard;e.currentTarget.style.borderColor=P.border;}}>
      {/* Cover thumbnail — tap to pick different cover */}
      <div onClick={()=>setCoverPickFor(book)} title="Change cover" style={{width:46,height:64,borderRadius:7,overflow:"hidden",background:P.bgSurface,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",position:"relative",border:`1px solid ${P.border}`}}>
        {book.cover?<img src={book.cover} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>{e.target.style.display="none";}}/>:<span style={{fontSize:18}}>📖</span>}
        <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0)",display:"flex",alignItems:"center",justifyContent:"center",opacity:0,transition:"opacity .15s",fontSize:14}} onMouseEnter={e=>{e.currentTarget.style.opacity=1;e.currentTarget.style.background="rgba(0,0,0,.4)";}} onMouseLeave={e=>{e.currentTarget.style.opacity=0;e.currentTarget.style.background="rgba(0,0,0,0)";}}>🖼</div>
      </div>
      <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>onAdd(book)}>
        <div style={{fontFamily:"'Playfair Display',serif",fontWeight:700,color:P.text,fontSize:14,lineHeight:1.3,marginBottom:2}}>{book.title}</div>
        {book.subtitle&&<div style={{fontFamily:"'Nunito',sans-serif",color:P.textLt,fontSize:12,fontStyle:"italic",marginBottom:2}}>{book.subtitle}</div>}
        <div style={{fontFamily:"'Nunito',sans-serif",color:P.textLt,fontSize:12}}>{book.authors?.join(", ")}</div>
        {(book.year||book.publisher)&&<div style={{fontFamily:"'Nunito',sans-serif",color:P.muted,fontSize:11,marginTop:2}}>{[book.year,book.publisher].filter(Boolean).join(" · ")}</div>}
        {book.language&&book.language!=="en"&&<div style={{fontFamily:"'Nunito',sans-serif",color:P.muted,fontSize:10,marginTop:2,fontStyle:"italic"}}>🌐 {book.language.toUpperCase()}</div>}
        {book.description&&<div style={{fontFamily:"'Nunito',sans-serif",color:P.textMd,fontSize:12,marginTop:4,lineHeight:1.5,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{book.description.replace(/<[^>]*>/g,"")}</div>}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:6,flexShrink:0,alignItems:"center",justifyContent:"center"}}>
        <button onClick={()=>onAdd(book)} title="Add to library" style={{background:P.accent,color:"#fff",border:"none",borderRadius:8,width:34,height:34,fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1,fontWeight:800}}>+</button>
        {onAddWishlist&&<button onClick={()=>onAddWishlist(book)} title="Add to wishlist" style={{background:"rgba(168,85,247,.15)",color:"#a855f7",border:"1px solid rgba(168,85,247,.35)",borderRadius:8,width:34,height:34,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>💜</button>}
      </div>
    </div>)}</div>
  </div>;

  const [result,setResult]=useState(null); // {owned:bool, libraryBook?, externalBook?}
  const [err,setErr]=useState("");

  function checkLibrary(book) {
    if(!book) return null;
    const isbn13=book.isbn13||""; const isbn10=book.isbn10||"";
    return books.find(b=>
      (isbn13&&(b.isbn13===isbn13||b.isbn10===isbn13))||
      (isbn10&&(b.isbn13===isbn10||b.isbn10===isbn10))||
      b.title.toLowerCase()===book.title.toLowerCase()
    )||null;
  }

  async function lookup(query) {
    setMode("loading"); setErr(""); setResult(null);
    const clean=query.replace(/[^0-9X]/gi,"");
    const isISBN=/^\d{13}$/.test(clean)||/^\d{10}$/.test(clean)||/^\d{9}X$/i.test(clean);
    try {
      let ext=null;
      if(isISBN){ext=await fetchByISBN(clean);}
      if(!ext){const r=await olSearch(query,1,null);ext=r?.[0]||null;}
      if(!ext){
        const gbR=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=1`).catch(()=>null);
        if(gbR?.ok){const d=await gbR.json();ext=d.items?.[0]?parseGoogleVolume(d.items[0]):null;}
      }
      const lib=ext?checkLibrary(ext):null;
      if(!ext&&!lib){setErr("Book not found. Try a different title or ISBN.");setMode(null);return;}
      setResult({owned:!!lib,libraryBook:lib,externalBook:ext});
      setMode(null);
    } catch{setErr("Search failed. Check your connection.");setMode(null);}
  }

  async function onISBN(isbn){await lookup(isbn);}

  function reset(){setResult(null);setErr("");setQ("");setMode(null);}

  const fmtList = (b) => {
    const fmts = b.ownedFormats||[b.bookFormat||"physical"];
    return fmts.map(f=>FL[f]).join(" · ");
  };

  if(mode==="barcode") return <div>
    <h3 style={{fontFamily:"'Playfair Display',serif",color:P.text,marginTop:0}}>Scan Barcode</h3>
    <BarcodeScanner onDetected={onISBN} onClose={()=>setMode(null)}/>
  </div>;

  if(mode==="loading") return <div style={{textAlign:"center",padding:"56px 0"}}>
    <div style={{fontSize:52,marginBottom:16}}>🔍</div>
    <p style={{fontFamily:"'Nunito',sans-serif",color:P.textLt,fontSize:15}}>Checking your library…</p>
  </div>;

  if(result) {
    const b = result.owned ? result.libraryBook : result.externalBook;
    const owned = result.owned;
    return <div>
      <div style={{textAlign:"center",marginBottom:20}}>
        <div style={{fontSize:48,marginBottom:6}}>{owned?"✅":"➕"}</div>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:900,color:owned?P.green:P.text,marginBottom:4}}>
          {owned?"You already own this!":"Not in your collection"}
        </div>
      </div>
      <div style={{display:"flex",gap:14,background:P.bgSurface,borderRadius:16,padding:14,border:`1px solid ${owned?P.green+"44":P.border}`,marginBottom:18}}>
        <div style={{width:60,height:84,borderRadius:8,overflow:"hidden",flexShrink:0}}>
          <CoverImg src={b?.cover} isbn13={b?.isbn13} isbn10={b?.isbn10} alt={b?.title} style={{width:60,height:84,objectFit:"cover",borderRadius:8}}/>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontWeight:700,color:P.text,fontSize:15,lineHeight:1.3,marginBottom:4}}>{b?.title}</div>
          <div style={{fontFamily:"'Nunito',sans-serif",color:P.textLt,fontSize:12,marginBottom:6}}>{b?.authors?.join(", ")}{b?.year?` · ${b.year}`:""}</div>
          {owned&&<>
            <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,marginBottom:3}}>
              <strong style={{color:P.text}}>Formats:</strong> {fmtList(result.libraryBook)}
            </div>
            <div style={{display:"inline-flex",alignItems:"center",gap:6}}>
              <Pill label={SL[result.libraryBook.status]} color={SC[result.libraryBook.status]}/>
              {result.libraryBook.rating>0&&<Stars value={result.libraryBook.rating} size={12}/>}
            </div>
          </>}
          {!owned&&b?.isbn13&&<div style={{fontFamily:"'Nunito',sans-serif",fontSize:11,color:P.muted}}>ISBN: {b.isbn13}</div>}
        </div>
      </div>
      {!owned&&<div style={{display:"flex",gap:8,marginBottom:12}}>
        <button onClick={()=>{onAdd({...result.externalBook,status:"owned"});onClose();}} style={{flex:1,background:`linear-gradient(135deg,${P.accent},${P.accentDk})`,color:"#fff",border:"none",borderRadius:12,padding:"13px",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:14,cursor:"pointer",boxShadow:`0 4px 16px ${P.accentGlow}`}}>+ Add to Library</button>
        <button onClick={()=>{onAdd({...result.externalBook,status:"wishlist"});onClose();}} style={{flex:1,background:"rgba(168,85,247,.1)",color:P.purple,border:"1px solid rgba(168,85,247,.3)",borderRadius:12,padding:"13px",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:14,cursor:"pointer"}}>💜 Wishlist</button>
      </div>}
      <div style={{display:"flex",gap:8}}>
        <button onClick={reset} style={{flex:1,background:P.bgSurface,color:P.textLt,border:`1px solid ${P.border}`,borderRadius:12,padding:"11px",fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:14,cursor:"pointer"}}>🔍 Check Another</button>
        <button onClick={onClose} style={{background:P.bgCard,color:P.muted,border:`1px solid ${P.border}`,borderRadius:12,padding:"11px 18px",fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:14,cursor:"pointer"}}>Done</button>
      </div>
    </div>;
  }

  return <div>
    <h3 style={{fontFamily:"'Playfair Display',serif",color:P.text,marginTop:0,fontSize:22,marginBottom:6}}>🛒 Check My Library</h3>
    <p style={{fontFamily:"'Nunito',sans-serif",color:P.muted,fontSize:13,marginBottom:18,lineHeight:1.6}}>Already own it? Find out before you buy.</p>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:18}}>
      {[{icon:"📷",label:"Scan Barcode",action:()=>setMode("barcode")},{icon:"✏️",label:"Type Title / ISBN",action:()=>document.getElementById("shop-q")?.focus()}].map(({icon,label,action})=>(
        <button key={label} onClick={action} style={{background:P.bgCard,border:`1.5px solid ${P.border}`,borderRadius:14,padding:"16px 8px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:7,transition:"all .15s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor=P.accent;e.currentTarget.style.background=P.bgSurface;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=P.border;e.currentTarget.style.background=P.bgCard;}}>
          <span style={{fontSize:28}}>{icon}</span>
          <span style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.textLt,fontWeight:700,textAlign:"center"}}>{label}</span>
        </button>
      ))}
    </div>
    <div style={{display:"flex",gap:8}}>
      <input id="shop-q" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&q.trim()){e.preventDefault();lookup(q.trim());}}} placeholder="Title, author, or ISBN…" autoComplete="off" autoCorrect="off" spellCheck="false" style={{flex:1,border:`1.5px solid ${P.border}`,borderRadius:12,padding:"12px 14px",fontFamily:"'Nunito',sans-serif",fontSize:15,background:P.bgSurface,color:P.text,outline:"none"}}/>
      <button onClick={()=>q.trim()&&lookup(q.trim())} disabled={!q.trim()} style={{background:q.trim()?P.accent:P.disabledBtn,color:"#fff",border:"none",borderRadius:12,padding:"12px 20px",cursor:q.trim()?"pointer":"default",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:15}}>Go</button>
    </div>
    {err&&<div style={{fontFamily:"'Nunito',sans-serif",color:"#c0392b",fontSize:13,marginTop:10}}>{err}</div>}
  </div>;
}

// ─── List View ────────────────────────────────────────────────────────────────
const COLS=[{key:"cover",label:"",sort:false,w:44},{key:"title",label:"Title",sort:true,flex:3},{key:"authors",label:"Author",sort:true,flex:2},{key:"year",label:"Year",sort:true,w:52},{key:"pages",label:"Pg",sort:true,w:44},{key:"status",label:"Status",sort:true,w:74},{key:"rating",label:"★",sort:true,w:50},{key:"genre",label:"Genre",sort:true,flex:1.5}];
function ListView({books,onSelect}) {
  const [sk,setSk]=useState("title"),[sd,setSd]=useState("asc");
  const [cf,setCf]=useState({status:"all",genre:"all",rating:"all"}),[sf,setSf]=useState(false);
  const uG=["all",...Array.from(new Set(books.map(b=>b.genre).filter(Boolean))).sort()];
  const sorted=useMemo(()=>[...books].filter(b=>{
    if(cf.status!=="all"&&b.status!==cf.status)return false;
    if(cf.genre!=="all"&&b.genre!==cf.genre)return false;
    if(cf.rating!=="all"&&b.rating!==parseInt(cf.rating))return false;
    return true;
  }).sort((a,b)=>{
    const av=sk==="title"?a.title.toLowerCase():sk==="authors"?(a.authors?.[0]||"").toLowerCase():sk==="year"?parseInt(a.year)||0:sk==="pages"?parseInt(a.pages)||0:sk==="rating"?a.rating||0:sk==="genre"?(a.genre||"").toLowerCase():a.status;
    const bv=sk==="title"?b.title.toLowerCase():sk==="authors"?(b.authors?.[0]||"").toLowerCase():sk==="year"?parseInt(b.year)||0:sk==="pages"?parseInt(b.pages)||0:sk==="rating"?b.rating||0:sk==="genre"?(b.genre||"").toLowerCase():b.status;
    if(av<bv)return sd==="asc"?-1:1;if(av>bv)return sd==="asc"?1:-1;return 0;
  }),[books,sk,sd,cf]);
  return <div style={{padding:"0 12px"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
      <span style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,fontWeight:700}}>{sorted.length} / {books.length}</span>
      <button onClick={()=>setSf(x=>!x)} style={{background:sf?P.accent:P.bgSurface,color:sf?"#fff":P.muted,border:`1px solid ${sf?P.accent:P.border}`,borderRadius:20,padding:"5px 14px",fontFamily:"'Nunito',sans-serif",fontSize:12,fontWeight:700,cursor:"pointer"}}>{sf?"Hide ×":"⚙ Filters"}</button>
    </div>
    {sf&&<div style={{background:P.bgCard,borderRadius:14,padding:"14px",marginBottom:12,border:`1px solid ${P.border}`,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
      {[["Status",STATUSES.map(s=>({v:s,l:SL[s]})),"status"],["Genre",uG.filter(g=>g!=="all").map(g=>({v:g,l:g})),"genre"]].map(([lbl,opts,key])=><div key={key}><label style={{display:"block",fontFamily:"'Nunito',sans-serif",fontSize:10,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.4,marginBottom:4}}>{lbl}</label><select value={cf[key]} onChange={e=>setCf(f=>({...f,[key]:e.target.value}))} style={{border:`1.5px solid ${P.border}`,borderRadius:8,padding:"6px 10px",fontFamily:"'Nunito',sans-serif",fontSize:12,background:P.bgSurface,color:P.text,outline:"none"}}><option value="all">All</option>{opts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select></div>)}
      <div><label style={{display:"block",fontFamily:"'Nunito',sans-serif",fontSize:10,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.4,marginBottom:4}}>Rating</label><select value={cf.rating} onChange={e=>setCf(f=>({...f,rating:e.target.value}))} style={{border:`1.5px solid ${P.border}`,borderRadius:8,padding:"6px 10px",fontFamily:"'Nunito',sans-serif",fontSize:12,background:P.bgSurface,color:P.text,outline:"none"}}><option value="all">All</option>{[5,4,3,2,1,0].map(r=><option key={r} value={r}>{r?"★".repeat(r):"Unrated"}</option>)}</select></div>
      {(cf.status!=="all"||cf.genre!=="all"||cf.rating!=="all")&&<button onClick={()=>setCf({status:"all",genre:"all",rating:"all"})} style={{alignSelf:"flex-end",background:"none",border:"none",color:P.accentLt,fontFamily:"'Nunito',sans-serif",fontSize:12,fontWeight:700,cursor:"pointer",paddingBottom:6}}>Clear all</button>}
    </div>}
    <div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",borderBottom:`2px solid ${P.border}`,marginBottom:2}}>
      {COLS.map(col=><div key={col.key} onClick={()=>{if(!col.sort)return;if(sk===col.key)setSd(d=>d==="asc"?"desc":"asc");else{setSk(col.key);setSd("asc");}}} style={{width:col.w,flex:col.flex,fontFamily:"'Nunito',sans-serif",fontSize:10,fontWeight:800,color:sk===col.key?P.accent:P.muted,textTransform:"uppercase",letterSpacing:.5,cursor:col.sort?"pointer":"default",display:"flex",alignItems:"center",gap:2,userSelect:"none",whiteSpace:"nowrap"}}>{col.label}{col.sort&&<span style={{fontSize:9,color:sk===col.key?P.accent:P.emptyStars}}>{sk===col.key?(sd==="asc"?"↑":"↓"):"⇅"}</span>}</div>)}
    </div>
    {sorted.length===0?<div style={{textAlign:"center",padding:"40px 0",color:P.muted,fontFamily:"'Nunito',sans-serif"}}>No books match these filters</div>
    :sorted.map((book,i)=><div key={book.id} onClick={()=>onSelect(book)} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 8px",background:i%2===0?P.bgCard:P.bgMid,borderRadius:8,cursor:"pointer",marginBottom:1,transition:"background .12s,border-color .12s"}} onMouseEnter={e=>e.currentTarget.style.background=P.bgSurface} onMouseLeave={e=>e.currentTarget.style.background=i%2===0?P.bgCard:P.bgMid}>
      <div style={{width:44,height:34,borderRadius:4,overflow:"hidden",background:P.bgSurface,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{book.cover?<img src={book.cover} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"}/>:<span style={{fontSize:16}}>📖</span>}</div>
      <div style={{flex:3,minWidth:0,fontFamily:"'Playfair Display',serif",fontWeight:700,color:P.text,fontSize:13,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{book.title}</div>
      <div style={{flex:2,minWidth:0,fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.textLt,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{book.authors?.[0]||"—"}</div>
      <div style={{width:52,fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,textAlign:"center",flexShrink:0}}>{book.year||"—"}</div>
      <div style={{width:44,fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,textAlign:"center",flexShrink:0}}>{book.pages||"—"}</div>
      <div style={{width:74,flexShrink:0}}><Pill label={SL[book.status]} color={SC[book.status]}/></div>
      <div style={{width:50,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{book.rating>0?<span style={{color:P.gold,fontSize:12,letterSpacing:-1}}>{"★".repeat(book.rating)}</span>:<span style={{color:P.emptyStars,fontSize:11}}>—</span>}</div>
      <div style={{flex:1.5,minWidth:0,fontFamily:"'Nunito',sans-serif",fontSize:11,color:P.textLt,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{book.genre||"—"}</div>
    </div>)}
  </div>;
}

// ─── Statistics Screen ────────────────────────────────────────────────────────
function StatCard({label,value,sub,color=P.accent}) {
  return <div style={{background:P.bgCard,borderRadius:16,padding:"18px 16px",border:`1px solid ${P.border}`,boxShadow:"0 2px 16px rgba(0,0,0,.3)"}}><div style={{fontFamily:"'Playfair Display',serif",fontSize:32,fontWeight:900,color,lineHeight:1}}>{value}</div><div style={{fontFamily:"'Nunito',sans-serif",fontSize:13,fontWeight:700,color:P.text,marginTop:4}}>{label}</div>{sub&&<div style={{fontFamily:"'Nunito',sans-serif",fontSize:11,color:P.muted,marginTop:2}}>{sub}</div>}</div>;
}
function MiniBar({label,value,max,color}) {
  const pct=max>0?Math.min((value/max)*100,100):0;
  return <div style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:P.text,fontWeight:600}}>{label}</span><span style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:P.muted,fontWeight:700}}>{value}</span></div><div style={{background:"rgba(128,128,160,.1)",borderRadius:6,height:8,overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:color||P.accent,borderRadius:6,transition:"width .5s ease",boxShadow:`0 0 6px ${color||P.accent}88`}}/></div></div>;
}
function StatsScreen({books,goal}) {
  const yr=thisYear();
  const allRead=books.filter(b=>b.status==="read");
  const readThisYear=books.filter(b=>b.status==="read"&&b.addedAt>new Date(yr,0,1).getTime());
  const totalPages=allRead.filter(b=>(b.bookFormat||"physical")!=="audiobook").reduce((s,b)=>s+(parseInt(b.pages)||0),0);
  const totalAudioMins=allRead.filter(b=>b.bookFormat==="audiobook").reduce((s,b)=>s+(parseInt(b.pages)||0),0);
  const rated=allRead.filter(b=>b.rating>0);
  const avgRating=rated.length>0?(rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1):"—";
  const longest=allRead.reduce((best,b)=>parseInt(b.pages||0)>parseInt(best?.pages||0)?b:best,null);
  const loaned=books.filter(b=>b.loan).length;
  const dnf=books.filter(b=>b.status==="dnf").length;
  const highlighted=books.filter(b=>b.highlights?.length>0).length;
  // Reading streak — consecutive months with at least 1 book read (use readDates, fall back to addedAt)
  const monthsWithBooks = new Set(allRead.map(b => {
    const d = b.readDates?.length ? b.readDates[b.readDates.length-1] : new Date(b.addedAt).toISOString().slice(0,10);
    return d.slice(0,7);
  }));
  let streak = 0;
  const now = new Date();
  for (let i = 0; i < 24; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.toISOString().slice(0,7);
    if (monthsWithBooks.has(key)) streak++;
    else if (i > 0) break;
  }

      </div>
    </div>
    {/* Reading pace — pages per week from progress history */}

      if(allProgress.length < 2) return null;

          <div style={{display:"flex",alignItems:"flex-end",gap:6,height:60}}>

    })()}

    {/* Genres */}

// ─── Achievement Badge ────────────────────────────────────────────────────────
function AchievementBadge({achievement, earned, newlyEarned=false, progress=null}) {
  const dim = !earned && !progress;
  const hasProgress = !earned && progress && progress.max > 0;
  const pct = hasProgress ? Math.min(100, Math.round(progress.n / progress.max * 100)) : 0;
  return (
    <div style={{background:earned?P.bgCard:P.bgSurface,borderRadius:14,padding:"14px 12px 10px",border:`1.5px solid ${earned?(newlyEarned?P.gold:P.border):hasProgress?P.accentDk:P.borderLt}`,display:"flex",flexDirection:"column",alignItems:"center",gap:8,textAlign:"center",opacity:dim?.4:1,transition:"all .2s",position:"relative",boxShadow:newlyEarned?`0 0 20px rgba(245,158,11,.4)`:earned?"0 2px 12px rgba(0,0,0,.3)":hasProgress?"0 2px 8px rgba(0,0,0,.2)":"none"}}>
      {newlyEarned&&<div style={{position:"absolute",top:-6,right:-6,background:P.gold,borderRadius:10,padding:"1px 6px",fontFamily:"'Nunito',sans-serif",fontSize:9,fontWeight:800,color:"#000"}}>NEW!</div>}
      <div style={{fontSize:28,filter:dim?"grayscale(1)":"none"}}>{achievement.icon}</div>
      <div>
        <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,fontWeight:800,color:earned?P.text:P.muted,lineHeight:1.3}}>{achievement.title}</div>
        <div style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:P.muted,marginTop:3,lineHeight:1.4}}>{achievement.desc}</div>
        <div style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:earned?P.gold:P.muted,fontWeight:700,marginTop:4}}>{achievement.xp} XP</div>
      </div>
      {hasProgress&&(
        <div style={{width:"100%",marginTop:0}}>
          <div style={{height:4,background:P.bgCard,borderRadius:3,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${P.accentDk},${P.accent})`,borderRadius:3,transition:"width .3s"}}/>
          </div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:9,color:P.accent,fontWeight:700,textAlign:"center",marginTop:3}}>{progress.n.toLocaleString()} / {progress.max.toLocaleString()} · {pct}%</div>

  );

// ─── Monthly Challenge Card ───────────────────────────────────────────────────
function MonthlyChallenge({books, completedChallenges=[]}) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth()+1;
  const ym = y+"-"+String(m).padStart(2,"0");
  const cur = MONTHLY_CHALLENGES.find(c=>c.ym===ym);
  if(!cur) return null;
  const isDone = completedChallenges.includes(ym);
  const MNAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const ymLabel = s=>{const parts=s.split("-");return MNAMES[parseInt(parts[1])-1]+" "+parts[0];};
  const past = MONTHLY_CHALLENGES.filter(c=>c.ym<ym).slice(-3);
  const next = MONTHLY_CHALLENGES.find(c=>c.ym>ym);
  let pr, pct;
  try { pr = cur.prog(books,y,m); pct = pr.max>0?Math.min(100,Math.round(pr.n/pr.max*100)):0; }
  catch(e) { pr = {n:0,max:1}; pct = 0; }
  return (
    <div style={{margin:"0 20px 18px"}}>
      <div style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Monthly Challenge</div>
      <div style={{background:isDone?"rgba(34,197,94,.08)":P.bgCard,borderRadius:16,padding:"16px",border:`1.5px solid ${isDone?"rgba(34,197,94,.4)":P.border}`,boxShadow:"0 4px 20px rgba(0,0,0,.3)",transition:"all .3s"}}>
        <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
          <div style={{fontSize:32,flexShrink:0,lineHeight:1}}>{cur.icon}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:2}}>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:16,fontWeight:700,color:P.text,lineHeight:1.2}}>{cur.title}</div>
              <div style={{fontFamily:"'Nunito',sans-serif",fontSize:11,color:P.gold,fontWeight:800,flexShrink:0,marginLeft:8}}>+{cur.xp} XP</div>
            </div>
            <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,marginBottom:8}}>{cur.desc}</div>
            {isDone
              ? <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:14}}>✅</span>
                  <span style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:"#22c55e",fontWeight:800}}>Challenge complete!</span>
                </div>
              : <div>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:P.muted,fontWeight:700}}>{pr.n} / {pr.max}</span>
                    <span style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:P.accent,fontWeight:700}}>{pct}%</span>
                  </div>
                  <div style={{background:"rgba(128,128,160,.12)",borderRadius:4,height:6,overflow:"hidden"}}>
                    <div style={{width:pct+"%",height:"100%",background:"linear-gradient(90deg,"+P.accentLt+","+P.accent+")",borderRadius:4,transition:"width .6s ease"}}/>
                  </div>
                </div>
            }
          </div>
        </div>
      </div>
      {(past.length>0||next)&&(
        <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
          {past.map(c=>(
            <div key={c.ym} style={{display:"flex",alignItems:"center",gap:4,background:completedChallenges.includes(c.ym)?"rgba(34,197,94,.1)":"rgba(128,128,160,.07)",borderRadius:8,padding:"4px 8px",border:"1px solid "+(completedChallenges.includes(c.ym)?"rgba(34,197,94,.25)":P.border)}}>
              <span style={{fontSize:12}}>{c.icon}</span>
              <span style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:P.muted}}>{ymLabel(c.ym)}</span>
              {completedChallenges.includes(c.ym)&&<span style={{fontSize:10}}>✅</span>}
            </div>
          ))}
          {next&&(
            <div style={{display:"flex",alignItems:"center",gap:4,background:"rgba(128,128,160,.04)",borderRadius:8,padding:"4px 8px",border:"1px dashed "+P.border,opacity:.7}}>
              <span style={{fontSize:12}}>{next.icon}</span>
              <span style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:P.muted}}>{ymLabel(next.ym)} coming up</span>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── Achievements Screen ──────────────────────────────────────────────────────
function AchievementsScreen({books, goal, earned, completedChallenges=[]}) {
  const xp = calcXP(books, goal, earned, completedChallenges);
  const {level} = calcLevel(xp);
  const earnedSet = new Set(earned);
  const earnedCount = ACHIEVEMENTS.filter(a=>earnedSet.has(a.id)).length;
  const totalXPAvailable = ACHIEVEMENTS.reduce((s,a)=>s+a.xp,0);
  const [filter, setFilter] = React.useState("all"); // "all" | "earned" | "locked"
  const categories = [
    {label:"📚 Reading",  ids:["first_book","five_books","ten_books","twentyfive","fifty_books","century","speed_reader","quick_read","epic_journey","binge_month"]},
    {label:"🗂 Library",  ids:["library10","library50","wishlist5","series_fan","pb_collector","hc_devotee","wishlist_20","big_library","series_complete"]},
    {label:"✏️ Depth",    ids:["critic","five_star","annotator","note_taker","halfway","librarian_lend","honest","re_reader","five_stars","highlighter"]},
    {label:"🌍 Explore",  ids:["genre_hopper","renaissance","genre_master","time_traveler","polyglot","scifi_reader","fantasy_reader","mystery_reader","thriller_reader","nonfiction_fan","history_buff"]},
    {label:"🎯 Goals",    ids:["goal_set","goal_half","goal_done"]},
    {label:"🎧 Format",   ids:["first_listen","on_the_road","ears_open","audio_addict","marathon_ear","binge_listen","pixel_pages","digital_shelf","ereader","paperless","format_curious","triple_format","omni_reader","multi_format"]},
  ];
  // Compute all progress values once, not on every badge render
  const allProgress = React.useMemo(()=>{
    const p={};

          ))}
        </div>
        {/* Category grids */}
        {categories.map(cat=>{
          const allCatAchs = ACHIEVEMENTS.filter(a=>cat.ids.includes(a.id));
          const catAchs = allCatAchs.filter(a=>

                })}

            </div>
          );
        })}
      </div>
    </div>
  );
}


// ─── CSV helpers ──────────────────────────────────────────────────────────────
function parseCSVLine(line) {
  const cols=[]; let cur=''; let inQ=false;
  for(const ch of line){
    if(ch==='"'){inQ=!inQ;}
    else if(ch===','&&!inQ){cols.push(cur);cur='';}
    else{cur+=ch;}
  }
  cols.push(cur);
  return cols.map(c=>c.replace(/^"|"$/g,'').replace(/""/g,'"').trim());
}

function parseGoodreadsCSV(text) {
  const lines = text.trim().split('\n');
  const headers = parseCSVLine(lines[0]).map(h=>h.toLowerCase());
  const books = [];
  for (let i = 1; i < lines.length; i++) {
    if(!lines[i].trim()) continue;
    const cols = parseCSVLine(lines[i]);
    const row = {};
    headers.forEach((h,j)=>{ row[h]=(cols[j]||'').trim(); });
    if (!row.title) continue;
    const statusMap = {
      'read':'read','currently-reading':'reading','currently reading':'reading',
      'to-read':'wishlist','to read':'wishlist','did-not-finish':'dnf',
      'owned':'owned','on-deck':'owned',
    };
    const grStatus = (row['exclusive shelf']||row['shelf']||row['read status']||'owned').toLowerCase();
    const status = statusMap[grStatus]||'owned';
    const rating = parseInt(row['my rating']||row['star rating']||'0')||0;
    const pages = row['number of pages']||row['pages']||'';
    const year = row['year published']||row['original publication year']||'';
    const isbn = (row['isbn13']||row['isbn']||'').replace(/[^0-9]/g,'');
    books.push({
      id:crypto.randomUUID(), title:row.title||'Unknown', subtitle:'',
      authors:[(row.author||row['primary author']||'Unknown').split(',')[0].trim()],
      cover: isbn.length===13?`https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg`:null,
      genre:row['bookshelves']||row['genres']||'', categories:[],
      year, publishedDate:year, publisher:row['publisher']||'',
      pages:pages.replace(/[^0-9]/g,''), description:'', language:'en',
      isbn13:isbn.length===13?isbn:'', isbn10:isbn.length===10?isbn:'',
      averageRating:parseFloat(row['average rating']||'0')||0, ratingsCount:0,
      previewLink:'', status, rating,
      notes:row['private notes']||row['notes']||'',
      addedAt:Date.now(), customShelves:[], readDates:[], highlights:[],
      bookFormat:'physical', bookBinding:'unknown', ownedFormats:['physical'],
    });
  }
  return books;
}

function parseBookshelfCSV(text) {
  const lines = text.trim().split('\n');
  const headers = parseCSVLine(lines[0]).map(h=>h.toLowerCase());
  const books = [];
  for (let i = 1; i < lines.length; i++) {
    if(!lines[i].trim()) continue;
    const cols = parseCSVLine(lines[i]);
    const row = {};
    headers.forEach((h,j)=>{ row[h]=(cols[j]||'').trim(); });
    if (!row.title) continue;
    const authors = row.author ? row.author.split('|').map(a=>a.trim()).filter(Boolean) : ['Unknown Author'];
    const shelves = row['custom shelves'] ? row['custom shelves'].split('|').filter(Boolean) : [];
    const highlights = row.highlights ? row.highlights.split('|').filter(Boolean).map(h=>({id:crypto.randomUUID(),text:h,addedAt:Date.now()})) : [];
    const isbn13 = row.isbn13||'';
    const fmt = row.format||'physical';
    const readDateStr = row['date read']||'';
    books.push({
      id:crypto.randomUUID(), title:row.title, subtitle:row.subtitle||'',
      authors,
      cover: isbn13.length===13?`https://covers.openlibrary.org/b/isbn/${isbn13}-L.jpg`:null,
      genre:row.genre||'', categories:row.genre?[row.genre]:[],
      year:row.year||'', publishedDate:row.year||'', publisher:'',
      pages:row.pages||'', description:'', language:'en',
      isbn13, isbn10:row.isbn10||'',
      averageRating:0, ratingsCount:0, previewLink:'',
      status:row.status||'owned',
      rating:parseInt(row.rating||'0')||0,
      notes:row.notes||'',
      addedAt: row['date added'] ? (new Date(row['date added']).getTime()||Date.now()) : Date.now(),
      readDates: readDateStr ? [readDateStr] : [],
      customShelves:shelves, highlights,
      bookFormat:fmt, bookBinding:row.binding||'unknown',
      ownedFormats:[fmt],
    });
  }
  return books;
}

function exportToCSV(books) {
  function esc(v) {
    const s = String(v==null?'':v);
    return (s.includes(',')||s.includes('"')||s.includes('\n')) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }
  const headers = ['Title','Author','Subtitle','Status','Rating','Format','Binding','Genre','Year','ISBN13','ISBN10','Pages','Notes','Date Added','Date Read','Custom Shelves','Highlights'];
  const rows = books.map(b=>[
    esc(b.title||''),
    esc((b.authors||[]).join('|')),
    esc(b.subtitle||''),
    esc(b.status||'owned'),
    esc(b.rating||0),
    esc(b.bookFormat||'physical'),
    esc(b.bookBinding||'unknown'),
    esc(b.genre||''),
    esc(b.year||''),
    esc(b.isbn13||''),
    esc(b.isbn10||''),
    esc(b.pages||''),
    esc(b.notes||''),
    esc(new Date(b.addedAt||Date.now()).toISOString().slice(0,10)),
    esc(b.readDates?.length>0 ? b.readDates[b.readDates.length-1] : ''),
    esc((b.customShelves||[]).join('|')),
    esc((b.highlights||[]).map(h=>h.text||'').join('|')),
  ].join(','));
  const csv = [headers.join(','),...rows].join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`bookshelf-export-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
}

        ?<button onClick={()=>setStep(s=>s+1)} style={{background:`linear-gradient(135deg,${P.accent},${P.accentDk})`,color:"#fff",border:"none",borderRadius:16,padding:"15px 48px",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:16,cursor:"pointer",boxShadow:`0 4px 20px ${P.accentGlow}`}}>Next →</button>
        :<button onClick={onDone} style={{background:`linear-gradient(135deg,${P.accent},${P.accentDk})`,color:"#fff",border:"none",borderRadius:16,padding:"15px 48px",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:16,cursor:"pointer",boxShadow:`0 4px 20px ${P.accentGlow}`}}>Get Started 🚀</button>}
      {step>0&&<button onClick={()=>setStep(s=>s-1)} style={{display:"block",margin:"12px auto 0",background:"none",border:"none",color:P.muted,fontFamily:"'Nunito',sans-serif",fontSize:13,fontWeight:600,cursor:"pointer"}}>← Back</button>}
    </div>
  );
}

// ─── Offline Banner ────────────────────────────────────────────────────────────
function OfflineBanner() {
  const [offline,setOffline]=useState(!navigator.onLine);
  useEffect(()=>{
    const on=()=>setOffline(false), off=()=>setOffline(true);
    window.addEventListener("online",on); window.addEventListener("offline",off);
    return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off);};
  },[]);
  if(!offline) return null;
  return (
    <div style={{position:"fixed",top:0,left:0,right:0,zIndex:999,background:"rgba(239,68,68,.95)",color:"#fff",padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"center",gap:8,fontFamily:"'Nunito',sans-serif",fontSize:13,fontWeight:700,backdropFilter:"blur(8px)"}}>
      <span>📡</span><span>You're offline — search and AI features won't work</span>
    </div>
  );
}

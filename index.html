  if('serviceWorker' in navigator){
    const SW=`

const SHELL=[
  'https://unpkg.com/react@18/umd/react.production.min.js',
  'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
  'https://unpkg.com/@babel/standalone/babel.min.js',
];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>Promise.allSettled(SHELL.map(u=>c.add(u).catch(()=>{})))).then(()=>self.skipWaiting()));});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});
self.addEventListener('fetch',e=>{
  const url=new URL(e.request.url);
  const skip=['openlibrary.org','api.anthropic.com','fonts.gstatic.com','amazon.com','barnesandnoble.com','halfpricebooks.com'].some(h=>url.hostname.includes(h));
  if(skip||e.request.method!=='GET')return;
  e.respondWith(caches.match(e.request).then(hit=>{if(hit)return hit;return fetch(e.request).then(res=>{if(res&&res.status===200&&res.type!=='opaque'){caches.open(CACHE).then(c=>c.put(e.request,res.clone()));}return res;}).catch(()=>{if(e.request.mode==='navigate')return caches.match('/index.html');});}));
});`;
    try{const blob=new Blob([SW],{type:'application/javascript'});const url=URL.createObjectURL(blob);navigator.serviceWorker.register(url,{scope:'/'}).then(()=>{console.log('SW v14 ok');URL.revokeObjectURL(url);}).catch(()=>{});}catch(e){}
  }
  // Apply saved theme before React renders (prevents flash)
  try{
    const t=JSON.parse(localStorage.getItem('bs_theme')||'"dark"');
    if(t==='light'){document.body.classList.add('light');document.body.style.background='#f5f5ff';document.body.style.color='#1a1a2e';}
  }catch(e){}
  // iOS install banner
  const standalone=window.navigator.standalone||window.matchMedia('(display-mode:standalone)').matches;
  const isSafari=/iP(hone|od|ad)/.test(navigator.userAgent)&&/Safari/.test(navigator.userAgent)&&!/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
  window.addEventListener('DOMContentLoaded',()=>{
    const banner=document.getElementById('install-banner');
    const close=document.getElementById('banner-close');

function calcXP(books, goal) {
  const readAll   = books.filter(b=>b.status==="read");
  const physical  = readAll.filter(b=>(b.bookFormat||"physical")==="physical").length;
  const ebooks    = readAll.filter(b=>b.bookFormat==="ebook").length;
  const audio     = readAll.filter(b=>b.bookFormat==="audiobook").length;
  const baseXP    = physical * 50 + ebooks * 55 + audio * 60; // slight bonus for tracked formats
  const ratingXP  = books.filter(b=>b.rating>0).length * 10;
  const noteXP    = books.filter(b=>b.notes?.trim()).length * 5;
  const highlightXP = books.reduce((s,b)=>s+(b.highlights?.length||0),0) * 8;
  // Bonus XP for owning the same title across multiple formats (excludes wishlist)
  const formatComboXP = (() => {
    const active = books.filter(b=>b.status!=="wishlist"&&b.status!=="suggestion");
    const byTitle = {};
    active.forEach(b=>{const t=b.title.toLowerCase(),f=b.bookFormat||"physical";if(!byTitle[t])byTitle[t]=new Set();byTitle[t].add(f);});
    return Object.values(byTitle).reduce((s,fmts)=>s+(fmts.size>=3?30:fmts.size>=2?15:0),0);
  })();
  return baseXP + ratingXP + noteXP + highlightXP + formatComboXP;
}

function calcLevel(xp) {
  // Level thresholds: 0,100,250,500,900,1400,2100,3000,4200,6000,...
  const thresholds = [0,100,250,500,900,1400,2100,3000,4200,6000,9000,14000];
  let level = 1;
  for (let i = 1; i < thresholds.length; i++) {
    if (xp >= thresholds[i]) level = i + 1;
    else break;
  }
  const curThresh = thresholds[Math.min(level-1, thresholds.length-1)];
  const nextThresh = thresholds[Math.min(level, thresholds.length-1)];
  const progress = nextThresh > curThresh ? (xp - curThresh) / (nextThresh - curThresh) : 1;
  return { level, xp, progress: Math.min(progress, 1), nextThresh };
}

// Detect binding from OL physical_format string
function detectBinding(physicalFormat) {

  const f = physicalFormat.toLowerCase();
  if(f.includes("mass market")) return "mass_market";
  if(f.includes("hardcover")||f.includes("hardback")) return "hardcover";

// Fetch editions of a work to find one matching preferred binding; falls back to any edition
async function fetchEditionForBinding(workKey, preferredBinding) {
  try {
    const r = await fetch(`https://openlibrary.org${workKey}/editions.json?limit=20`);
    if(!r.ok) return null;
    const editions = (await r.json()).entries||[];
    const hasISBN = e => e.isbn_13?.length||e.isbn_10?.length;
    const getISBN = e => e.isbn_13?.[0]||e.isbn_10?.[0]||null;
    // Prefer exact binding match
    const match = editions.find(e=>detectBinding(e.physical_format||"")===preferredBinding&&hasISBN(e));
    if(match) return { isbn:getISBN(match), binding:preferredBinding };
    // Fall back to any edition with an ISBN
    const any = editions.find(e=>hasISBN(e));
    if(any) return { isbn:getISBN(any), binding:detectBinding(any.physical_format||"") };
    return null;
  } catch { return null; }
}
function parseDoc(doc) {

  const raw=doc.description;

  const isoLang = Object.entries(OL_LANG).find(([,v])=>v===olLang)?.[0] || olLang.slice(0,2);

// lang = ISO code e.g. "en", "de". If provided, restrict results to that language.
async function olSearch(q, lim=12, lang=null) {
  const olCode = lang ? (OL_LANG[lang]||"eng") : "eng";
  const url = `${OL_SEARCH}?q=${encodeURIComponent(q)}&limit=${lim}&fields=${OL_FIELDS}&language=${olCode}`;
  const r = await fetch(url);
  if(!r.ok) throw new Error("Search failed");
  const docs = (await r.json())?.docs||[];
  const results = docs.map(parseDoc).filter(Boolean);
  // Secondary language filter: OL sometimes returns results ignoring the lang param
  if(lang) {

    return results.filter(b => {
      const bl = OL_LANG[b.language] || b.language;
      return bl === olCode2 || b.language === lang;
    });
  }
  return results;
}

function extractSeries(book) {

// existingBooks: full library so we can exclude already-added titles (any status)
async function fetchSeriesTitles(book, existingBooks=[]) {
  const sn=extractSeries(book), author=book.authors?.[0]||"";
  if(!sn&&!author) return [];
  // Exclude: scanned book itself + any book already in library (any status incl. wishlist)
  const exTitles = new Set([book.title.toLowerCase(), ...existingBooks.map(b=>b.title.toLowerCase())]);
  const exIds    = new Set([book.id, ...existingBooks.map(b=>b.id)]);
  const bookLang = book.language || "en";
  // Preferred binding for physical books; "unknown" means no preference
  const preferredBinding = book.bookFormat==="physical" ? (book.bookBinding||"unknown") : null;
  try {
    const res = await olSearch(sn ? `${sn} ${author}` : `${book.title} ${author}`, 32, bookLang);
    const aLast=author.split(" ").pop().toLowerCase(), sLow=sn?.toLowerCase()||"";
    const matched = res.filter(b=>{
      if(exIds.has(b.id)) return false;
      if(exTitles.has(b.title.toLowerCase())) return false;
      if((b.authors?.[0]||"").split(" ").pop().toLowerCase()!==aLast)return false;
      if(b.language && b.language !== bookLang) return false;
      if(sLow){const bp=b.title.match(/\(([^,)]+?)(?:\s*[,#]\s*\d+)?\)/i)?.[1]?.toLowerCase()||"";if(bp&&bp.includes(sLow.slice(0,6)))return true;}
      const stop=new Set(["the","a","an","of","and","in","to","for","with"]);
      const tok=t=>new Set(t.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(" ").filter(w=>w.length>3&&!stop.has(w)));
      return [...tok(b.title)].some(w=>tok(book.title).has(w));
    }).slice(0,15);
    // If we have a binding preference and a workKey, upgrade each result's cover/ISBN
    // to match the preferred binding via edition lookup (parallel, best-effort)
    if(preferredBinding && preferredBinding!=="unknown") {
      const upgraded = await Promise.all(matched.map(async b=>{
        if(!b.id||b.id.includes("-")) return b; // no work key
        const ed = await fetchEditionForBinding(`/works/${b.id}`, preferredBinding);
        if(!ed?.isbn) return b;
        const cover = `https://covers.openlibrary.org/b/isbn/${ed.isbn}-L.jpg`;
        const candidates = [cover, ...(b.coverCandidates||[]).filter(c=>c!==cover)];
        return {...b, isbn13:ed.isbn.length===13?ed.isbn:b.isbn13, isbn10:ed.isbn.length===10?ed.isbn:b.isbn10, cover, coverCandidates:candidates, bookBinding:ed.binding};
      }));
      return upgraded;
    }
    return matched;
  } catch { return []; }
}

// ─── Reading Progress ─────────────────────────────────────────────────────────
// For audiobooks: progress stored as minutes listened in currentPage field (reusing field)
// audioLength stored in pages field (total minutes)
function fmtMinutes(mins) {
  const m = Math.max(0, Math.round(mins));
  const h = Math.floor(m/60), mm = m%60;
  return h>0 ? `${h}h ${mm}m` : `${mm}m`;
}
function ReadingProgressModal({book,onSave,onClose}) {
  const fmt = book.bookFormat||"physical";
  const isAudio = fmt==="audiobook";
  const pages=parseInt(book.pages)||0, current=book.currentPage||0;
  const [page,setPage]=useState(current);
  const [mode,setMode]=useState(isAudio?"pct":pages>0?"page":"pct");
  // For audiobooks: page = minutes listened, pages = total minutes
  const pct = isAudio
    ? (pages>0?Math.round((page/pages)*100):Math.min(page,100))
    : (mode==="page"&&pages>0?Math.round((page/pages)*100):page);
  const actualPage = isAudio
    ? page
    : (mode==="pct"&&pages>0?Math.round((page/100)*pages):page);
  const maxVal = isAudio ? (pages||0) : (mode==="page"?pages:100);
  function save(){
    const entry={date:today(),page:actualPage,pct:pages>0?Math.round((actualPage/pages)*100):(mode==="pct"?page:0)};
    const history=[...(book.progressHistory||[]).filter(h=>h.date!==entry.date),entry].sort((a,b)=>a.date.localeCompare(b.date));
    onSave({...book,currentPage:actualPage,progressHistory:history});onClose();
  }
  const last7=(book.progressHistory||[]).slice(-7);
  const unitLabel = isAudio
    ? (pages>0?`of ${fmtMinutes(pages)} total`:"min listened")
    : (mode==="page"?`of ${pages} pages`:"% complete");
  return <div>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
      <h3 style={{fontFamily:"'Playfair Display',serif",color:P.text,marginTop:0,fontSize:20,margin:0}}>{isAudio?"🎧":fmt==="ebook"?"📱":"📖"} {isAudio?"Listening":"Reading"} Progress</h3>
    </div>
    <p style={{fontFamily:"'Nunito',sans-serif",color:P.muted,fontSize:13,marginBottom:18,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{book.title}</p>
    {!isAudio&&pages>0&&<div style={{display:"flex",background:P.bgSurface,borderRadius:10,padding:3,marginBottom:16,width:"fit-content",border:`1px solid ${P.border}`}}>{[["page","Page #"],["pct","Percent"]].map(([m,l])=><button key={m} onClick={()=>setMode(m)} style={{background:mode===m?P.accent:"transparent",border:"none",borderRadius:8,padding:"6px 16px",fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:13,color:mode===m?"#fff":P.muted,cursor:"pointer",transition:"all .15s"}}>{l}</button>)}</div>}
    {isAudio&&<div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,marginBottom:12}}>Enter minutes listened so far (e.g. 90 = 1h 30m)</div>}
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
      <input type="number" value={page} min={0} max={maxVal>0?maxVal:undefined} onChange={e=>setPage(maxVal>0?Math.min(Number(e.target.value),maxVal):Math.max(0,Number(e.target.value)))} style={{width:90,border:`1.5px solid ${P.border}`,borderRadius:10,padding:"10px 12px",fontFamily:"'Nunito',sans-serif",fontSize:18,fontWeight:700,color:P.text,background:P.cream,outline:"none",textAlign:"center"}}/>
      <span style={{fontFamily:"'Nunito',sans-serif",color:P.muted,fontSize:13}}>{unitLabel}</span>
    </div>
    {maxVal>0&&<input type="range" min={0} max={maxVal} value={page} onChange={e=>setPage(Number(e.target.value))} style={{width:"100%",accentColor:P.accent,marginBottom:12}}/>}
    <ProgressBar value={pct} max={100}/>
    <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,marginTop:6,marginBottom:last7.length>1?16:20}}>
      {isAudio?`${fmtMinutes(page)} listened · ${pct}% complete`:(`${pct}% complete${pages>0&&mode==="pct"?` · ~${actualPage} of ${pages} pages`:""}`)}
    </div>
    {last7.length>1&&<div style={{marginBottom:20}}><div style={{fontFamily:"'Nunito',sans-serif",fontSize:11,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Progress History</div><div style={{display:"flex",alignItems:"flex-end",gap:5,height:60}}>{last7.map((h,i)=>{const maxP=Math.max(...last7.map(x=>x.pct),1),barH=Math.max((h.pct/maxP)*52,4);return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}><div style={{width:"100%",height:barH,background:i===last7.length-1?P.accent:`rgba(99,102,241,${0.15+i*0.06})`,borderRadius:3}} title={`${h.pct}% on ${h.date}`}/><span style={{fontFamily:"'Nunito',sans-serif",fontSize:8,color:P.muted}}>{h.date.slice(5)}</span></div>;})} </div></div>}
    <div style={{display:"flex",gap:10}}><button onClick={save} style={{flex:1,background:`linear-gradient(135deg,${P.accent},${P.accentDk})`,color:"#fff",border:"none",borderRadius:14,padding:"14px",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:15,cursor:"pointer",boxShadow:`0 4px 16px ${P.accentGlow}`}}>Save Progress</button><button onClick={onClose} style={{background:P.bgSurface,color:P.muted,border:`1px solid ${P.border}`,borderRadius:14,padding:"14px 18px",fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:14,cursor:"pointer"}}>Cancel</button></div>
  </div>;
}

function BarcodeScanner({onDetected,onClose}) {

    return()=>{active=false;streamRef.current?.getTracks().forEach(t=>t.stop());};
  },[]);
  return <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16}}><div style={{position:"relative",width:"100%",borderRadius:14,overflow:"hidden",background:"#000",aspectRatio:"4/3"}}><video ref={vidRef} autoPlay playsInline muted style={{width:"100%",height:"100%",objectFit:"cover"}}/><div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}><div style={{width:"78%",height:90,border:`2px solid ${P.accent}`,borderRadius:10,boxShadow:`0 0 0 2000px rgba(0,0,0,.55), 0 0 20px ${P.accentGlow}`}}/></div></div><p style={{fontFamily:"'Nunito',sans-serif",color:P.textLt,fontSize:14}}>{status}</p><button onClick={onClose} style={{background:P.bgSurface,border:`1px solid ${P.border}`,borderRadius:20,padding:"9px 24px",fontFamily:"'Nunito',sans-serif",color:P.muted,cursor:"pointer"}}>Cancel</button></div>;
}
function CoverScanner({onDetected,onClose}) {
  const fileRef=useRef(null);const [busy,setBusy]=useState(false);const [msg,setMsg]=useState("");
  async function handle(file){
    if(!file)return;setBusy(true);setMsg("Identifying cover with AI…");
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:400,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:'Identify this book cover. Respond ONLY with JSON (no markdown): {"title":"","author":"","isbn":"","language":"en"}. Language should be the 2-letter ISO code of the book\'s text. If unidentifiable: {"error":"..."}'}]}]})});
      const rd=await resp.json();
      const txt=rd?.content?.[0]?.text||"{}";
      const result=JSON.parse(txt.replace(/```json|```/g,"").trim());
      if(result.error){setMsg("Couldn't identify — try a clearer photo.");setBusy(false);return;}
      const lang=result.language||"en";
      // Search in detected language first; fall back to no language filter
      let books=await olSearch(`${result.isbn||""} ${result.title} ${result.author}`.trim(),5,lang);
      if(!books.length) books=await olSearch(`${result.title} ${result.author}`.trim(),5,null);
      onDetected(books[0]||{id:crypto.randomUUID(),title:result.title,authors:[result.author],cover:null,coverCandidates:[],isbn13:"",isbn10:"",genre:"",year:"",pages:"",description:"",language:lang,status:"owned",rating:0,notes:"",addedAt:Date.now(),customShelves:[],readDates:[],highlights:[]});
    }catch{setMsg("Error — please try again.");setBusy(false);}
  }
  return <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20}}><div onClick={()=>fileRef.current?.click()} style={{width:"100%",aspectRatio:"3/2",border:`2px dashed ${P.border}`,borderRadius:16,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,cursor:"pointer",background:P.bgSurface,transition:"border-color .2s"}} onMouseEnter={e=>e.currentTarget.style.borderColor=P.accent} onMouseLeave={e=>e.currentTarget.style.borderColor=P.border}><span style={{fontSize:52}}>{busy?"⏳":"📸"}</span><span style={{fontFamily:"'Nunito',sans-serif",color:P.textLt,fontSize:15}}>{busy?msg:"Tap to take or upload a photo"}</span><span style={{fontFamily:"'Nunito',sans-serif",color:P.muted,fontSize:12}}>AI identifies the book</span></div><input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>handle(e.target.files[0])}/><button onClick={onClose} style={{background:P.bgSurface,border:`1px solid ${P.border}`,borderRadius:20,padding:"9px 24px",fontFamily:"'Nunito',sans-serif",color:P.muted,cursor:"pointer"}}>Cancel</button></div>;
}

// Validates a cover URL by trying to load it — returns true if image loads
function useCoverValid(url) {
  const [ok,setOk]=useState(false);
  useEffect(()=>{
    if(!url){setOk(false);return;}
    const img=new Image();img.onload=()=>setOk(true);img.onerror=()=>setOk(false);img.src=url;
  },[url]);

}

function CoverPickerModal({book, onSelect, onClose}) {
  const [candidates,setCandidates]=useState(book.coverCandidates||[]);

  const fileRef=useRef();
  function pickFile(file){
    if(!file)return;
    setUploading(true);
    const r=new FileReader();
    r.onload=e=>{
      // Store as data URL — user's own image
      const url=e.target.result;
      setCandidates(c=>[url,...c.filter(x=>x!==url)]);
      setSelected(url);
      setUploading(false);
    };
    r.readAsDataURL(file);
  }

function StatsScreen({books,goal}) {
  const yr=thisYear();
  const allRead=books.filter(b=>b.status==="read");
  const readThisYear=books.filter(b=>b.status==="read"&&b.addedAt>new Date(yr,0,1).getTime());
  const totalPages=allRead.filter(b=>(b.bookFormat||"physical")!=="audiobook").reduce((s,b)=>s+(parseInt(b.pages)||0),0);
  const totalAudioMins=allRead.filter(b=>b.bookFormat==="audiobook").reduce((s,b)=>s+(parseInt(b.pages)||0),0);
  const rated=allRead.filter(b=>b.rating>0);
  const avgRating=rated.length>0?(rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1):"—";
  const longest=allRead.reduce((best,b)=>parseInt(b.pages||0)>parseInt(best?.pages||0)?b:best,null);
  const loaned=books.filter(b=>b.loan).length;
  const dnf=books.filter(b=>b.status==="dnf").length;
  const highlighted=books.filter(b=>b.highlights?.length>0).length;
  // Reading streak — consecutive months with at least 1 book read (use readDates, fall back to addedAt)
  const monthsWithBooks = new Set(allRead.map(b => {
    const d = b.readDates?.length ? b.readDates[b.readDates.length-1] : new Date(b.addedAt).toISOString().slice(0,10);
    return d.slice(0,7);
  }));
  let streak = 0;
  const now = new Date();
  for (let i = 0; i < 24; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.toISOString().slice(0,7);
    if (monthsWithBooks.has(key)) streak++;
    else if (i > 0) break;
  }
  const avgPagesPerBook = allRead.length > 0 ? Math.round(totalPages / allRead.length) : 0;
  // Genre breakdown
  const gC={};allRead.filter(b=>b.genre).forEach(b=>{gC[b.genre]=(gC[b.genre]||0)+1;});
  const topG=Object.entries(gC).sort((a,b)=>b[1]-a[1]).slice(0,6),maxG=topG[0]?.[1]||1;
  // Monthly chart
  const mNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const bpm=Array(12).fill(0);
  readThisYear.forEach(b=>{bpm[new Date(b.addedAt).getMonth()]++;});
  const maxM=Math.max(...bpm,1);
  // Top authors
  const aC={};books.forEach(b=>b.authors?.forEach(a=>{if(a&&a!=="Unknown Author")aC[a]=(aC[a]||0)+1;}));
  const topA=Object.entries(aC).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const favGenre=topG[0]?.[0]||"—",favAuthor=topA[0]?.[0]||"—";
  return <div style={{paddingBottom:84}}>
    <div style={{padding:"48px 20px 16px"}}><h1 style={{fontFamily:"'Playfair Display',serif",fontSize:30,color:P.text,margin:0,fontWeight:900}}>Statistics</h1></div>

      <div style={{margin:"0 20px 20px",background:P.bgCard,borderRadius:16,padding:"32px 20px",border:`1px solid ${P.border}`,textAlign:"center"}}>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
        {[["📖 Genre",favGenre],["⭐ 5-Star",allRead.filter(b=>b.rating===5).length],["📄 Pages",totalPages>0?totalPages.toLocaleString():"—"]].map(([l,v])=><div key={l} style={{background:P.recapPill,borderRadius:10,padding:"10px 12px"}}><div style={{fontFamily:"'Nunito',sans-serif",fontSize:9,opacity:.7,marginBottom:3,textTransform:"uppercase",letterSpacing:.5}}>{l}</div><div style={{fontFamily:"'Nunito',sans-serif",fontSize:15,fontWeight:800}}>{v||"—"}</div></div>)}
      </div>
    </div></div>}

    {/* Stat grid */}
    <div style={{padding:"0 20px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
      <StatCard label="Books Read" value={allRead.length} sub="all time" color={SC.read}/>

      {totalAudioMins>0&&<StatCard label="Hours Listened" value={`${Math.floor(totalAudioMins/60)}h`} sub={`${totalAudioMins%60>0?`${totalAudioMins%60}m `:""}`+"audiobooks"} color="#10b981"/>}
      {loaned>0&&<StatCard label="Lent Out" value={loaned} sub="books loaned" color="#8b68b0"/>}
      {dnf>0&&<StatCard label="DNF'd" value={dnf} sub="did not finish" color={SC.dnf}/>}
      {highlighted>0&&<StatCard label="Highlighted" value={highlighted} sub="annotated" color={P.accent}/>}
      {longest&&<StatCard label="Longest Book" value={longest.pages?`${parseInt(longest.pages).toLocaleString()}p`:"—"} sub={longest.title.slice(0,22)+(longest.title.length>22?"…":"")} color={SC.reading}/>}
      {streak>0&&<StatCard label="Month Streak" value={`${streak}mo`} sub="consecutive months" color={P.gold}/>}
      {avgPagesPerBook>0&&<StatCard label="Avg Book Length" value={`${avgPagesPerBook}p`} sub="pages per book" color={P.accentLt}/>}
    </div>
    {/* Monthly chart */}
    <div style={{margin:"0 20px 20px",background:P.bgCard,borderRadius:16,padding:"18px 16px",border:`1px solid ${P.border}`,boxShadow:"0 2px 16px rgba(0,0,0,.3)"}}>

      <div style={{display:"flex",alignItems:"flex-end",gap:4,height:80}}>
        {bpm.map((v,i)=>{const h=v>0?Math.max((v/maxM)*68,8):0,now=new Date().getMonth()===i;return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}><div style={{width:"100%",height:h,background:now?P.accent:P.borderAccent,borderRadius:"3px 3px 0 0",transition:"height .4s",boxShadow:now?`0 0 10px ${P.accentGlow}`:""}} title={`${v} books`}/><span style={{fontFamily:"'Nunito',sans-serif",fontSize:7,color:now?P.accent:P.muted,fontWeight:now?800:400}}>{mNames[i][0]}</span></div>;})}
      </div>
    </div>
    {/* Reading pace — pages per week from progress history */}
    {(() => {
      const allProgress = books.flatMap(b=>(b.progressHistory||[]).map(h=>({...h,bookId:b.id,bookTitle:b.title,bookPages:parseInt(b.pages)||0})));
      if(allProgress.length < 2) return null;
      const sorted = [...allProgress].sort((a,b)=>a.date.localeCompare(b.date));
      const last8 = sorted.slice(-8);
      const maxPages = Math.max(...last8.map(h=>h.page||0), 1);
      const booksInProgress = books.filter(b=>b.status==="reading"&&(b.currentPage||0)>0);
      const estimatedDaysLeft = booksInProgress.map(b=>{
        const pages=parseInt(b.pages)||0, cur=b.currentPage||0, remaining=pages-cur;
        const hist=(b.progressHistory||[]);
        if(hist.length<2||remaining<=0) return null;
        const recent=hist.slice(-3);
        const daysBetween=(new Date(recent[recent.length-1].date)-new Date(recent[0].date))/(864e5)||1;
        const pagesPerDay=(recent[recent.length-1].page-recent[0].page)/daysBetween;
        return pagesPerDay>0?{title:b.title,days:Math.ceil(remaining/pagesPerDay)}:null;
      }).filter(Boolean);

                {e.days<=1?"Finishing today!":e.days<=7?`~${e.days} days to finish`:`~${Math.ceil(e.days/7)} weeks to finish`}
              </div>
            </div>
          ))}
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:11,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginBottom:8,marginTop:estimatedDaysLeft.length>0?14:0}}>Recent Sessions</div>
          <div style={{display:"flex",alignItems:"flex-end",gap:6,height:60}}>
            {last8.map((h,i)=>{
              const barH=Math.max(((h.page||0)/maxPages)*52,4);
              return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                <div style={{width:"100%",height:barH,background:i===last8.length-1?P.accent:`rgba(99,102,241,${0.2+i*0.08})`,borderRadius:"3px 3px 0 0",transition:"height .4s"}} title={`p.${h.page} on ${h.date}`}/>
                <span style={{fontFamily:"'Nunito',sans-serif",fontSize:7,color:P.muted}}>{h.date.slice(5)}</span>
              </div>;
            })}
          </div>
        </div>
      );
    })()}

    {/* Genres */}
    {topG.length>0&&<div style={{margin:"0 20px 20px",background:P.bgCard,borderRadius:16,padding:"18px 16px",border:`1px solid ${P.border}`,boxShadow:"0 2px 16px rgba(0,0,0,.3)"}}>
      <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginBottom:14}}>Top Genres</div>
      {topG.map(([g,c],i)=><MiniBar key={g} label={g} value={c} max={maxG} color={[P.accent,SC.read,SC.reading,P.purple,SC.dnf,P.accentLt][i%6]}/>)}
    </div>}
    {/* Top authors */}
    {topA.length>0&&<div style={{margin:"0 20px 20px",background:P.bgCard,borderRadius:16,padding:"18px 16px",border:`1px solid ${P.border}`,boxShadow:"0 2px 16px rgba(0,0,0,.3)"}}>
      <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginBottom:14}}>Top Authors</div>
      {topA.map(([a,c],i)=><MiniBar key={a} label={a} value={c} max={topA[0][1]} color={i===0?P.accent:undefined}/>)}
    </div>}
    {/* 5-star reads */}
    {allRead.filter(b=>b.rating===5).length>0&&<div style={{margin:"0 20px 20px",background:P.bgCard,borderRadius:16,padding:"18px 16px",border:`1px solid ${P.border}`,boxShadow:"0 2px 16px rgba(0,0,0,.3)"}}>
      <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginBottom:14}}>⭐ Five-Star Reads</div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {allRead.filter(b=>b.rating===5).slice(0,5).map(b=><div key={b.id} style={{display:"flex",gap:10,alignItems:"center"}}><div style={{width:36,height:50,borderRadius:5,overflow:"hidden",background:P.bgSurface,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{b.cover?<img src={b.cover} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"}/>:<span style={{fontSize:14}}>📖</span>}</div><div style={{flex:1,minWidth:0}}><div style={{fontFamily:"'Playfair Display',serif",fontWeight:700,color:P.text,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{b.title}</div><div style={{fontFamily:"'Nunito',sans-serif",color:P.textLt,fontSize:11}}>{b.authors?.[0]||""}</div></div></div>)}
      </div>
    </div>}
  </div>;
}

// ─── Wishlist Export ──────────────────────────────────────────────────────────

  return <div style={{paddingBottom:84}}>
    <div style={{padding:"48px 20px 16px"}}><h1 style={{fontFamily:"'Playfair Display',serif",fontSize:30,color:P.text,margin:"0 0 6px",fontWeight:900}}>Suggestions</h1><p style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:P.muted,lineHeight:1.5}}>Claude finds your next perfect read from {owned.length} book{owned.length!==1?"s":""} in your library.</p></div>

// ─── CSV Import (Goodreads / StoryGraph) ─────────────────────────────────────
function parseGoodreadsCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim().toLowerCase());
  const books = [];
  for (let i = 1; i < lines.length; i++) {
    // Handle quoted fields with commas inside
    const cols = []; let cur = ''; let inQ = false;
    for (const ch of lines[i]) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    const row = {};
    headers.forEach((h, i) => { row[h] = (cols[i] || '').replace(/^"|"$/g,'').trim(); });
    if (!row.title) continue;
    // Map Goodreads/StoryGraph fields to our model
    const statusMap = {
      'read': 'read', 'currently-reading': 'reading', 'currently reading': 'reading',
      'to-read': 'wishlist', 'to read': 'wishlist', 'did-not-finish': 'dnf',
      'owned': 'owned', 'on-deck': 'owned',
    };
    const grStatus = (row['exclusive shelf'] || row['shelf'] || row['read status'] || 'owned').toLowerCase();
    const status = statusMap[grStatus] || 'owned';
    const rating = parseInt(row['my rating'] || row['star rating'] || '0') || 0;
    const pages = row['number of pages'] || row['pages'] || '';
    const year = row['year published'] || row['original publication year'] || '';
    const isbn = (row['isbn13'] || row['isbn'] || '').replace(/[^0-9]/g,'');
    books.push({
      id: crypto.randomUUID(),
      title: row.title || 'Unknown',
      subtitle: '',
      authors: [(row.author || row['primary author'] || 'Unknown').split(',')[0].trim()],
      cover: isbn.length === 13 ? `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg` : null,
      genre: row['bookshelves'] || row['genres'] || '',
      categories: [],
      year, publishedDate: year,
      publisher: row['publisher'] || '',
      pages: pages.replace(/[^0-9]/g,''),
      description: '',
      language: 'en',
      isbn13: isbn.length === 13 ? isbn : '',
      isbn10: isbn.length === 10 ? isbn : '',
      averageRating: parseFloat(row['average rating'] || '0') || 0,
      ratingsCount: 0,
      previewLink: '',
      status, rating,
      notes: row['private notes'] || row['notes'] || '',
      addedAt: Date.now(),
      customShelves: [], readDates: [], highlights: [],
    });
  }
  return books;
}

function CSVImportModal({ onImport, onClose }) {
  const fileRef = useRef(null);
  const [preview, setPreview] = useState(null);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function handleFile(file) {
    if (!file) return;
    setBusy(true); setError(''); setPreview(null);
    try {
      const text = await file.text();
      const books = parseGoodreadsCSV(text);
      if (books.length === 0) { setError('No books found. Make sure this is a Goodreads or StoryGraph export CSV.'); setBusy(false); return; }
      setPreview(books);
    } catch(e) { setError('Could not parse file. Please use a Goodreads or StoryGraph CSV export.'); }
    setBusy(false);
  }

  const byStatus = preview ? {
    read: preview.filter(b=>b.status==='read').length,
    reading: preview.filter(b=>b.status==='reading').length,
    wishlist: preview.filter(b=>b.status==='wishlist').length,

// ─── Backup & Restore ────────────────────────────────────────────────────────
function BackupModal({books, shelves, goal, earnedAchs, onRestore, onClose}) {
  const [restoreState, setRestoreState] = useState(null); // null | 'confirm' | 'done' | 'error'
  const [pendingData, setPendingData]   = useState(null);
  const [errMsg, setErrMsg]             = useState("");
  const fileRef = useRef();

  const lastBackup = load("lastBackup", null);
  const lastBackupStr = lastBackup
    ? new Date(lastBackup).toLocaleDateString(undefined, {month:"short",day:"numeric",year:"numeric"})
    : "Never";

  function doExport() {
    const payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      books,
      shelves,
      goal,
      earnedAchs,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = `bookshelf-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    save("lastBackup", Date.now());
    onClose();
  }

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.books || !Array.isArray(data.books)) throw new Error("Invalid backup file.");
        setPendingData(data);
        setRestoreState("confirm");
      } catch(err) {
        setErrMsg("That file doesn't look like a Bookshelf backup.");
        setRestoreState("error");
      }
    };
    reader.readAsText(file);
  }

  function confirmRestore() {
    onRestore(pendingData);
    save("lastBackup", Date.now());
    setRestoreState("done");
  }

  if (restoreState === "confirm") return (
    <div style={{padding:"8px 0"}}>
      <div style={{width:56,height:56,borderRadius:28,background:"rgba(99,102,241,.15)",border:`2px solid ${P.accent}`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",fontSize:26}}>⚠️</div>
      <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700,color:P.text,textAlign:"center",marginBottom:8}}>Replace Library?</div>
      <div style={{fontFamily:"'Nunito',sans-serif",fontSize:14,color:P.textLt,textAlign:"center",lineHeight:1.6,marginBottom:8}}>
        This will replace your current library with <strong style={{color:P.accent}}>{pendingData.books.length} books</strong> from the backup.
      </div>
      <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,textAlign:"center",marginBottom:24}}>
        Backed up: {new Date(pendingData.exportedAt).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
      </div>
      <div style={{display:"flex",gap:10}}>
        <button onClick={confirmRestore} style={{flex:1,background:`linear-gradient(135deg,${P.accent},${P.accentDk})`,color:"#fff",border:"none",borderRadius:14,padding:"14px",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:15,cursor:"pointer",boxShadow:`0 4px 16px ${P.accentGlow}`}}>Yes, Restore</button>
        <button onClick={()=>setRestoreState(null)} style={{background:P.bgSurface,color:P.muted,border:`1px solid ${P.border}`,borderRadius:14,padding:"14px 18px",fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:14,cursor:"pointer"}}>Cancel</button>
      </div>
    </div>
  );

  if (restoreState === "done") return (
    <div style={{padding:"8px 0",textAlign:"center"}}>
      <div style={{fontSize:52,marginBottom:16}}>✅</div>
      <div style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:700,color:P.text,marginBottom:8}}>Library Restored!</div>
      <div style={{fontFamily:"'Nunito',sans-serif",fontSize:14,color:P.textLt,marginBottom:24}}>{pendingData.books.length} books loaded from backup.</div>
      <button onClick={onClose} style={{background:`linear-gradient(135deg,${P.accent},${P.accentDk})`,color:"#fff",border:"none",borderRadius:14,padding:"14px 32px",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:15,cursor:"pointer"}}>Done</button>
    </div>
  );

  if (restoreState === "error") return (
    <div style={{padding:"8px 0",textAlign:"center"}}>
      <div style={{fontSize:52,marginBottom:16}}>❌</div>
      <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700,color:P.text,marginBottom:8}}>Couldn't Read File</div>
      <div style={{fontFamily:"'Nunito',sans-serif",fontSize:14,color:P.muted,marginBottom:24}}>{errMsg}</div>
      <button onClick={()=>setRestoreState(null)} style={{background:P.bgSurface,color:P.muted,border:`1px solid ${P.border}`,borderRadius:14,padding:"12px 28px",fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:14,cursor:"pointer"}}>Try Again</button>
    </div>
  );

  return (
    <div style={{padding:"8px 0"}}>
      <div style={{textAlign:"center",marginBottom:24}}>
        <div style={{width:56,height:56,borderRadius:28,background:"rgba(99,102,241,.15)",border:`2px solid ${P.accent}`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",fontSize:26}}>💾</div>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:700,color:P.text,marginBottom:4}}>Backup & Restore</div>
        <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted}}>Last backup: <strong style={{color:lastBackup?P.green:P.red}}>{lastBackupStr}</strong></div>
      </div>

      {/* Export */}
      <div style={{background:P.bgSurface,borderRadius:16,padding:"18px 20px",marginBottom:12,border:`1px solid ${P.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:12}}>
          <div style={{fontSize:28}}>📤</div>
          <div>
            <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:15,color:P.text}}>Export Backup</div>
            <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,marginTop:2}}>Downloads a JSON file with all {books.length} books, shelves, ratings, notes & highlights</div>
          </div>
        </div>
        <button onClick={doExport}
          style={{width:"100%",background:`linear-gradient(135deg,${P.accent},${P.accentDk})`,color:"#fff",border:"none",borderRadius:12,padding:"13px",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:14,cursor:"pointer",boxShadow:`0 4px 16px ${P.accentGlow}`}}>
          Download Backup File
        </button>
      </div>

      {/* Restore */}
      <div style={{background:P.bgSurface,borderRadius:16,padding:"18px 20px",marginBottom:20,border:`1px solid ${P.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:12}}>
          <div style={{fontSize:28}}>📥</div>
          <div>
            <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:15,color:P.text}}>Restore from Backup</div>
            <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,marginTop:2}}>Load a previously exported JSON backup file</div>
          </div>
        </div>
        <button onClick={()=>fileRef.current?.click()}
          style={{width:"100%",background:P.bgCard,color:P.textLt,border:`1.5px dashed ${P.border}`,borderRadius:12,padding:"13px",fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:14,cursor:"pointer"}}>
          Choose Backup File…
        </button>
        <input ref={fileRef} type="file" accept=".json,application/json" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
      </div>

      {/* Tip */}
      <div style={{background:"rgba(99,102,241,.08)",borderRadius:12,padding:"12px 16px",border:`1px solid ${P.borderAccent}`}}>
        <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.textLt,lineHeight:1.6}}>
          💡 <strong>Tip:</strong> Back up weekly and save the file to iCloud Drive or Google Drive so you can restore on any device.
        </div>
      </div>
    </div>
  );
}

// ─── Offline Banner ────────────────────────────────────────────────────────────
function OfflineBanner() {
  const [offline,setOffline]=useState(!navigator.onLine);
  useEffect(()=>{
    const on=()=>setOffline(false), off=()=>setOffline(true);
    window.addEventListener("online",on); window.addEventListener("offline",off);
    return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off);};
  },[]);
  if(!offline) return null;
  return (
    <div style={{position:"fixed",top:0,left:0,right:0,zIndex:999,background:"rgba(239,68,68,.95)",color:"#fff",padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"center",gap:8,fontFamily:"'Nunito',sans-serif",fontSize:13,fontWeight:700,backdropFilter:"blur(8px)"}}>
      <span>📡</span><span>You're offline — search and AI features won't work</span>
    </div>
  );
}

          <select value={filterGenre} onChange={e=>setFilterGenre(e.target.value)} style={{width:"100%",border:`1.5px solid ${P.border}`,borderRadius:10,padding:"8px 12px",fontFamily:"'Nunito',sans-serif",fontSize:13,background:P.bgSurface,color:filterGenre!=="all"?P.text:P.muted,outline:"none",cursor:"pointer"}}>
            <option value="all">All Genres</option>
            {genres.map(g=><option key={g} value={g}>{g}</option>)}
          </select>
        </div>}
        {/* Shelf */}
        {customShelves.length>0&&<div style={{marginBottom:14}}>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Shelf</div>
          <select value={shelfFilter} onChange={e=>setShelfFilter(e.target.value)} style={{width:"100%",border:`1.5px solid ${P.border}`,borderRadius:10,padding:"8px 12px",fontFamily:"'Nunito',sans-serif",fontSize:13,background:P.bgSurface,color:shelfFilter!=="all"?P.text:P.muted,outline:"none",cursor:"pointer"}}>
            <option value="all">All Shelves</option>
            {customShelves.map(s=><option key={s} value={s}>📂 {s}</option>)}
          </select>
        </div>}
        {/* Sort */}
        <div style={{marginBottom:14}}>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Sort By</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {[["recent","Recent"],["title","Title"],["author","Author"],["rating","Rating ★"],["pages","Pages"]].map(([v,l])=><button key={v} onClick={()=>setSortBy(v)} style={{background:sortBy===v?P.accent:"transparent",color:sortBy===v?"#fff":P.muted,border:`1px solid ${sortBy===v?P.accent:P.border}`,borderRadius:8,padding:"5px 10px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",fontSize:11,fontWeight:700,transition:"all .12s"}}>{l}</button>)}
          </div>
        </div>
        {/* Save view / close */}
        <div style={{display:"flex",gap:8,paddingTop:4,borderTop:`1px solid ${P.border}`}}>
          <button onClick={()=>{setOpen(false);onSaveView();}} style={{flex:1,background:P.bgSurface,color:P.textLt,border:`1px solid ${P.border}`,borderRadius:10,padding:"9px",fontFamily:"'Nunito',sans-serif",fontSize:12,fontWeight:700,cursor:"pointer"}}>🔖 Save as View</button>
          <button onClick={()=>setOpen(false)} style={{background:P.accent,color:"#fff",border:"none",borderRadius:10,padding:"9px 18px",fontFamily:"'Nunito',sans-serif",fontSize:12,fontWeight:700,cursor:"pointer"}}>Done</button>
        </div>
      </div>}
    </>
  );
}

const SAMPLE_BOOKS=[
  {id:"s1",title:"The Name of the Wind",subtitle:"The Kingkiller Chronicle: Day One",authors:["Patrick Rothfuss"],cover:"https://covers.openlibrary.org/b/isbn/9780756404079-L.jpg",genre:"Fantasy",categories:["Fantasy"],status:"read",rating:5,notes:"Absolutely captivating prose.",year:"2007",publishedDate:"2007-03-27",publisher:"DAW Books",pages:"662",isbn13:"9780756404079",isbn10:"0756404079",language:"en",description:"Told in Kvothe's own voice, this is the tale of the magically gifted young man who grows to be the most notorious wizard his world has ever seen.",averageRating:4.5,ratingsCount:285000,addedAt:Date.now()-864e5*60,bookFormat:"physical",bookBinding:"paperback",customShelves:[],readDates:["2024-11-01"],highlights:[]},
  {id:"s2",title:"Educated",subtitle:"A Memoir",authors:["Tara Westover"],cover:"https://covers.openlibrary.org/b/isbn/9780399590504-L.jpg",genre:"Biography",categories:["Biography"],status:"reading",rating:4,notes:"Powerful and unsettling.",year:"2018",publishedDate:"2018-02-20",publisher:"Random House",pages:"352",isbn13:"9780399590504",isbn10:"0399590501",language:"en",description:"Born to survivalists in the mountains of Idaho, Tara Westover was seventeen the first time she set foot in a classroom.",averageRating:4.5,ratingsCount:542000,addedAt:Date.now()-864e5*30,currentPage:120,bookFormat:"physical",bookBinding:"paperback",customShelves:[],readDates:[],highlights:[],progressHistory:[{date:"2024-01-10",page:50,pct:14},{date:"2024-01-15",page:90,pct:26},{date:"2024-01-20",page:120,pct:34}]},
  {id:"s3",title:"Project Hail Mary",authors:["Andy Weir"],cover:"https://covers.openlibrary.org/b/isbn/9780593135204-L.jpg",genre:"Sci-Fi",categories:["Science Fiction"],status:"owned",rating:0,notes:"",year:"2021",publishedDate:"2021-05-04",publisher:"Ballantine Books",pages:"476",isbn13:"9780593135204",isbn10:"0593135202",language:"en",description:"Ryland Grace is the sole survivor on a desperate last-chance mission.",averageRating:4.5,ratingsCount:312000,addedAt:Date.now()-864e5*10,bookFormat:"physical",bookBinding:"paperback",customShelves:[],readDates:[],highlights:[]},
];

// ─── Main App ─────────────────────────────────────────────────────────────────
function App({ user }) {
  const [books,setBooks]       = useState(()=>load("books",null)||SAMPLE_BOOKS);
  const [activeTab,setActiveTab] = useState("library");
  const [showAdd,setShowAdd]   = useState(false);
  const [selected,setSelected] = useState(null);
  const [filterStatus,setFilterStatus] = useState("all");
  const [filterGenre,setFilterGenre]   = useState("all");
  const [searchQ,setSearchQ]   = useState("");
  const [sortBy,setSortBy]     = useState("recent");
  const [viewMode,setViewMode] = useState("grid");
  const [toast,setToast]       = useState(null);
  const [showExport,setShowExport]     = useState(false);
  const [readingGoal,setReadingGoal]   = useState(()=>load("goal",0));
  const [showGoalSetup,setShowGoalSetup] = useState(false);
  const [progressBook,setProgressBook] = useState(null);
  const [highlightBook,setHighlightBook] = useState(null);
  const [loanBook,setLoanBook]         = useState(null);
  const [seriesModal,setSeriesModal]   = useState(null);
  const [customShelves,setCustomShelves] = useState(()=>load("shelves",[]));
  const [showShelves,setShowShelves]   = useState(false);
  const [showImport,setShowImport]     = useState(false);
  const [shelfFilter,setShelfFilter]   = useState("all");
  const [showBackup,setShowBackup]     = useState(false);
  const [savedViews,setSavedViews]     = useState(()=>load("savedViews",[]));
  const [activeView,setActiveView]     = useState(null);
  const [showSavedViews,setShowSavedViews] = useState(false);
  const [showOnboarding,setShowOnboarding] = useState(()=>!load("onboarded",false));

  // Theme
  const [isDark,setIsDark] = useState(()=>load("theme","dark")==="dark");
  P = isDark ? DARK : LIGHT;

  // Gamification
  const [earnedAchs,setEarnedAchs] = useState(()=>load("achievements",[]));
  const [achToast,setAchToast]     = useState(null); // achievement being shown

  useEffect(()=>{ if(books.length>0) save("books",books); },[books]);
  useEffect(()=>{ save("goal",readingGoal); },[readingGoal]);
  useEffect(()=>{ save("shelves",customShelves); },[customShelves]);
  useEffect(()=>{
    save("theme", isDark ? "dark" : "light");
    document.body.style.background = P.bg;
    document.body.style.color = P.text;
    document.body.style.setProperty("color-scheme", isDark ? "dark" : "light");
    document.body.classList.toggle("light", !isDark);
    document.body.classList.toggle("dark",   isDark);
    // Update PWA theme-color meta tag
    document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove());
    const tc = document.createElement("meta");
    tc.name = "theme-color"; tc.content = isDark ? "#0f0f14" : "#f5f5ff";
    document.head.appendChild(tc);
  }, [isDark]);
  useEffect(()=>{ save("achievements",earnedAchs); },[earnedAchs]);
  useEffect(()=>{ save("savedViews",savedViews); },[savedViews]);

  // Check achievements whenever books or goal changes
  useEffect(()=>{
    const newOnes = checkNewAchievements(books, readingGoal, earnedAchs);
    if(newOnes.length>0){
      setEarnedAchs(prev=>[...prev,...newOnes.map(a=>a.id)]);
      // Show toasts one at a time with a queue
      newOnes.forEach((ach,i)=>{
        setTimeout(()=>setAchToast(ach), i*5000);
      });
    }
  },[books, readingGoal]);

  function toggleTheme() { setIsDark(d=>!d); }

  const showToast=(msg,ms=5000)=>{setToast(msg);setTimeout(()=>setToast(null),ms);};

  async function addBook(book) {
    setShowAdd(false);
    let isUpgrade=false;
    let currentBooks;
    setBooks(prev=>{
      currentBooks=prev;
      // Allow same title in different format (e.g. own paperback + audiobook)
      const fmt = book.bookFormat||"physical";
      const ex=prev.find(b=>b.id===book.id||(b.isbn13&&b.isbn13===book.isbn13&&b.isbn13!=="")
        ||(b.isbn10&&b.isbn10===book.isbn10&&b.isbn10!=="")
        ||(b.title.toLowerCase()===book.title.toLowerCase()&&(b.bookFormat||"physical")===fmt));
      if(ex){isUpgrade=ex.status==="wishlist";return prev.map(b=>b.id===ex.id?{...ex,...book,id:ex.id,status:isUpgrade?"owned":ex.status,addedAt:ex.addedAt}:b);}
      const newBook={...book,status:"owned",addedAt:Date.now(),customShelves:[],readDates:[],highlights:[]};
      currentBooks=[newBook,...prev];
      return currentBooks;
    });
    if(isUpgrade){showToast("📖 Moved from Wishlist to Library!");return;}
    try {
      const st=await fetchSeriesTitles(book, currentBooks||books);
      if(!st.length)return;
      setBooks(prev=>{
        const exIds=new Set(prev.map(b=>b.id)),exT=new Set(prev.map(b=>b.title.toLowerCase()));
        const newOnes=st.filter(sb=>!exIds.has(sb.id)&&!exT.has(sb.title.toLowerCase()));
        if(newOnes.length>0) setTimeout(()=>setSeriesModal({newBook:book,seriesBooks:newOnes}),400);
        return prev;
      });
    } catch{}
  }
  function addSeriesBooks(sel){
    if(!sel.length)return;
    setBooks(prev=>{const exT=new Set(prev.map(b=>b.title.toLowerCase()));return[...prev,...sel.filter(b=>!exT.has(b.title.toLowerCase())).map(b=>({...b,status:"wishlist",addedAt:Date.now(),customShelves:[],readDates:[],highlights:[]}))];});
    showToast(`💜 ${sel.length} series book${sel.length!==1?"s":""} added to Wishlist!`);
    setSeriesModal(null);
  }
  function importBooks(imported) {
    setBooks(prev => {
      const exTitles = new Set(prev.map(b => b.title.toLowerCase()));
      const toAdd = imported.filter(b => !exTitles.has(b.title.toLowerCase()));
      showToast(`📚 Imported ${toAdd.length} book${toAdd.length!==1?"s":""}!`);
      return [...toAdd, ...prev];
    });
  }
  function addToWishlist(book){
    setBooks(prev=>{if(prev.find(b=>b.title.toLowerCase()===book.title.toLowerCase()))return prev;return[{...book,status:"wishlist",addedAt:Date.now(),customShelves:[],readDates:[],highlights:[]},...prev];});
    showToast("💜 Added to Wishlist!");
  }
  function updateBook(b){setBooks(bs=>bs.map(x=>x.id===b.id?b:x));}
  function deleteBook(id){setBooks(bs=>bs.filter(b=>b.id!==id));}

  function restoreFromBackup(data) {
    if (data.books)        setBooks(data.books);
    if (data.shelves)      setCustomShelves(data.shelves);
    if (data.goal)         setReadingGoal(data.goal);
    if (data.earnedAchs)   setEarnedAchs(data.earnedAchs);
  }
  function saveView(){setShowSavedViews(true);}
  function deleteSavedView(id){setSavedViews(vs=>vs.filter(v=>v.id!==id));if(activeView?.id===id)setActiveView(null);}
  function addSavedView(v){setSavedViews(vs=>[...vs,v]);}
  function applyView(v){setActiveView(v);}

  const filtered=useMemo(()=>books.filter(b=>{
    if(filterStatus!=="all"&&b.status!==filterStatus)return false;
    if(filterGenre!=="all"&&b.genre!==filterGenre)return false;
    if(shelfFilter!=="all"&&!(b.customShelves||[]).includes(shelfFilter))return false;
    if(searchQ&&!b.title.toLowerCase().includes(searchQ.toLowerCase())&&!b.authors?.join("").toLowerCase().includes(searchQ.toLowerCase()))return false;
    return true;
  }).sort((a,b)=>{
    if(sortBy==="title")return a.title.localeCompare(b.title);
    if(sortBy==="author")return(a.authors?.[0]||"").localeCompare(b.authors?.[0]||"");
    if(sortBy==="rating")return(b.rating||0)-(a.rating||0);
    if(sortBy==="pages")return(parseInt(b.pages)||0)-(parseInt(a.pages)||0);
    return(b.addedAt||0)-(a.addedAt||0);
  }),[books,filterStatus,filterGenre,shelfFilter,searchQ,sortBy]);

  const loanedBooks=useMemo(()=>books.filter(b=>b.loan),[books]);
  const genres=useMemo(()=>["all",...Array.from(new Set(books.map(b=>b.genre).filter(Boolean)))],[books]);
  const stats=useMemo(()=>({
    total:books.length,
    read:books.filter(b=>b.status==="read").length,
    reading:books.filter(b=>b.status==="reading").length,
    wishlist:books.filter(b=>b.status==="wishlist").length,
  }),[books]);

  return <div style={{minHeight:"100vh",background:P.bg,fontFamily:"'Nunito',sans-serif",color:P.text}}>
    <OfflineBanner/>
    <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0,background:`radial-gradient(ellipse 80% 50% at 50% -10%,${P.accentGlow} 0%,transparent 60%)`}}/>
    <div className="app-inner" style={{zIndex:1}}>

      {/* ── Library ── */}
      {activeTab==="library"&&<div style={{paddingBottom:84}}>
               <div style={{padding:"48px 20px 12px"}}>
          {/* Title row */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
            <div>
              <div style={{fontFamily:"'Nunito',sans-serif",fontSize:10,letterSpacing:4,color:P.accent,textTransform:"uppercase",fontWeight:800,marginBottom:6}}>My Library</div>
              <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:34,color:P.text,margin:0,fontWeight:900,letterSpacing:-.5}}>Bookshelf</h1>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center",paddingTop:6}}>
              {/* Theme toggle */}
              <button onClick={toggleTheme} title={isDark?"Switch to Light Mode":"Switch to Dark Mode"}
                style={{width:36,height:36,borderRadius:18,background:P.bgCard,border:`1px solid ${P.border}`,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,transition:"all .2s"}}>
                {isDark?"☀️":"🌙"}
              </button>
              {/* Shelves */}
              <button onClick={()=>setShowShelves(true)}
                style={{width:36,height:36,borderRadius:18,background:P.bgCard,border:`1px solid ${P.border}`,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>
                📂
              </button>
              {/* Backup */}
              <BackupBtn onOpen={()=>setShowBackup(true)}/>
              {/* User avatar / sign out */}
              <button onClick={()=>firebase.auth().signOut()} title={`Sign out (${user?.displayName||user?.email||''})`}
                style={{width:36,height:36,borderRadius:18,background:P.bgCard,border:`1px solid ${P.border}`,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",padding:0,flexShrink:0}}>
                {user?.photoURL
                  ? <img src={user.photoURL} style={{width:"100%",height:"100%",objectFit:"cover"}} referrerPolicy="no-referrer"/>
                  : <span style={{fontSize:16}}>👤</span>}
              </button>
            </div>
          </div>
          {/* XP bar — compact */}
          <XPBar books={books} goal={readingGoal} compact={true}/>
        </div>

        {/* Goal + Stats */}
        <div style={{padding:"0 20px 12px",display:"flex",gap:12,alignItems:"stretch"}}>
          <div style={{background:P.bgCard,borderRadius:18,padding:"16px 14px",border:`1px solid ${P.border}`,display:"flex",flexDirection:"column",alignItems:"center",gap:8,minWidth:128,boxShadow:"0 4px 20px rgba(0,0,0,.3)"}}>
            <GoalRing read={stats.read} goal={readingGoal} size={110}/>
            <button onClick={()=>setShowGoalSetup(true)} style={{background:readingGoal===0?P.accent:"transparent",border:`1px solid ${readingGoal===0?P.accent:P.border}`,borderRadius:20,padding:"5px 14px",fontFamily:"'Nunito',sans-serif",fontSize:10,fontWeight:700,color:readingGoal===0?"#fff":P.muted,cursor:"pointer",textTransform:"uppercase",letterSpacing:.4,transition:"all .2s"}}>{readingGoal===0?"🎯 Set Goal":"Edit Goal"}</button>
          </div>
          <div style={{flex:1,display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
            {[{l:"Total",v:stats.total,c:P.accent},{l:"Read",v:stats.read,c:SC.read},{l:"Reading",v:stats.reading,c:SC.reading},{l:"Wishlist",v:stats.wishlist,c:SC.wishlist}].map(({l,v,c})=><div key={l} style={{background:P.bgCard,borderRadius:12,padding:"10px 8px",textAlign:"center",border:`1px solid ${P.border}`,boxShadow:"0 2px 12px rgba(0,0,0,.3)"}}><div style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:900,color:c}}>{v}</div><div style={{fontFamily:"'Nunito',sans-serif",fontSize:9,color:P.muted,fontWeight:700,letterSpacing:.3,textTransform:"uppercase"}}>{l}</div></div>)}
          </div>
        </div>

        {/* Currently Reading / Listening */}
        {books.filter(b=>b.status==="reading").length>0&&<div style={{padding:"0 20px 10px"}}>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Currently {books.filter(b=>b.status==="reading"&&b.bookFormat==="audiobook").length===books.filter(b=>b.status==="reading").length?"Listening":"Reading"}</div>
          {books.filter(b=>b.status==="reading").map(book=>{
            const fmt=book.bookFormat||"physical";
            const isAudio=fmt==="audiobook";
            const pages=parseInt(book.pages)||0,curPage=book.currentPage||0;
            const pct=pages>0?Math.round((curPage/pages)*100):(book.progressHistory?.slice(-1)[0]?.pct||0);
            const progressLabel=isAudio
              ?`${fmtMinutes(curPage)} listened${pages>0?` of ${fmtMinutes(pages)}`:""}${pct>0?` · ${pct}%`:""}`
              :`${pct}%${pages>0&&curPage>0?` · p.${curPage} of ${pages}`:""}`;
            return <div key={book.id} onClick={()=>setSelected(book)} style={{background:P.bgCard,borderRadius:14,padding:"12px 14px",border:`1px solid ${P.border}`,display:"flex",gap:12,alignItems:"center",marginBottom:8,boxShadow:"0 2px 12px rgba(0,0,0,.3)",cursor:"pointer"}}>
              <div style={{width:42,height:58,borderRadius:6,overflow:"hidden",background:P.bgSurface,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{book.cover?<img src={book.cover} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"}/>:<span style={{fontSize:18}}>{FI[fmt]||"📖"}</span>}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:3}}>
                  {fmt!=="physical"&&<span style={{fontSize:12}}>{FI[fmt]}</span>}
                  <div style={{fontFamily:"'Playfair Display',serif",fontWeight:700,fontSize:13.5,color:P.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{book.title}</div>
                </div>
                <ProgressBar value={pct} max={100} color={SC.reading}/>
                <div style={{fontFamily:"'Nunito',sans-serif",fontSize:11,color:P.muted,marginTop:3}}>{progressLabel}</div>
              </div>
              <button onClick={e=>{e.stopPropagation();setProgressBook(book);}} style={{background:"rgba(90,144,104,.12)",border:`1px solid ${SC.reading}55`,borderRadius:10,padding:"7px 10px",fontFamily:"'Nunito',sans-serif",fontSize:11,fontWeight:700,color:SC.reading,cursor:"pointer",flexShrink:0}}>Update</button>
            </div>;
          })}
        </div>}

        {/* Loaned books banner */}
        {loanedBooks.length>0&&<div style={{margin:"0 20px 14px",background:"rgba(168,85,247,.1)",borderRadius:12,padding:"12px 16px",border:"1px solid rgba(168,85,247,.25)"}}><div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:"#8b68b0",fontWeight:800,marginBottom:6}}>📤 {loanedBooks.length} book{loanedBooks.length!==1?"s":""} lent out</div>{loanedBooks.slice(0,3).map(b=><div key={b.id} style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.textLt}}>{b.title} → {b.loan.name}</div>)}</div>}

        {/* Search */}
        <div style={{padding:"0 20px 8px",position:"relative"}}>
          <span style={{position:"absolute",left:34,top:"50%",transform:"translateY(-50%)",fontSize:16,pointerEvents:"none",opacity:.4}}>🔍</span>
          <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="Search your library…" style={{width:"100%",border:`1.5px solid ${P.border}`,borderRadius:14,padding:"12px 16px 12px 38px",fontFamily:"'Nunito',sans-serif",fontSize:14,background:P.bgSurface,color:P.text,outline:"none",boxSizing:"border-box"}} autoComplete="off" autoCorrect="off" spellCheck="false"/>
          {searchQ&&<button onClick={()=>setSearchQ("")} style={{position:"absolute",right:30,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:P.muted,cursor:"pointer",fontSize:18,padding:0,lineHeight:1}}>×</button>}
        </div>

        {/* Unified Filter Bar */}
        <FilterBar
          filterStatus={filterStatus} setFilterStatus={setFilterStatus}
          filterGenre={filterGenre} setFilterGenre={setFilterGenre}
          shelfFilter={shelfFilter} setShelfFilter={setShelfFilter}
          sortBy={sortBy} setSortBy={setSortBy}
          genres={genres.filter(g=>g!=="all")}
          customShelves={customShelves}
          onSaveView={saveView}
          savedViews={savedViews}
          activeView={activeView}
          onSelectView={applyView}
          onManageViews={()=>setShowSavedViews(true)}
        />

        {/* View toggle + wishlist export — compact row */}
        <div style={{padding:"0 20px 10px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,fontWeight:600}}>{filtered.length} book{filtered.length!==1?"s":""}</span>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            {stats.wishlist>0&&<button onClick={()=>setShowExport(true)} title="Export Wishlist" style={{width:30,height:30,borderRadius:15,background:"rgba(168,85,247,.12)",color:P.purple,border:"1px solid rgba(168,85,247,.3)",cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>📤</button>}
            <div style={{display:"flex",gap:2,background:P.bgCard,borderRadius:10,padding:3,border:`1px solid ${P.border}`}}>
              {[["grid","⊞"],["list","☰"]].map(([m,icon])=>(
                <button key={m} onClick={()=>setViewMode(m)} style={{background:viewMode===m?P.accent:"transparent",color:viewMode===m?"#fff":P.muted,border:"none",borderRadius:7,width:26,height:24,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s"}}>{icon}</button>
              ))}
            </div>
          </div>
        </div>

        {/* Grid / List */}
        {viewMode==="grid"
          ?<div style={{padding:"0 20px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(155px,1fr))",gap:16}}>
            {filtered.length===0?<div style={{gridColumn:"1/-1",textAlign:"center",padding:"64px 20px"}}>
  <div style={{width:80,height:80,borderRadius:40,background:`linear-gradient(135deg,${P.accent}22,${P.accentDk}44)`,border:`2px solid ${P.border}`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",fontSize:36}}>📚</div>
  <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:P.text,marginBottom:8}}>No books found</div>
  <div style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:P.muted,lineHeight:1.6}}>Try adjusting your filters<br/>or tap <strong style={{color:P.accent}}>＋</strong> to add a book</div>
</div>
            :filtered.map(book=><BookCard key={book.id} book={book} onClick={setSelected}/>)}
          </div>
          :<ListView books={filtered} onSelect={setSelected}/>}
      </div>}

      {activeTab==="stats"&&<StatsScreen books={books} goal={readingGoal}/>}
      {activeTab==="achievements"&&<AchievementsScreen books={books} goal={readingGoal} earned={earnedAchs}/>}
      {activeTab==="suggestions"&&<SuggestScreen books={books} onAddWishlist={addToWishlist}/>}
    </div>

    {/* Achievement toast (top of screen) */}
    {achToast&&<AchievementToast achievement={achToast} onDismiss={()=>setAchToast(null)}/>}

    {/* Regular toast (bottom) */}
    {toast&&<div style={{position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",zIndex:300,background:P.bgCard,color:P.text,borderRadius:14,padding:"13px 20px",maxWidth:340,width:"calc(100% - 40px)",boxShadow:`0 8px 32px rgba(0,0,0,.6), 0 0 0 1px ${P.border}`,display:"flex",gap:12,alignItems:"center",fontFamily:"'Nunito',sans-serif",fontSize:14,fontWeight:700}}><span style={{flex:1}}>{toast}</span><button onClick={()=>setToast(null)} style={{background:"none",border:"none",color:P.muted,cursor:"pointer",fontSize:18,padding:0,lineHeight:1}}>×</button></div>}

    {/* Keyframe animation injected once */}
    <style>{`@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}`}</style>

    {/* Bottom nav */}
    <nav style={{position:"fixed",bottom:0,left:0,right:0,height:70,background:P.navBg,backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderTop:`1px solid ${P.border}`,zIndex:200,boxShadow:"0 -1px 0 rgba(99,102,241,.2),0 -20px 40px rgba(0,0,0,.4)"}}>
      <div className="app-inner" style={{height:"100%",display:"flex",alignItems:"center",justifyContent:"space-around",position:"relative"}}>
        {[["library","📚","🗂","Library"],["stats","📊","📊","Stats"],["achievements","🏆","🏅","Awards"],["suggestions","✨","💡","Suggest"]].map(([tab,activeIcon,inactiveIcon,label])=>(
          <button key={tab} onClick={()=>setActiveTab(tab)}
            style={{background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"8px 0",color:activeTab===tab?P.accent:P.muted,flex:1,position:"relative"}}>
            <span style={{fontSize:20}}>{activeTab===tab?activeIcon:inactiveIcon}</span>
            <span style={{fontFamily:"'Nunito',sans-serif",fontSize:9,fontWeight:800,letterSpacing:.4,textTransform:"uppercase"}}>{label}</span>
            {tab==="achievements"&&earnedAchs.length>0&&<span style={{position:"absolute",top:4,right:"18%",background:P.gold,borderRadius:8,minWidth:16,height:16,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Nunito',sans-serif",fontSize:9,fontWeight:800,color:"#000",padding:"0 4px"}}>{earnedAchs.length}</span>}
          </button>
        ))}
        {activeTab==="library"&&<div style={{position:"absolute",bottom:14,left:"50%",transform:"translateX(-50%)"}}><button onClick={()=>setShowAdd(true)} style={{width:52,height:52,borderRadius:26,background:`linear-gradient(135deg,${P.accentLt},${P.accent})`,color:"#fff",border:"none",fontSize:24,cursor:"pointer",boxShadow:`0 0 0 1px ${P.accent}, 0 8px 32px ${P.accentGlow}, 0 4px 12px rgba(0,0,0,.5)`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:300}}>＋</button></div>}
      </div>
    </nav>

    {/* All modals */}
    {showAdd        &&<Sheet onClose={()=>setShowAdd(false)}><AddModal onAdd={addBook} onClose={()=>setShowAdd(false)} onOpenImport={()=>{setShowAdd(false);setTimeout(()=>setShowImport(true),200);}}/></Sheet>}
    {selected       &&<Sheet onClose={()=>setSelected(null)} noPad><DetailModal book={selected} onClose={()=>setSelected(null)} onUpdate={b=>{updateBook(b);setSelected(null);}} onDelete={deleteBook} onLogProgress={b=>{setProgressBook(b);setSelected(null);}} onLogHighlights={b=>{setHighlightBook(b);setSelected(null);}} onLogLoan={b=>{setLoanBook(b);setSelected(null);}} customShelves={customShelves}/></Sheet>}
    {showExport     &&<Sheet onClose={()=>setShowExport(false)}><WishlistExport books={books} onClose={()=>setShowExport(false)}/></Sheet>}
    {showGoalSetup  &&<Sheet onClose={()=>setShowGoalSetup(false)}><GoalSetup goal={readingGoal} onSave={setReadingGoal} onClose={()=>setShowGoalSetup(false)}/></Sheet>}
    {progressBook   &&<Sheet onClose={()=>setProgressBook(null)}><ReadingProgressModal book={progressBook} onSave={b=>{updateBook(b);setProgressBook(null);}} onClose={()=>setProgressBook(null)}/></Sheet>}
    {highlightBook  &&<Sheet onClose={()=>setHighlightBook(null)}><HighlightsModal book={highlightBook} onSave={b=>{updateBook(b);setHighlightBook(null);}} onClose={()=>setHighlightBook(null)}/></Sheet>}
    {loanBook       &&<Sheet onClose={()=>setLoanBook(null)}><LoanModal book={loanBook} onSave={b=>{updateBook(b);setLoanBook(null);}} onClose={()=>setLoanBook(null)}/></Sheet>}
    {showShelves    &&<Sheet onClose={()=>setShowShelves(false)}><ShelvesModal shelves={customShelves} onSave={s=>{setCustomShelves(s);}} onClose={()=>setShowShelves(false)}/></Sheet>}
    {seriesModal    &&<Sheet onClose={()=>setSeriesModal(null)}><SeriesModal newBook={seriesModal.newBook} seriesBooks={seriesModal.seriesBooks} onAddSelected={addSeriesBooks} onDismiss={()=>setSeriesModal(null)}/></Sheet>}
    {showImport     &&<Sheet onClose={()=>setShowImport(false)}><CSVImportModal onImport={importBooks} onClose={()=>setShowImport(false)}/></Sheet>}
    {showBackup     &&<Sheet onClose={()=>setShowBackup(false)}><BackupModal books={books} shelves={customShelves} goal={readingGoal} earnedAchs={earnedAchs} onRestore={restoreFromBackup} onClose={()=>setShowBackup(false)}/></Sheet>}
    {showOnboarding &&<Sheet onClose={()=>{save("onboarded",true);setShowOnboarding(false);}}><OnboardingSheet onDone={()=>{save("onboarded",true);setShowOnboarding(false);}}/></Sheet>}
    {showSavedViews &&<Sheet onClose={()=>setShowSavedViews(false)}><SavedViewsModal views={savedViews} onSave={addSavedView} onDelete={deleteSavedView} currentFilters={{status:filterStatus,genre:filterGenre,shelf:shelfFilter,sort:sortBy}} onClose={()=>setShowSavedViews(false)}/></Sheet>}
  </div>;
}


// ─── Auth screens ─────────────────────────────────────────────────────────────
function LoadingScreen() {
  return (
    <div style={{minHeight:"100vh",background:DARK.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:20}}>
      <div style={{fontFamily:"'Playfair Display',serif",fontSize:36,fontWeight:900,color:DARK.text,letterSpacing:-.5}}>Bookshelf</div>
      <div style={{width:36,height:36,border:`3px solid ${DARK.accent}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
    </div>
  );
}

function AuthScreen() {
  const [busy,setBusy] = useState(false);
  const [err,setErr]   = useState(null);

  async function signIn() {
    setBusy(true); setErr(null);
    try {
      await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
    } catch(e) {
      if (e.code !== 'auth/popup-closed-by-user') setErr("Sign-in failed — please try again.");
      setBusy(false);
    }
  }

  return (
    <div style={{minHeight:"100vh",background:DARK.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:24,fontFamily:"'Nunito',sans-serif"}}>
      <div style={{background:DARK.bgCard,border:`1px solid ${DARK.border}`,borderRadius:24,padding:"40px 32px",maxWidth:380,width:"100%",textAlign:"center",boxShadow:"0 24px 80px rgba(0,0,0,.6)"}}>
        <div style={{fontSize:52,marginBottom:16}}>📚</div>
        <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:34,fontWeight:900,color:DARK.text,margin:"0 0 10px",letterSpacing:-.5}}>Bookshelf</h1>
        <p style={{fontSize:14,color:DARK.muted,lineHeight:1.6,marginBottom:36}}>Your personal reading library.<br/>Sign in to access your books on any device.</p>
        <button onClick={signIn} disabled={busy}
          style={{width:"100%",padding:"15px 24px",borderRadius:14,background:busy?"rgba(99,102,241,.4)":DARK.accent,color:"#fff",border:"none",fontWeight:800,fontSize:15,cursor:busy?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10,fontFamily:"'Nunito',sans-serif",transition:"all .2s"}}>
          <svg width="18" height="18" viewBox="0 0 18 18" style={{flexShrink:0}}>
            <path fill="#fff" d="M9 3.48c1.69 0 2.83.73 3.48 1.34l2.54-2.48C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.91 2.26C4.6 5.05 6.62 3.48 9 3.48z"/>
            <path fill="#fff" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/>
            <path fill="#fff" d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.29-1.78L.96 4.96A9.008 9.008 0 0 0 0 9c0 1.45.35 2.82.96 4.04l2.92-2.26z"/>
            <path fill="#fff" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.97 13.04C2.45 15.98 5.48 18 9 18z"/>
          </svg>
          {busy ? "Signing in…" : "Sign in with Google"}
        </button>
        {err && <p style={{fontSize:13,color:DARK.red,marginTop:14}}>{err}</p>}
      </div>
    </div>
  );
}

function Root() {
  const [authState,setAuthState] = useState('loading');
  const [user,setUser]           = useState(null);

  useEffect(() => {
    return firebase.auth().onAuthStateChanged(async firebaseUser => {
      if (!firebaseUser) {
        _userDocRef = null; _userCache = null;
        setUser(null); setAuthState('unauthenticated');
        return;
      }
      try {
        _userDocRef = firebase.firestore().doc(`users/${firebaseUser.uid}`);
        const snap  = await _userDocRef.get();
        _userCache  = snap.exists
          ? snap.data()
          : { books:null, goal:0, shelves:[], achievements:[], savedViews:[], onboarded:false, lastBackup:null };
        if (!snap.exists) await _userDocRef.set(_userCache);
        setUser(firebaseUser);
        setAuthState('authenticated');
      } catch(e) {
        console.error("Failed to load user data:", e);
        setAuthState('unauthenticated');
      }
    });
  }, []);

  if (authState === 'loading')          return <LoadingScreen/>;
  if (authState === 'unauthenticated')  return <AuthScreen/>;
  return <App user={user}/>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(Root));

</script>
</body>

// ─── Smart Shelves Modal ──────────────────────────────────────────────────────
function SmartShelvesModal({views,onSave,onUpdate,onDelete,customShelves,onClose}) {
  const EMPTY={id:null,name:'',status:'all',titleContains:'',authorContains:'',genreContains:'',yearOp:'',yearVal:'',pagesOp:'',pagesVal:'',ratingOp:'',ratingVal:'',shelf:'all',sort:'recent'};
  const [mode,setMode]=useState('list'); // 'list' | 'build'
  const [ed,setEd]=useState(EMPTY);

  function startNew(){setEd({...EMPTY});setMode('build');}
  function startEdit(v){setEd({...EMPTY,...v});setMode('build');}
  function save(){
    if(!ed.name.trim())return;
    const v={...ed,name:ed.name.trim()};
    if(v.id){onUpdate(v);}else{onSave({...v,id:crypto.randomUUID()});}
    setMode('list');
  }

  function criteriaSummary(v){
    const p=[];
    if(v.status&&v.status!=='all')p.push(SL[v.status]||v.status);
    if(v.titleContains)p.push(`title: "${v.titleContains}"`);
    if(v.authorContains)p.push(`author: "${v.authorContains}"`);
    if(v.genreContains)p.push(`genre: "${v.genreContains}"`);
    if(v.shelf&&v.shelf!=='all')p.push(`shelf: ${v.shelf}`);
    const opLabel=op=>op==='eq'?'=':op==='gte'?'≥':'≤';
    if(v.yearOp&&v.yearVal)p.push(`year ${opLabel(v.yearOp)} ${v.yearVal}`);
    if(v.pagesOp&&v.pagesVal)p.push(`pages ${opLabel(v.pagesOp)} ${v.pagesVal}`);
    if(v.ratingOp&&v.ratingVal)p.push(`rating ${opLabel(v.ratingOp)} ${v.ratingVal}★`);
    return p.length?p.join(' · '):'No filters set';
  }

  if(mode==='list') return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <h3 style={{fontFamily:"'Playfair Display',serif",color:P.text,margin:0,fontSize:22}}>Smart Shelves</h3>
        <button onClick={startNew} style={{background:`linear-gradient(135deg,${P.accent},${P.accentDk})`,color:'#fff',border:'none',borderRadius:10,padding:'8px 14px',fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,cursor:'pointer'}}>＋ New Shelf</button>
      </div>
      <p style={{fontFamily:"'Nunito',sans-serif",color:P.muted,fontSize:12,marginTop:0,marginBottom:16,lineHeight:1.65}}>
        Smart shelves filter your library dynamically. A "Star Wars Wishlist" shelf always shows books matching your rules — adding or moving a book updates it instantly.
      </p>
      {views.length===0?(
        <div style={{textAlign:'center',padding:'32px 0',color:P.muted}}>
          <div style={{fontSize:44,marginBottom:10}}>📂</div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:14,marginBottom:4}}>No smart shelves yet</div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12}}>Tap "New Shelf" to create your first</div>
        </div>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {views.map(v=>(
            <div key={v.id} style={{background:P.bgSurface,borderRadius:14,padding:'12px 14px',border:`1px solid ${P.border}`}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:14,color:P.text}}>🔖 {v.name}</div>
                  <div style={{fontFamily:"'Nunito',sans-serif",fontSize:11,color:P.muted,marginTop:4,lineHeight:1.5}}>{criteriaSummary(v)}</div>
                </div>
                <div style={{display:'flex',gap:6,flexShrink:0}}>
                  <button onClick={()=>startEdit(v)} style={{background:P.bgCard,border:`1px solid ${P.border}`,borderRadius:8,padding:'6px 10px',cursor:'pointer',fontSize:13}}>✏️</button>
                  <button onClick={()=>onDelete(v.id)} style={{background:'rgba(239,68,68,.1)',border:'none',borderRadius:8,padding:'6px 10px',color:P.red,cursor:'pointer',fontSize:14,fontWeight:700}}>×</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );

  // ── Builder ──────────────────────────────────────────────────────────────────
  const F={fontFamily:"'Nunito',sans-serif"};
  const LBL={...F,fontSize:10,color:P.muted,fontWeight:700,textTransform:'uppercase',letterSpacing:.5,marginBottom:6};
  const INP={width:'100%',border:`1.5px solid ${P.border}`,borderRadius:8,padding:'8px 12px',...F,fontSize:13,background:P.bgCard,color:P.text,outline:'none',boxSizing:'border-box'};
  function NumRow({label,opKey,valKey}){
    const opV=ed[opKey]||'',numV=ed[valKey]||'';
    const isRating=label==='Rating';
    return(
      <div style={{marginBottom:12}}>
        <div style={LBL}>{label}</div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <select value={opV} onChange={e=>setEd(x=>({...x,[opKey]:e.target.value,[valKey]:e.target.value?x[valKey]:''}))}
            style={{border:`1.5px solid ${P.border}`,borderRadius:8,padding:'7px 8px',background:P.bgSurface,color:P.text,...F,fontSize:12,outline:'none',flexShrink:0}}>
            <option value="">Any</option><option value="eq">=</option><option value="gte">≥</option><option value="lte">≤</option>
          </select>
          {opV&&(isRating?(
            <div style={{display:'flex',gap:2}}>
              {[1,2,3,4,5].map(n=>(
                <button key={n} onClick={()=>setEd(x=>({...x,[valKey]:String(n)}))}
                  style={{fontSize:20,background:'none',border:'none',cursor:'pointer',opacity:parseInt(numV)>=n?1:.25,padding:'2px',lineHeight:1}}>★</button>
              ))}
            </div>
          ):(
            <input type="number" value={numV} onChange={e=>setEd(x=>({...x,[valKey]:e.target.value}))} min={0} placeholder={label}
              style={{...INP,flex:1}}/>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
        <button onClick={()=>setMode('list')} style={{background:'none',border:'none',color:P.muted,cursor:'pointer',fontSize:14,...F,fontWeight:700,padding:0}}>‹ Back</button>
        <h3 style={{fontFamily:"'Playfair Display',serif",color:P.text,margin:0,fontSize:20,flex:1}}>{ed.id?'Edit Shelf':'New Smart Shelf'}</h3>
      </div>
      {/* Name */}
      <input value={ed.name} onChange={e=>setEd(x=>({...x,name:e.target.value}))} placeholder="Shelf name (e.g. Star Wars Wishlist)" autoFocus
        style={{...INP,fontSize:16,padding:'11px 14px',marginBottom:14}}/>
      <div style={{background:P.bgSurface,borderRadius:14,padding:'14px',marginBottom:14,border:`1px solid ${P.border}`}}>
        {/* Status */}
        <div style={{marginBottom:12}}>
          <div style={LBL}>Status</div>
          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
            {["all",...STATUSES].map(s=>(
              <button key={s} onClick={()=>setEd(x=>({...x,status:s}))}
                style={{background:ed.status===s?(s==='all'?P.accent:SC[s]||P.accent):P.bgCard,color:ed.status===s?'#fff':P.textLt,border:`1.5px solid ${ed.status===s?(s==='all'?P.accent:SC[s]||P.accent):P.border}`,borderRadius:20,padding:'5px 12px',cursor:'pointer',...F,fontSize:12,fontWeight:700,transition:'all .12s'}}>
                {s==='all'?'Any':SL[s]}
              </button>
            ))}
          </div>
        </div>
        {/* Text criteria */}
        {[['Title contains','titleContains'],['Author contains','authorContains'],['Genre contains','genreContains']].map(([label,key])=>(
          <div key={key} style={{marginBottom:12}}>
            <div style={LBL}>{label}</div>

        <NumRow label="Pages" opKey="pagesOp" valKey="pagesVal"/>
        <NumRow label="Rating" opKey="ratingOp" valKey="ratingVal"/>
        {/* Static shelf tag */}
        {customShelves.length>0&&(
          <div style={{marginBottom:12}}>
            <div style={LBL}>Also tagged with manual shelf</div>
            <select value={ed.shelf} onChange={e=>setEd(x=>({...x,shelf:e.target.value}))}
              style={{...INP,background:P.bgSurface}}>
              <option value="all">Any shelf</option>
              {customShelves.map(s=><option key={s} value={s}>📂 {s}</option>)}
            </select>
          </div>
        )}
        {/* Sort */}
        <div>
          <div style={LBL}>Sort</div>
          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
            {[['recent','Recent'],['title','Title'],['author','Author'],['rating','Rating'],['pages','Pages']].map(([v,l])=>(
              <button key={v} onClick={()=>setEd(x=>({...x,sort:v}))}
                style={{background:ed.sort===v?P.accent:'transparent',color:ed.sort===v?'#fff':P.muted,border:`1px solid ${ed.sort===v?P.accent:P.border}`,borderRadius:8,padding:'5px 10px',cursor:'pointer',...F,fontSize:11,fontWeight:700,transition:'all .12s'}}>{l}</button>
            ))}
          </div>
        </div>
      </div>
      <button onClick={save} disabled={!ed.name.trim()}
        style={{width:'100%',background:ed.name.trim()?`linear-gradient(135deg,${P.accent},${P.accentDk})`:P.disabledBtn,color:'#fff',border:'none',borderRadius:14,padding:'14px',...F,fontWeight:800,fontSize:15,cursor:ed.name.trim()?'pointer':'default',boxShadow:ed.name.trim()?`0 4px 16px ${P.accentGlow}`:'none'}}>
        {ed.id?'Save Changes':'Create Shelf'}
      </button>
    </div>
  );
}

  const [highlightBook,setHighlightBook] = useState(null);

  const booksMounted = useRef(false);
  useEffect(()=>{
    if(!booksMounted.current){booksMounted.current=true;return;}
    save("books",books);
  },[books]);
  useEffect(()=>{ save("goal",readingGoal); },[readingGoal]);
  const friendsMounted = useRef(false);
  useEffect(()=>{
    if(!friendsMounted.current){friendsMounted.current=true;return;}
    save('friends', friends);
  },[friends]);

  useEffect(()=>{
    if(!user) return;
    const db = firebase.firestore();
    // Listen for incoming friend requests
    const unsub = db.collection('friendRequests')
      .where('toUid','==',user.uid)
      .where('status','==','pending')
      .onSnapshot(snap=>{
        setPendingRequests(snap.docs.map(d=>({id:d.id,...d.data()})));
      }, e=>console.warn('friend requests listener:', e));
    // Listen for accepted outbound requests, sync to our friends list
    const unsubAcc = db.collection('friendRequests')
      .where('fromUid','==',user.uid)
      .where('status','==','accepted')
      .onSnapshot(async snap=>{
        if(snap.empty) return;
        const newUids=snap.docs.map(d=>d.data().toUid);
        const profs = await Promise.all(newUids.map(uid=>db.doc(`profiles/${uid}`).get().then(d=>d.exists?{uid,...d.data()}:null)));
        setFriends(prev=>{
          const existing=new Set(prev.map(f=>f.uid));
          const toAdd=profs.filter(p=>p&&!existing.has(p.uid));
          return toAdd.length?[...prev,...toAdd]:prev;
        });
        const batch=db.batch();
        snap.docs.forEach(d=>batch.delete(d.ref));
        await batch.commit().catch(()=>{});
      }, e=>console.warn('accepted requests listener:', e));
    return ()=>{unsub();unsubAcc();};
  },[user]);
  useEffect(()=>{ save("shelves",customShelves); },[customShelves]);
  useEffect(()=>{

    document.body.style.background = P.bg;
    document.body.style.color = P.text;
    document.body.style.setProperty("color-scheme", isDark ? "dark" : "light");
    document.body.classList.toggle("light", !isDark);
    document.body.classList.toggle("dark",   isDark);
    // Update PWA theme-color meta tag
    document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove());
    const tc = document.createElement("meta");
    tc.name = "theme-color"; tc.content = isDark ? "#0f0f14" : "#f5f5ff";
    document.head.appendChild(tc);

  const statsSyncTimer=useRef(null);
  useEffect(()=>{
    if(!user)return;
    clearTimeout(statsSyncTimer.current);
    statsSyncTimer.current=setTimeout(()=>updatePublicStats(user.uid,books,earnedAchs,readingGoal),3000);
    return()=>clearTimeout(statsSyncTimer.current);
  },[books,earnedAchs,readingGoal,user]);

  // Show toast when a new friend request arrives
  const prevPendingRef=useRef(null);
  useEffect(()=>{
    if(prevPendingRef.current!==null&&pendingRequests.length>prevPendingRef.current){
      showToast("👥 New friend request!");
    }
    prevPendingRef.current=pendingRequests.length;
  },[pendingRequests]);

  // (no doc-size guard needed — books now live in a subcollection with no size ceiling)

  // Check monthly challenge whenever books change
  useEffect(()=>{
    const now=new Date(),y=now.getFullYear(),m=now.getMonth()+1;
    const ym=y+"-"+String(m).padStart(2,"0");
    const ch=MONTHLY_CHALLENGES.find(c=>c.ym===ym);
    if(!ch||completedChallenges.includes(ym))return;
    try{
      if(ch.check(books,y,m)){
        setCompletedChallenges(prev=>[...prev,ym]);
        showToast("🎯 Monthly Challenge complete! +"+ch.xp+" XP");
      }
    }catch(e){console.warn("challenge check error:",e);}
  },[books]);

  // Check achievements whenever books or goal changes
  useEffect(()=>{
    const newOnes = checkNewAchievements(books, readingGoal, earnedAchs);
    if(newOnes.length>0){
      setEarnedAchs(prev=>[...prev,...newOnes.map(a=>a.id)]);
      // Show toasts one at a time with a queue
      newOnes.forEach((ach,i)=>{
        setTimeout(()=>setAchToast(ach), i*5000);
      });
    }
  },[books, readingGoal]);

  function toggleTheme() { setIsDark(d=>!d); }

  const showToast=(msg,ms=5000)=>{setToast(msg);setTimeout(()=>setToast(null),ms);};

  async function addBook(book) {
    setShowAdd(false);
    let mergeResult=null; // null=new | 'wishlist_upgrade' | 'format_added' | 'already_owned'
    let currentBooks;
    setBooks(prev=>{
      currentBooks=prev;
      const fmt=book.bookFormat||"physical";
      // Match by id, either ISBN, OR title (regardless of format — one record per title)
      const ex=prev.find(b=>b.id===book.id
        ||(b.isbn13&&b.isbn13===book.isbn13&&b.isbn13!=="")
        ||(b.isbn10&&b.isbn10===book.isbn10&&b.isbn10!=="")
        ||b.title.toLowerCase()===book.title.toLowerCase());
      if(ex){
        const exFmts=ex.ownedFormats||[ex.bookFormat||"physical"];
        const hasFmt=exFmts.includes(fmt);
        if(ex.status==="wishlist")mergeResult="wishlist_upgrade";
        else if(hasFmt)mergeResult="already_owned";
        else mergeResult="format_added";
        const newFmts=hasFmt?exFmts:[...exFmts,fmt];
        const merged={...ex,
          ...(ex.status==="wishlist"?{cover:book.cover||ex.cover,isbn13:book.isbn13||ex.isbn13,isbn10:book.isbn10||ex.isbn10,pages:book.pages||ex.pages,description:book.description||ex.description}:{}),
          id:ex.id,status:ex.status==="wishlist"?"owned":ex.status,addedAt:ex.addedAt,ownedFormats:newFmts,
          bookFormat:ex.status==="wishlist"?fmt:ex.bookFormat,
        };
        return prev.map(b=>b.id===ex.id?merged:b);
      }
      const newBook={...book,status:"owned",addedAt:Date.now(),customShelves:[],readDates:[],highlights:[],ownedFormats:[fmt]};
      currentBooks=[newBook,...prev];
      return currentBooks;
    });
    if(mergeResult==="wishlist_upgrade"){showToast("📖 Moved from Wishlist to Library!");return;}
    if(mergeResult==="format_added"){showToast(`${FI[book.bookFormat||"physical"]} Format added to your existing entry!`);return;}
    if(mergeResult==="already_owned")return; // silent — already in library
    try {
      showToast("🔍 Checking for series companions…");
      const st=await fetchSeriesTitles(book, currentBooks||books);
      if(!st.length) return; // standalone book — stay silent
      setBooks(prev=>{
        const exIds=new Set(prev.map(b=>b.id)),exT=new Set(prev.map(b=>b.title.toLowerCase()));
        const newOnes=st.filter(sb=>!exIds.has(sb.id)&&!exT.has(sb.title.toLowerCase()));
        if(newOnes.length>0){
          showToast(`📚 Found ${newOnes.length} series book${newOnes.length!==1?"s":""}!`);
          setTimeout(()=>setSeriesModal({newBook:book,seriesBooks:newOnes}),400);
        } else {
          showToast("ℹ️ All series books already in library");
        }
        return prev;
      });
    } catch(e){console.error("fetchSeriesTitles error:",e);showToast("⚠️ Series check failed: "+e.message);}
  }
  async function findSeriesForBook(book) {
    showToast("🔍 Looking up series…");
    try{
      const st=await fetchSeriesTitles(book,books);
      if(!st.length){showToast("ℹ️ No series found for this book");return;}
      setBooks(prev=>{
        const exIds=new Set(prev.map(b=>b.id)),exT=new Set(prev.map(b=>b.title.toLowerCase()));
        const newOnes=st.filter(sb=>!exIds.has(sb.id)&&!exT.has(sb.title.toLowerCase()));
        if(newOnes.length>0){showToast(`📚 Found ${newOnes.length} series book${newOnes.length!==1?"s":""}!`);setTimeout(()=>setSeriesModal({newBook:book,seriesBooks:newOnes}),400);}
        else showToast("ℹ️ All series books already in library");
        return prev;
      });
    }catch(e){console.error("findSeriesForBook error:",e);showToast("⚠️ Series lookup failed");}
  }
  function addSeriesBooks(sel){
    if(!sel.length)return;
    setBooks(prev=>{const exT=new Set(prev.map(b=>b.title.toLowerCase()));return[...prev,...sel.filter(b=>!exT.has(b.title.toLowerCase())).map(b=>({...b,status:"wishlist",addedAt:Date.now(),customShelves:[],readDates:[],highlights:[]}))];});
    showToast(`💜 ${sel.length} series book${sel.length!==1?"s":""} added to Wishlist!`);
    setSeriesModal(null);
  }
  function importBooks(imported) {
    setBooks(prev => {
      const exTitles = new Set(prev.map(b => b.title.toLowerCase()));
      const toAdd = imported.filter(b => !exTitles.has(b.title.toLowerCase()));
      showToast(`📚 Imported ${toAdd.length} book${toAdd.length!==1?"s":""}!`);
      return [...toAdd, ...prev];
    });
  }
  function addToWishlist(book){
    setBooks(prev=>{if(prev.find(b=>b.title.toLowerCase()===book.title.toLowerCase()))return prev;return[{...book,status:"wishlist",addedAt:Date.now(),customShelves:[],readDates:[],highlights:[]},...prev];});
    showToast("💜 Added to Wishlist!");
  }
  function updateBook(b){setBooks(bs=>bs.map(x=>x.id===b.id?b:x));}
  function deleteBook(id){setBooks(bs=>bs.filter(b=>b.id!==id));}

  function restoreFromBackup(data) {
    if (data.books)        setBooks(data.books);
    if (data.shelves)      setCustomShelves(data.shelves);
    if (data.goal)         setReadingGoal(data.goal);
    if (data.earnedAchs)        setEarnedAchs(data.earnedAchs);
    if (data.completedChallenges) setCompletedChallenges(data.completedChallenges);
  }
  function saveView(){setShowSavedViews(true);}
  function deleteSavedView(id){setSavedViews(vs=>vs.filter(v=>v.id!==id));if(activeView?.id===id)setActiveView(null);}
  function addSavedView(v){setSavedViews(vs=>[...vs,v]);}
  function updateSavedView(v){setSavedViews(vs=>vs.map(x=>x.id===v.id?v:x));if(activeView?.id===v.id)setActiveView(v);}
  function applyView(v){
    setFilterStatus(v.status||"all");
    setShelfFilter(v.shelf||"all");
    setSortBy(v.sort||"recent");
    setActiveView(v);
  }

  const filtered=useMemo(()=>books.filter(b=>{
    if(filterStatus!=="all"&&b.status!==filterStatus)return false;
    if(filterGenre!=="all"&&b.genre!==filterGenre)return false;
    if(shelfFilter!=="all"&&!(b.customShelves||[]).includes(shelfFilter))return false;
    if(searchQ&&!b.title.toLowerCase().includes(searchQ.toLowerCase())&&!b.authors?.join("").toLowerCase().includes(searchQ.toLowerCase()))return false;
    // Rich criteria from active smart shelf
    if(activeView){
      const v=activeView;
      if(v.titleContains&&!b.title.toLowerCase().includes(v.titleContains.toLowerCase()))return false;
      if(v.authorContains&&!(b.authors||[]).join(" ").toLowerCase().includes(v.authorContains.toLowerCase()))return false;
      if(v.genreContains&&(!b.genre||!b.genre.toLowerCase().includes(v.genreContains.toLowerCase())))return false;
      if(v.yearOp&&v.yearVal){const by=parseInt(b.year||0),vy=parseInt(v.yearVal);if(v.yearOp==="eq"&&by!==vy)return false;if(v.yearOp==="gte"&&by<vy)return false;if(v.yearOp==="lte"&&by>vy)return false;}
      if(v.pagesOp&&v.pagesVal){const bp=parseInt(b.pages||0),vp=parseInt(v.pagesVal);if(v.pagesOp==="eq"&&bp!==vp)return false;if(v.pagesOp==="gte"&&bp<vp)return false;if(v.pagesOp==="lte"&&bp>vp)return false;}
      if(v.ratingOp&&v.ratingVal){const br=b.rating||0,vr=parseInt(v.ratingVal);if(v.ratingOp==="eq"&&br!==vr)return false;if(v.ratingOp==="gte"&&br<vr)return false;if(v.ratingOp==="lte"&&br>vr)return false;}
    }
    return true;
  }).sort((a,b)=>{
    if(sortBy==="title")return a.title.localeCompare(b.title);
    if(sortBy==="author")return(a.authors?.[0]||"").localeCompare(b.authors?.[0]||"");
    if(sortBy==="rating")return(b.rating||0)-(a.rating||0);
    if(sortBy==="pages")return(parseInt(b.pages)||0)-(parseInt(a.pages)||0);
    return(b.addedAt||0)-(a.addedAt||0);
  }),[books,filterStatus,filterGenre,shelfFilter,searchQ,sortBy,activeView]);

  const loanedBooks=useMemo(()=>books.filter(b=>b.loan),[books]);
  const genres=useMemo(()=>["all",...Array.from(new Set(books.map(b=>b.genre).filter(Boolean)))],[books]);
  const stats=useMemo(()=>({
    total:books.length,
    read:books.filter(b=>b.status==="read").length,
    reading:books.filter(b=>b.status==="reading").length,
    wishlist:books.filter(b=>b.status==="wishlist").length,
  }),[books]);

  return <div style={{minHeight:"100vh",background:P.bg,fontFamily:"'Nunito',sans-serif",color:P.text}}>
    <OfflineBanner/>
    <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0,background:`radial-gradient(ellipse 80% 50% at 50% -10%,${P.accentGlow} 0%,transparent 60%)`}}/>
    <div className="app-inner" style={{zIndex:1}}>

      {/* ── Library ── */}
      {activeTab==="library"&&<div style={{paddingBottom:"calc(80px + env(safe-area-inset-bottom))"}}>

               <div style={{padding:"48px 20px 12px"}}>
          {/* Title row */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
            <div>
              <div style={{fontFamily:"'Nunito',sans-serif",fontSize:10,letterSpacing:4,color:P.accent,textTransform:"uppercase",fontWeight:800,marginBottom:6}}>My Library</div>

            </div>
            <div style={{display:"flex",gap:8,alignItems:"center",paddingTop:6}}>
              {/* Theme toggle */}
              <button onClick={toggleTheme} title={isDark?"Switch to Light Mode":"Switch to Dark Mode"}
                style={{width:36,height:36,borderRadius:18,background:P.bgCard,border:`1px solid ${P.border}`,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,transition:"all .2s"}}>
                {isDark?"☀️":"🌙"}
              </button>
              {/* Shelves */}
              <button onClick={()=>setShowShelves(true)}
                style={{width:36,height:36,borderRadius:18,background:P.bgCard,border:`1px solid ${P.border}`,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>
                📂
              </button>
              {/* User avatar / profile menu */}
              <button onClick={()=>setShowProfileMenu(true)} title={user?.displayName||user?.email||'Profile'}

                {user?.photoURL
                  ? <img src={user.photoURL} style={{width:"100%",height:"100%",objectFit:"cover"}} referrerPolicy="no-referrer"/>
                  : <span style={{fontSize:16}}>👤</span>}
                {pendingRequests.length>0&&<span style={{position:"absolute",top:-3,right:-3,background:"#ef4444",borderRadius:8,minWidth:15,height:15,display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:800,color:"#fff",padding:"0 3px",fontFamily:"'Nunito',sans-serif",pointerEvents:"none"}}>{pendingRequests.length}</span>}
              </button>
            </div>

            <GoalRing read={stats.read} goal={readingGoal} size={110}/>
            <button onClick={()=>setShowGoalSetup(true)} style={{background:readingGoal===0?P.accent:"transparent",border:`1px solid ${readingGoal===0?P.accent:P.border}`,borderRadius:20,padding:"5px 14px",fontFamily:"'Nunito',sans-serif",fontSize:10,fontWeight:700,color:readingGoal===0?"#fff":P.muted,cursor:"pointer",textTransform:"uppercase",letterSpacing:.4,transition:"all .2s"}}>{readingGoal===0?"🎯 Set Goal":"Edit Goal"}</button>
          </div>
          <div style={{flex:1,display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
            {[{l:"Total",v:stats.total,c:P.accent},{l:"Read",v:stats.read,c:SC.read},{l:"Reading",v:stats.reading,c:SC.reading},{l:"Wishlist",v:stats.wishlist,c:SC.wishlist}].map(({l,v,c})=><div key={l} style={{background:P.bgCard,borderRadius:12,padding:"10px 8px",textAlign:"center",border:`1px solid ${P.border}`,boxShadow:"0 2px 12px rgba(0,0,0,.3)"}}><div style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:900,color:c}}>{v}</div><div style={{fontFamily:"'Nunito',sans-serif",fontSize:9,color:P.muted,fontWeight:700,letterSpacing:.3,textTransform:"uppercase"}}>{l}</div></div>)}
          </div>
        </div>

        {/* Monthly Challenge */}
        <MonthlyChallenge books={books} completedChallenges={completedChallenges}/>

        {/* Currently Reading / Listening */}
        {books.filter(b=>b.status==="reading").length>0&&<div style={{padding:"0 20px 10px"}}>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:10,color:P.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Currently {books.filter(b=>b.status==="reading"&&b.bookFormat==="audiobook").length===books.filter(b=>b.status==="reading").length?"Listening":"Reading"}</div>
          {books.filter(b=>b.status==="reading").map(book=>{
            const fmt=book.bookFormat||"physical";
            const isAudio=fmt==="audiobook";
            const pages=parseInt(book.pages)||0,curPage=book.currentPage||0;
            const pct=pages>0?Math.round((curPage/pages)*100):(book.progressHistory?.slice(-1)[0]?.pct||0);
            const progressLabel=isAudio
              ?`${fmtMinutes(curPage)} listened${pages>0?` of ${fmtMinutes(pages)}`:""}${pct>0?` · ${pct}%`:""}`
              :`${pct}%${pages>0&&curPage>0?` · p.${curPage} of ${pages}`:""}`;
            return <div key={book.id} onClick={()=>setSelected(book)} style={{background:P.bgCard,borderRadius:14,padding:"12px 14px",border:`1px solid ${P.border}`,display:"flex",gap:12,alignItems:"center",marginBottom:8,boxShadow:"0 2px 12px rgba(0,0,0,.3)",cursor:"pointer"}}>
              <div style={{width:42,height:58,borderRadius:6,overflow:"hidden",background:P.bgSurface,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{book.cover?<img src={book.cover} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"}/>:<span style={{fontSize:18}}>{FI[fmt]||"📖"}</span>}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:3}}>
                  {fmt!=="physical"&&<span style={{fontSize:12}}>{FI[fmt]}</span>}
                  <div style={{fontFamily:"'Playfair Display',serif",fontWeight:700,fontSize:13.5,color:P.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{book.title}</div>
                </div>
                <ProgressBar value={pct} max={100} color={SC.reading}/>
                <div style={{fontFamily:"'Nunito',sans-serif",fontSize:11,color:P.muted,marginTop:3}}>{progressLabel}</div>
              </div>
              <button onClick={e=>{e.stopPropagation();setProgressBook(book);}} style={{background:"rgba(90,144,104,.12)",border:`1px solid ${SC.reading}55`,borderRadius:10,padding:"7px 10px",fontFamily:"'Nunito',sans-serif",fontSize:11,fontWeight:700,color:SC.reading,cursor:"pointer",flexShrink:0}}>Update</button>
            </div>;
          })}
        </div>}

        {/* Loaned books banner */}
        {loanedBooks.length>0&&<div style={{margin:"0 20px 14px",background:"rgba(168,85,247,.1)",borderRadius:12,padding:"12px 16px",border:"1px solid rgba(168,85,247,.25)"}}><div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:"#8b68b0",fontWeight:800,marginBottom:6}}>📤 {loanedBooks.length} book{loanedBooks.length!==1?"s":""} lent out</div>{loanedBooks.slice(0,3).map(b=><div key={b.id} style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.textLt}}>{b.title} → {b.loan.name}</div>)}</div>}

        {/* Search */}

// ─── Friends helpers ──────────────────────────────────────────────────────────
const encodeEmail = e => e.toLowerCase().replace(/\./g,'~').replace(/@/g,'__at__');

// ─── Account purge (90-day window expired) ────────────────────────────────────
// Deletes all Firestore data for the uid then removes the Firebase Auth account.
// Called inside onAuthStateChanged so the user is freshly authenticated — no
// re-auth required for currentUser.delete().
async function purgeAccount(uid, email) {
  const db = firebase.firestore();
  // 1. Books subcollection (batch 490 at a time to stay under the 500-write limit)
  const booksSnap = await db.collection(`users/${uid}/books`).get().catch(()=>({docs:[]}));
  for (let i=0; i<booksSnap.docs.length; i+=490) {
    const b=db.batch(); booksSnap.docs.slice(i,i+490).forEach(d=>b.delete(d.ref)); await b.commit();
  }
  // 2. User doc + public profile + email→uid index
  const b2=db.batch();
  b2.delete(db.doc(`users/${uid}`));
  b2.delete(db.doc(`profiles/${uid}`));
  if(email) b2.delete(db.doc(`emailToUid/${encodeEmail(email)}`));
  await b2.commit();
  // 3. Friend requests (sender and recipient sides)
  const [fromSnap,toSnap] = await Promise.all([
    db.collection('friendRequests').where('fromUid','==',uid).get().catch(()=>({docs:[]})),
    db.collection('friendRequests').where('toUid','==',uid).get().catch(()=>({docs:[]})),
  ]);
  const frDocs=[...fromSnap.docs,...toSnap.docs];
  for(let i=0;i<frDocs.length;i+=490){const b3=db.batch();frDocs.slice(i,i+490).forEach(d=>b3.delete(d.ref));await b3.commit();}
  // 4. Firebase Auth account (user is authenticated so no re-auth needed)
  await firebase.auth().currentUser?.delete();
}

async function writePublicProfile(firebaseUser) {
  try {
    const db = firebase.firestore();
    const data = {
      uid: firebaseUser.uid,
      displayName: firebaseUser.displayName || firebaseUser.email.split('@')[0],
      email: firebaseUser.email,
      photoURL: firebaseUser.photoURL || null,
    };
    const batch = db.batch();
    batch.set(db.doc(`profiles/${firebaseUser.uid}`), data, {merge:true});
    batch.set(db.doc(`emailToUid/${encodeEmail(firebaseUser.email)}`), {uid: firebaseUser.uid}, {merge:true});
    await batch.commit();
  } catch(e) { console.warn('writePublicProfile failed:', e); }
}

async function updatePublicStats(uid, books, achievements, goal) {
  try {
    const year = new Date().getFullYear();
    const realBooks = (books||[]).filter(b=>b.status!=="suggestion");
    const readThisYear = realBooks.filter(b=>b.status==="read"&&(b.readDates||[]).some(d=>d.startsWith(String(year)))).length;
    const wishlistFull = realBooks.filter(b=>b.status==="wishlist");
    const wishlist = wishlistFull.slice(0,20).map(({id,title,authors,isbn13,isbn10})=>({id:id||"",title:title||"",authors:authors||[],isbn13:isbn13||"",isbn10:isbn10||""}));
    const xp = calcXP(books||[], goal||0, achievements||[]);
    const {level} = calcLevel(xp);
    const stats = {
      bookCount: realBooks.length,
      readCount: realBooks.filter(b=>b.status==="read").length,
      readingCount: realBooks.filter(b=>b.status==="reading").length,
      wishlistCount: wishlistFull.length,
      readThisYear,
      goal: goal||0,
      achievements: achievements||[],
      xp,
      level,
      wishlist,
      updatedAt: Date.now(),
    };
    await firebase.firestore().doc(`profiles/${uid}`).set({publicStats:stats},{merge:true});
  } catch(e) { console.warn('updatePublicStats failed:', e); }
}

function FriendProfileSheet({ friendUid, friendName, myEarnedAchs=[], onClose }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [errKind, setErrKind] = useState(null); // null | 'missing' | 'denied' | 'other'
  const [achTab, setAchTab] = useState('shared'); // 'shared'|'theirs'|'mine'
  const year = new Date().getFullYear();

  useEffect(() => {
    let dead = false;
    // Safety net: if Firestore hangs for 10s, stop waiting
    const timer = setTimeout(() => {
      if(!dead) { dead=true; setErrKind('other'); setLoading(false); }
    }, 10000);

    firebase.firestore().doc(`profiles/${friendUid}`).get()
      .then(snap => {
        if(dead) return;
        dead=true; clearTimeout(timer);
        if(snap.exists) setData(snap.data());
        else setErrKind('missing');
        setLoading(false);
      })
      .catch(e => {
        if(dead) return;
        dead=true; clearTimeout(timer);
        console.error('FriendProfileSheet:', e.code, e.message);
        setErrKind(e.code==='permission-denied'?'denied':'other');
        setLoading(false);
      });

    return () => { dead=true; clearTimeout(timer); };
  }, [friendUid]);

  if(loading) return <div style={{padding:40,textAlign:"center",fontFamily:"'Nunito',sans-serif",color:P.muted}}>Loading…</div>;
  if(errKind) {
    const msgs={
      missing: "This friend hasn't opened Bookshelf yet — ask them to launch the app once to create their profile.",
      denied:  "Profile access was blocked. Your Firebase Firestore rules need to allow reading the 'profiles' collection — see the setup guide in the README.",
      other:   "Couldn't load profile. Check your internet connection and try again.",
    };
    return <div style={{padding:40,textAlign:"center",fontFamily:"'Nunito',sans-serif",color:P.muted,lineHeight:1.6}}>{msgs[errKind]||msgs.other}</div>;

  if(!data) return <div style={{padding:40,textAlign:"center",fontFamily:"'Nunito',sans-serif",color:P.muted}}>Could not load profile data.</div>;

  const myAchs = new Set(myEarnedAchs);
  const readThisYear = stats.readThisYear || 0;
  const goal = stats.goal || 0;
  const pct = goal > 0 ? Math.min(100, Math.round(readThisYear/goal*100)) : 0;
  const wishlist = stats.wishlist || [];

  const ACH_TABS = [
    {k:'shared',  label:`🤝 Both (${shared.length})`},
    {k:'theirs',  label:`🎯 Theirs (${theirsOnly.length})`},
    {k:'mine',    label:`⭐ Mine (${mineOnly.length})`},
  ];
  const achList = achTab==='shared'?shared:achTab==='theirs'?theirsOnly:mineOnly;

  return (
    <div style={{padding:"4px 0 24px"}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:14,padding:"0 4px 20px",borderBottom:`1px solid ${P.border}`}}>
        <div style={{width:56,height:56,borderRadius:28,background:P.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,overflow:"hidden",flexShrink:0}}>
          <span>{(friendName||"?")[0].toUpperCase()}</span>
        </div>
        <div>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700,color:P.text}}>{friendName}</div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.accent,fontWeight:700}}>{theirLevelTitle} · Lv {theirLevel} · {theirXP.toLocaleString()} XP</div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:11,color:P.muted,marginTop:2}}>{theirAchs.size} badge{theirAchs.size!==1?'s':''} · {shared.length} in common with you</div>
        </div>
      </div>

      {/* Stats not yet synced banner */}
      {!statsReady&&<div style={{margin:"12px 0",padding:"10px 14px",background:"rgba(251,191,36,.08)",border:"1px solid rgba(251,191,36,.25)",borderRadius:10,fontFamily:"'Nunito',sans-serif",fontSize:12,color:"#fbbf24",lineHeight:1.5}}>
        ⏳ Stats not synced yet — {friendName} needs to open Bookshelf to publish their library.

function AddFriendModal({ user, friends, onClose, onRequestSent }) {
  const [email, setEmail] = useState('');
  const [found, setFound] = useState(null);
  const [status, setStatus] = useState('idle'); // idle | searching | not-found | found | self | already | sending | sent | error

  async function search() {
    const e = email.trim().toLowerCase();
    if (!e) return;
    setStatus('searching'); setFound(null);
    try {
      const doc = await firebase.firestore().doc(`emailToUid/${encodeEmail(e)}`).get();
      if (!doc.exists) { setStatus('not-found'); return; }
      const uid = doc.data().uid;
      if (uid === user.uid) { setStatus('self'); return; }
      if (friends.some(f=>f.uid===uid)) { setStatus('already'); return; }
      const prof = await firebase.firestore().doc(`profiles/${uid}`).get();
      if (!prof.exists) { setStatus('not-found'); return; }
      setFound({uid, ...prof.data()}); setStatus('found');
    } catch { setStatus('error'); }
  }

  async function send() {
    if (!found) return;
    setStatus('sending');
    try {
      const fromName=user.displayName||user.email.split('@')[0];
      await firebase.firestore().collection('friendRequests').add({
        fromUid: user.uid,
        fromDisplayName: fromName,
        fromPhotoURL: user.photoURL || null,
        fromEmail: user.email,
        toUid: found.uid,
        status: 'pending',
        sentAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      // Email notification — fire-and-forget so a mail failure never blocks success
      fetch(AI_PROXY_URL,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'notify',to:email.trim().toLowerCase(),fromName})
      }).catch(()=>{});
      setStatus('sent');
      onRequestSent();
    } catch { setStatus('error'); }
  }

  const msgs = {
    'not-found': "No Bookshelf account found with that email.",
    'self': "That's your own email address.",
    'already': "You're already friends with this person.",
    'error': "Something went wrong — please try again.",
  };

  return (
    <div style={{padding:"4px 0"}}>
      <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700,color:P.text,margin:"0 0 16px"}}>Add Friend</h3>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <input value={email} onChange={e=>setEmail(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&search()}
          placeholder="Friend's email address"
          type="email"
          style={{flex:1,padding:"11px 14px",borderRadius:12,border:`1.5px solid ${P.border}`,background:P.bgSurface,color:P.text,fontFamily:"'Nunito',sans-serif",fontSize:14,outline:"none",boxSizing:"border-box"}}/>
        <button onClick={search} disabled={!email.trim()||status==='searching'}
          style={{padding:"11px 18px",borderRadius:12,background:P.accent,color:"#fff",border:"none",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:14,cursor:"pointer",whiteSpace:"nowrap"}}>
          {status==='searching'?"…":"Search"}
        </button>
      </div>

      {msgs[status]&&<p style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:"#ef4444",margin:"0 0 12px"}}>{msgs[status]}</p>}

      {status==='found'&&found&&<div style={{background:P.bgSurface,borderRadius:14,padding:16,border:`1px solid ${P.border}`,display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
        <div style={{width:44,height:44,borderRadius:22,background:P.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>
          {(found.displayName||"?")[0].toUpperCase()}
        </div>
        <div style={{flex:1}}>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:14,fontWeight:700,color:P.text}}>{found.displayName}</div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted}}>{found.email}</div>
        </div>
        <button onClick={send} disabled={status==='sending'}
          style={{padding:"9px 16px",borderRadius:10,background:P.accent,color:"#fff",border:"none",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,cursor:"pointer"}}>
          Add
        </button>
      </div>}

      {status==='sent'&&<div style={{background:"rgba(16,185,129,.1)",borderRadius:12,padding:14,border:"1px solid rgba(16,185,129,.3)",fontFamily:"'Nunito',sans-serif",fontSize:13,color:"#10b981",textAlign:"center",marginBottom:12}}>
        ✓ Friend request sent!
      </div>}

      <button onClick={onClose} style={{width:"100%",padding:"11px",borderRadius:12,background:P.bgSurface,color:P.muted,border:`1px solid ${P.border}`,fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:14,cursor:"pointer",marginTop:4}}>
        Close
      </button>
    </div>
  );
}

function DeleteAccountModal({ user, onClose, onExportFirst }) {
  const [step,setStep]   = useState(1); // 1 = info, 2 = confirm
  const [typed,setTyped] = useState('');
  const [busy,setBusy]   = useState(false);
  const [err,setErr]     = useState('');

  const deadline = new Date(Date.now() + 90*24*60*60*1000)
    .toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});

  async function confirmDelete() {
    if(typed.trim().toUpperCase()!=='DELETE') return;
    setBusy(true); setErr('');
    try {
      await firebase.firestore().doc(`users/${user.uid}`).update({
        deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await firebase.auth().signOut();
      // onAuthStateChanged fires with null → Root shows AuthScreen
    } catch(e) {
      setErr("Something went wrong — please try again.");
      setBusy(false);
    }
  }

  const row = (icon,text) => (
    <div style={{display:'flex',gap:10,marginBottom:8,textAlign:'left'}}>
      <span style={{flexShrink:0,width:18}}>{icon}</span>
      <span style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:P.textLt,lineHeight:1.5}}>{text}</span>
    </div>
  );

  return (
    <Sheet onClose={onClose}>
      {step===1 ? <>
        <div style={{textAlign:'center',marginBottom:20}}>
          <div style={{fontSize:40,marginBottom:8}}>⚠️</div>
          <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:900,color:'#ef4444',margin:'0 0 6px'}}>Delete Account</h3>
          <p style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:P.muted,margin:0,lineHeight:1.5}}>This will schedule your account for permanent deletion.</p>
        </div>

        <div style={{background:'rgba(239,68,68,.07)',border:'1px solid rgba(239,68,68,.25)',borderRadius:12,padding:'14px 16px',marginBottom:16}}>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,fontWeight:800,color:'#ef4444',textTransform:'uppercase',letterSpacing:.5,marginBottom:10}}>What gets deleted</div>
          {row('📚','Your entire book library — all books, notes, highlights, and progress')}
          {row('🏆','All achievements, XP, and reading stats')}
          {row('👥','Your friend connections and public profile')}
          {row('⚙️','All app settings and custom shelves')}
        </div>

        <div style={{background:'rgba(99,102,241,.08)',border:'1px solid rgba(99,102,241,.25)',borderRadius:12,padding:'14px 16px',marginBottom:20}}>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,fontWeight:800,color:P.accent,textTransform:'uppercase',letterSpacing:.5,marginBottom:6}}>90-day recovery window</div>
          <p style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:P.textLt,margin:'0 0 4px',lineHeight:1.5}}>
            Your account will not be immediately removed. Sign back in any time before <strong>{deadline}</strong> to restore everything.
          </p>
          <p style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted,margin:0}}>After 90 days, deletion is permanent and cannot be undone.</p>
        </div>

        <button onClick={onExportFirst} style={{width:'100%',padding:'13px',borderRadius:12,background:P.bgSurface,border:`1.5px solid ${P.border}`,color:P.text,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:14,cursor:'pointer',marginBottom:10,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          📤 Back Up My Library First
        </button>
        <div style={{display:'flex',gap:10}}>
          <button onClick={onClose} style={{flex:1,padding:'13px',borderRadius:12,background:P.bgSurface,border:`1.5px solid ${P.border}`,color:P.text,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:14,cursor:'pointer'}}>Cancel</button>
          <button onClick={()=>setStep(2)} style={{flex:1,padding:'13px',borderRadius:12,background:'rgba(239,68,68,.12)',border:'1.5px solid rgba(239,68,68,.35)',color:'#ef4444',fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:14,cursor:'pointer'}}>Continue →</button>
        </div>
      </> : <>
        <div style={{textAlign:'center',marginBottom:20}}>
          <div style={{fontSize:40,marginBottom:8}}>🗑️</div>
          <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:900,color:'#ef4444',margin:'0 0 6px'}}>Final Confirmation</h3>
          <p style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:P.muted,margin:0,lineHeight:1.5}}>Type <strong style={{color:P.text}}>DELETE</strong> below to confirm.</p>
        </div>
        <input value={typed} onChange={e=>setTyped(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter'&&typed.trim().toUpperCase()==='DELETE')confirmDelete();}}
          placeholder="Type DELETE to confirm"
          style={{width:'100%',padding:'13px 14px',borderRadius:12,border:`1.5px solid ${typed.trim().toUpperCase()==='DELETE'?'#ef4444':P.border}`,background:P.bgSurface,color:P.text,fontFamily:"'Nunito',sans-serif",fontSize:15,fontWeight:700,outline:'none',textAlign:'center',letterSpacing:1,boxSizing:'border-box',marginBottom:14}}/>
        {err&&<p style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:'#ef4444',textAlign:'center',marginBottom:10}}>{err}</p>}
        <div style={{display:'flex',gap:10}}>
          <button onClick={()=>{setStep(1);setTyped('');}} style={{flex:1,padding:'13px',borderRadius:12,background:P.bgSurface,border:`1.5px solid ${P.border}`,color:P.text,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:14,cursor:'pointer'}}>← Back</button>
          <button onClick={confirmDelete} disabled={busy||typed.trim().toUpperCase()!=='DELETE'}
            style={{flex:1,padding:'13px',borderRadius:12,background:busy||typed.trim().toUpperCase()!=='DELETE'?'rgba(239,68,68,.2)':'#ef4444',border:'none',color:'#fff',fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:14,cursor:busy||typed.trim().toUpperCase()!=='DELETE'?'not-allowed':'pointer',transition:'background .15s'}}>
            {busy?'Deleting…':'Delete Account'}
          </button>
        </div>
      </>}
    </Sheet>
  );
}

// ─── Account Restoration Screen ───────────────────────────────────────────────
// Shown when a user signs back in during the 90-day soft-delete window.
function AccountRestorationScreen({ user, pendingDeletion, onRestore, onKeepDeletion }) {
  const [restoring,setRestoring] = useState(false);
  const deletedOn  = pendingDeletion.deletedAt.toDate().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
  const deadline   = new Date(pendingDeletion.deletedAt.toMillis()+90*24*60*60*1000)
    .toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
  const daysLeft   = pendingDeletion.daysLeft;

  async function handleRestore() {
    setRestoring(true);
    try {
      await firebase.firestore().doc(`users/${user.uid}`).update({
        deletedAt: firebase.firestore.FieldValue.delete(),
      });
      onRestore();
    } catch(e) { setRestoring(false); }
  }

  return (
    <div style={{minHeight:'100vh',background:DARK.bg,display:'flex',alignItems:'center',justifyContent:'center',padding:'24px 16px',fontFamily:"'Nunito',sans-serif"}}>
      <div style={{background:DARK.bgCard,border:`1px solid ${DARK.border}`,borderRadius:24,padding:'40px 28px',maxWidth:420,width:'100%',textAlign:'center',boxShadow:'0 24px 80px rgba(0,0,0,.6)'}}>
        <div style={{fontSize:52,marginBottom:14}}>♻️</div>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:26,fontWeight:900,color:DARK.text,margin:'0 0 8px'}}>Account Scheduled for Deletion</h2>
        <p style={{fontSize:13,color:DARK.muted,lineHeight:1.6,marginBottom:24}}>Signed in as <strong style={{color:DARK.textLt}}>{user.email}</strong></p>

        <div style={{background:'rgba(99,102,241,.1)',border:'1px solid rgba(99,102,241,.3)',borderRadius:14,padding:'16px 18px',marginBottom:20,textAlign:'left'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
            <span style={{fontSize:12,color:DARK.muted,fontWeight:700}}>Deletion requested</span>
            <span style={{fontSize:12,color:DARK.textLt,fontWeight:700}}>{deletedOn}</span>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
            <span style={{fontSize:12,color:DARK.muted,fontWeight:700}}>Permanent deletion on</span>
            <span style={{fontSize:12,color:'#ef4444',fontWeight:700}}>{deadline}</span>
          </div>
          <div style={{height:1,background:DARK.border,margin:'10px 0'}}/>
          <div style={{textAlign:'center'}}>
            <span style={{fontSize:28,fontWeight:900,color:daysLeft<=7?'#ef4444':daysLeft<=30?'#f59e0b':'#22c55e'}}>{daysLeft}</span>
            <span style={{fontSize:13,color:DARK.muted,fontWeight:700}}> day{daysLeft!==1?'s':''} remaining</span>
          </div>
        </div>

        <p style={{fontSize:13,color:DARK.muted,lineHeight:1.6,marginBottom:24}}>
          Your library and all data are still intact. Restoring your account takes one tap and cancels the deletion immediately.
        </p>

        <button onClick={handleRestore} disabled={restoring}
          style={{width:'100%',padding:'16px',borderRadius:14,background:restoring?'rgba(99,102,241,.4)':'#6366f1',color:'#fff',border:'none',fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:16,cursor:restoring?'not-allowed':'pointer',marginBottom:12,transition:'background .15s'}}>
          {restoring?'Restoring…':'✓ Restore My Account'}
        </button>
        <button onClick={onKeepDeletion}
          style={{background:'none',border:'none',color:DARK.muted,fontFamily:"'Nunito',sans-serif",fontSize:13,fontWeight:700,cursor:'pointer',padding:'8px 0'}}>
          Continue with deletion — sign out
        </button>
      </div>
    </div>
  );
}

function FriendsScreen({ user, friends, setFriends, pendingRequests, setPendingRequests, earnedAchs=[] }) {
  const [showAddFriend, setShowAddFriend] = useState(false);
  const [viewingFriend, setViewingFriend] = useState(null); // {uid, displayName}

  async function acceptRequest(req) {
    try {
      const db = firebase.firestore();
      const friendProfile = {uid:req.fromUid, displayName:req.fromDisplayName||req.fromEmail||"Friend", photoURL:req.fromPhotoURL||null, email:req.fromEmail||''};
      setFriends(prev => prev.some(f=>f.uid===req.fromUid) ? prev : [...prev, friendProfile]);
      await db.doc(`friendRequests/${req.id}`).update({status:'accepted'});
      setPendingRequests(prev=>prev.filter(r=>r.id!==req.id));
    } catch(e) { console.error('acceptRequest failed:', e); }
  }

  async function declineRequest(req) {
    try {
      await firebase.firestore().doc(`friendRequests/${req.id}`).delete();
      setPendingRequests(prev=>prev.filter(r=>r.id!==req.id));
    } catch(e) { console.error('declineRequest failed:', e); }
  }

  async function removeFriend(uid) {
    setFriends(prev => prev.filter(f=>f.uid!==uid));
  }

  return (
    <div style={{paddingBottom:84}}>
      {/* Header */}
      <div style={{padding:"20px 20px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:26,fontWeight:900,color:P.text,margin:0}}>Friends</h2>
        <button onClick={()=>setShowAddFriend(true)}
          style={{background:P.accent,color:"#fff",border:"none",borderRadius:20,padding:"8px 16px",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,cursor:"pointer"}}>
          + Add Friend
        </button>
      </div>

      {/* Pending requests */}
      {pendingRequests.length>0&&<div style={{padding:"0 20px 16px"}}>
        <div style={{fontFamily:"'Nunito',sans-serif",fontSize:11,fontWeight:700,color:P.muted,textTransform:"uppercase",letterSpacing:.5,marginBottom:10}}>
          Friend Requests ({pendingRequests.length})
        </div>
        {pendingRequests.map(req=>(
          <div key={req.id} style={{background:P.bgCard,borderRadius:14,padding:"14px",marginBottom:8,border:`1px solid ${P.border}`,display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:40,height:40,borderRadius:20,background:P.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
              {(req.fromDisplayName||"?")[0].toUpperCase()}
            </div>
            <div style={{flex:1}}>
              <div style={{fontFamily:"'Nunito',sans-serif",fontSize:14,fontWeight:700,color:P.text}}>{req.fromDisplayName||req.fromEmail}</div>
              <div style={{fontFamily:"'Nunito',sans-serif",fontSize:11,color:P.muted}}>{req.fromEmail}</div>
            </div>
            <button onClick={()=>acceptRequest(req)}
              style={{padding:"7px 12px",borderRadius:8,background:P.accent,color:"#fff",border:"none",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,cursor:"pointer"}}>
              Accept
            </button>
            <button onClick={()=>declineRequest(req)}
              style={{padding:"7px 12px",borderRadius:8,background:P.bgSurface,color:P.muted,border:`1px solid ${P.border}`,fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:12,cursor:"pointer"}}>
              Decline
            </button>
          </div>
        ))}
      </div>}

      {/* Friends list */}
      <div style={{padding:"0 20px"}}>
        {friends.length===0&&pendingRequests.length===0&&(
          <div style={{textAlign:"center",padding:"64px 20px"}}>
            <div style={{fontSize:52,marginBottom:14}}>👥</div>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:P.text,fontWeight:700,marginBottom:10}}>No friends yet</div>
            <p style={{fontFamily:"'Nunito',sans-serif",fontSize:14,color:P.muted,lineHeight:1.6,marginBottom:24}}>Add friends to compare libraries, check each other's wishlists, and track reading goals together.</p>
            <button onClick={()=>setShowAddFriend(true)}
              style={{background:P.accent,color:"#fff",border:"none",borderRadius:14,padding:"13px 28px",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:15,cursor:"pointer"}}>
              Add Your First Friend
            </button>
          </div>
        )}
        {friends.map(f=>(
          <div key={f.uid} onClick={()=>setViewingFriend(f)}
            style={{background:P.bgCard,borderRadius:16,padding:"16px",marginBottom:10,border:`1px solid ${P.border}`,display:"flex",alignItems:"center",gap:14,cursor:"pointer",transition:"border-color .15s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=P.accent}
            onMouseLeave={e=>e.currentTarget.style.borderColor=P.border}>
            <div style={{width:48,height:48,borderRadius:24,background:`linear-gradient(135deg,${P.accent},${P.accentDk})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>
              {(f.displayName||"?")[0].toUpperCase()}
            </div>
            <div style={{flex:1}}>
              <div style={{fontFamily:"'Nunito',sans-serif",fontSize:15,fontWeight:700,color:P.text}}>{f.displayName}</div>
              <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:P.muted}}>{f.email}</div>

  );
}

function AuthScreen({ dbError, purgeFlash, onDismissPurge }) {
  const [mode,setMode]         = useState('signin'); // 'signin' | 'signup' | 'reset'
  const [email,setEmail]       = useState('');
  const [name,setName]         = useState('');
  const [pw,setPw]             = useState('');
  const [pw2,setPw2]           = useState('');
  const [showPw,setShowPw]     = useState(false);
  const [busy,setBusy]         = useState(null);
  const [err,setErr]           = useState(null);
  const [resetSent,setResetSent] = useState(false);

  const PW_REQS = [
    {label:'At least 8 characters',    ok:p=>p.length>=8},
    {label:'One uppercase letter',      ok:p=>/[A-Z]/.test(p)},
    {label:'One lowercase letter',      ok:p=>/[a-z]/.test(p)},
    {label:'One number',                ok:p=>/\d/.test(p)},
    {label:'One special character',     ok:p=>/[^A-Za-z0-9]/.test(p)},
  ];
  const pwValid = PW_REQS.every(r=>r.ok(pw));

  // ── SSO sign-in ────────────────────────────────────────────────────────────
  async function signInSSO(providerName) {
    setBusy(providerName); setErr(null);
    try {
      let provider;
      if      (providerName==='google')    { provider=new firebase.auth.GoogleAuthProvider(); }
      else if (providerName==='microsoft') { provider=new firebase.auth.OAuthProvider('microsoft.com'); provider.setCustomParameters({prompt:'select_account'}); }
      await firebase.auth().signInWithPopup(provider);
    } catch(e) {
      if (e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request') { /* dismissed */ }
      else if (e.code==='auth/account-exists-with-different-credential')
        setErr("An account with this email already exists using a different sign-in method. Try Google or Microsoft — whichever you used first.");
      else setErr("Sign-in failed — please try again.");
      setBusy(null);
    }
  }

  // ── Email/password sign-in ─────────────────────────────────────────────────
  async function signInEmail() {
    if (!email.trim()||!pw) return;
    setBusy('email'); setErr(null);
    try {
      await firebase.auth().signInWithEmailAndPassword(email.trim(), pw);
    } catch(e) {
      if (e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found')
        setErr("Incorrect email or password.");
      else if (e.code==='auth/too-many-requests')
        setErr("Too many failed attempts — wait a moment or reset your password.");
      else if (e.code==='auth/invalid-email')
        setErr("Please enter a valid email address.");
      else setErr("Sign-in failed — please try again.");
      setBusy(null);
    }
  }

  // ── Create account ─────────────────────────────────────────────────────────
  async function signUpEmail() {
    if (!email.trim()||!pw) return;
    if (!pwValid)      { setErr("Password doesn't meet all the requirements below."); return; }
    if (pw!==pw2)      { setErr("Passwords don't match."); return; }
    setBusy('email'); setErr(null);
    try {
      const cred = await firebase.auth().createUserWithEmailAndPassword(email.trim(), pw);
      // Set display name so the app and friend requests show a real name instead of null
      const displayName = name.trim() || email.trim().split('@')[0];
      await cred.user.updateProfile({ displayName });
    } catch(e) {
      if (e.code==='auth/email-already-in-use')
        setErr("An account with this email already exists. Try signing in instead.");
      else if (e.code==='auth/invalid-email')
        setErr("Please enter a valid email address.");
      else if (e.code==='auth/weak-password')
        setErr("Password is too weak — please choose a stronger one.");
      else setErr("Account creation failed — please try again.");
      setBusy(null);
    }
  }

  // ── Password reset ─────────────────────────────────────────────────────────
  async function sendReset() {
    if (!email.trim()) { setErr("Enter your email address first."); return; }
    setBusy('reset'); setErr(null);
    try {
      await firebase.auth().sendPasswordResetEmail(email.trim());
      setResetSent(true);
    } catch(e) {
      // Don't reveal whether the email exists — just show success either way
      if (e.code==='auth/user-not-found'||e.code==='auth/invalid-email') setResetSent(true);
      else setErr("Couldn't send reset email — please try again.");
      setBusy(null);
    }
  }

  function switchMode(m) { setMode(m); setErr(null); setResetSent(false); setPw(''); setPw2(''); setShowPw(false); }

  const dbMsg = dbError
    ? (dbError.includes('permission')||dbError.includes('PERMISSION')
        ? "Database access denied — Firestore rules not set up yet."
        : dbError.includes('not-found')||dbError.includes('unavailable')
          ? "Database not found — Firestore may not be enabled yet."
          : `Database error: ${dbError}`)
    : null;

  const btnBase  = {width:"100%",padding:"14px 20px",borderRadius:14,border:"none",fontWeight:800,fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10,fontFamily:"'Nunito',sans-serif",transition:"opacity .15s",marginBottom:10};
  const inputSt  = {width:"100%",padding:"12px 14px",borderRadius:12,border:`1.5px solid ${DARK.border}`,background:"rgba(255,255,255,.05)",color:DARK.text,fontFamily:"'Nunito',sans-serif",fontSize:14,outline:"none",boxSizing:"border-box",marginBottom:10};

  return (
    <div style={{minHeight:"100vh",background:DARK.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 16px",fontFamily:"'Nunito',sans-serif"}}>
      <div style={{background:DARK.bgCard,border:`1px solid ${DARK.border}`,borderRadius:24,padding:"36px 28px",maxWidth:400,width:"100%",textAlign:"center",boxShadow:"0 24px 80px rgba(0,0,0,.6)"}}>
        {purgeFlash&&<div style={{background:'rgba(34,197,94,.1)',border:'1px solid rgba(34,197,94,.3)',borderRadius:12,padding:'13px 16px',marginBottom:20,textAlign:'left',position:'relative'}}>
          <button onClick={onDismissPurge} style={{position:'absolute',top:8,right:10,background:'none',border:'none',color:DARK.muted,cursor:'pointer',fontSize:16,lineHeight:1}}>✕</button>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:13,fontWeight:800,color:'#22c55e',marginBottom:4}}>Account permanently deleted</div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:DARK.textLt,lineHeight:1.5}}>Your account and all data have been removed. You're welcome to create a new account below.</div>
        </div>}
        <div style={{fontSize:48,marginBottom:12}}>📚</div>
        <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:32,fontWeight:900,color:DARK.text,margin:"0 0 8px",letterSpacing:-.5}}>Bookshelf</h1>
        <p style={{fontSize:13,color:DARK.muted,lineHeight:1.6,marginBottom:24}}>Your personal reading library.<br/>Sign in to access your books on any device.</p>

        {/* ── SSO buttons ── */}
        <button onClick={()=>signInSSO('google')} disabled={!!busy}
          style={{...btnBase,background:busy==='google'?"rgba(99,102,241,.4)":DARK.accent,color:"#fff",opacity:busy&&busy!=='google'?.5:1}}>
          <svg width="18" height="18" viewBox="0 0 18 18" style={{flexShrink:0}}>
            <path fill="#fff" d="M9 3.48c1.69 0 2.83.73 3.48 1.34l2.54-2.48C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.91 2.26C4.6 5.05 6.62 3.48 9 3.48z"/>
            <path fill="#fff" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/>
            <path fill="#fff" d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.29-1.78L.96 4.96A9.008 9.008 0 0 0 0 9c0 1.45.35 2.82.96 4.04l2.92-2.26z"/>
            <path fill="#fff" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.97 13.04C2.45 15.98 5.48 18 9 18z"/>
          </svg>
          {busy==='google'?"Signing in…":"Continue with Google"}
        </button>
        <button onClick={()=>signInSSO('microsoft')} disabled={!!busy}
          style={{...btnBase,background:"rgba(255,255,255,.07)",color:DARK.text,border:`1.5px solid ${DARK.border}`,opacity:busy&&busy!=='microsoft'?.5:1}}>
          <svg width="18" height="18" viewBox="0 0 21 21" style={{flexShrink:0}}>
            <rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
            <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
          </svg>
          {busy==='microsoft'?"Signing in…":"Continue with Microsoft"}
        </button>
        {/* ── Divider ── */}
        <div style={{display:"flex",alignItems:"center",gap:10,margin:"18px 0 16px"}}>
          <div style={{flex:1,height:1,background:DARK.border}}/><span style={{fontSize:11,color:DARK.muted,fontWeight:800,letterSpacing:.5}}>OR</span><div style={{flex:1,height:1,background:DARK.border}}/>
        </div>

        {/* ── Mode tabs (not shown on reset screen) ── */}
        {mode!=='reset'&&<div style={{display:"flex",background:DARK.bgSurface,borderRadius:12,padding:3,marginBottom:18,border:`1px solid ${DARK.border}`}}>
          {[['signin','Sign In'],['signup','Create Account']].map(([m,l])=>(
            <button key={m} onClick={()=>switchMode(m)}
              style={{flex:1,background:mode===m?DARK.accent:"transparent",border:"none",borderRadius:9,padding:"8px 0",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,color:mode===m?"#fff":DARK.muted,cursor:"pointer",transition:"all .15s"}}>
              {l}
            </button>
          ))}
        </div>}

        {/* ── Reset: success state ── */}
        {mode==='reset'&&resetSent&&<div style={{background:"rgba(34,197,94,.1)",border:"1px solid rgba(34,197,94,.3)",borderRadius:12,padding:"14px 16px",marginBottom:16,textAlign:"left"}}>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:13,color:"#22c55e",fontWeight:800,marginBottom:4}}>✓ Reset email sent</div>
          <div style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:DARK.textLt,lineHeight:1.5}}>Check your inbox (and spam folder) for the password reset link.</div>
        </div>}

        {/* ── Fields ── */}
        {(mode!=='reset'||!resetSent)&&<>
          {/* Name field — signup only */}
          {mode==='signup'&&<input value={name} onChange={e=>setName(e.target.value)}
            type="text" placeholder="Your name (shown to friends)" autoComplete="name"
            style={{...inputSt,textAlign:"left"}}/>}

          {/* Email */}
          <input value={email} onChange={e=>setEmail(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'){if(mode==='signin')signInEmail();else if(mode==='signup')signUpEmail();else sendReset();}}}
            type="email" placeholder="Email address" autoComplete="email"
            style={{...inputSt,textAlign:"left"}}/>

          {/* Password */}
          {mode!=='reset'&&<div style={{position:"relative",marginBottom:10}}>
            <input value={pw} onChange={e=>setPw(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter'&&mode==='signin')signInEmail();}}
              type={showPw?"text":"password"} placeholder="Password"
              autoComplete={mode==='signup'?"new-password":"current-password"}
              style={{...inputSt,marginBottom:0,paddingRight:44,textAlign:"left"}}/>
            <button onClick={()=>setShowPw(v=>!v)} tabIndex={-1}
              style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:DARK.muted,fontSize:15,padding:"4px",lineHeight:1}}>
              {showPw?"🙈":"👁"}
            </button>
          </div>}

          {/* Password requirements checklist — signup, while typing */}
          {mode==='signup'&&pw&&<div style={{background:"rgba(255,255,255,.03)",border:`1px solid ${DARK.border}`,borderRadius:10,padding:"10px 12px",marginBottom:10,textAlign:"left"}}>
            {PW_REQS.map(r=>(
              <div key={r.label} style={{display:"flex",alignItems:"center",gap:7,marginBottom:2}}>
                <span style={{fontSize:11,color:r.ok(pw)?"#22c55e":"#ef4444",fontWeight:800,flexShrink:0,width:12}}>{r.ok(pw)?"✓":"✗"}</span>
                <span style={{fontFamily:"'Nunito',sans-serif",fontSize:12,color:r.ok(pw)?DARK.textLt:DARK.muted}}>{r.label}</span>
              </div>
            ))}
          </div>}

          {/* Confirm password — signup */}
          {mode==='signup'&&<input value={pw2} onChange={e=>setPw2(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter')signUpEmail();}}
            type={showPw?"text":"password"} placeholder="Confirm password" autoComplete="new-password"
            style={{...inputSt,borderColor:pw2&&pw!==pw2?"#ef4444":DARK.border,textAlign:"left"}}/>}

          {/* Forgot password link — signin only */}
          {mode==='signin'&&<div style={{textAlign:"right",marginTop:-4,marginBottom:12}}>
            <button onClick={()=>switchMode('reset')}
              style={{background:"none",border:"none",color:DARK.accent,fontFamily:"'Nunito',sans-serif",fontSize:12,fontWeight:700,cursor:"pointer",padding:0}}>
              Forgot password?
            </button>
          </div>}

          {/* Primary CTA */}
          {mode==='signin'&&<button onClick={signInEmail} disabled={!!busy||!email.trim()||!pw}
            style={{...btnBase,background:DARK.accent,color:"#fff",marginBottom:0,opacity:(!!busy||!email.trim()||!pw)?.5:1}}>
            {busy==='email'?"Signing in…":"Sign In"}
          </button>}
          {mode==='signup'&&<button onClick={signUpEmail} disabled={!!busy||!email.trim()||!pwValid||pw!==pw2}
            style={{...btnBase,background:DARK.accent,color:"#fff",marginBottom:0,opacity:(!!busy||!email.trim()||!pwValid||pw!==pw2)?.5:1}}>
            {busy==='email'?"Creating account…":"Create Account"}
          </button>}
          {mode==='reset'&&<button onClick={sendReset} disabled={!!busy||!email.trim()}
            style={{...btnBase,background:DARK.accent,color:"#fff",marginBottom:0,opacity:(!!busy||!email.trim())?.5:1}}>
            {busy==='reset'?"Sending…":"Send Reset Email"}
          </button>}
        </>}

        {/* Back link on reset screen */}
        {mode==='reset'&&<button onClick={()=>switchMode('signin')}
          style={{background:"none",border:"none",color:DARK.muted,fontFamily:"'Nunito',sans-serif",fontSize:13,fontWeight:700,cursor:"pointer",marginTop:14,padding:0}}>
          ← Back to sign in
        </button>}

        {dbMsg&&<p style={{fontSize:13,color:"#ef4444",marginTop:14,lineHeight:1.5}}>{dbMsg}<br/><span style={{opacity:.7}}>Check the browser console for details.</span></p>}
        {err&&<p style={{fontSize:13,color:"#ef4444",marginTop:10,lineHeight:1.5}}>{err}</p>}
      </div>
    </div>
  );
}

function Root() {
  const [authState,setAuthState]         = useState('loading');
  const [user,setUser]                   = useState(null);
  const [dbError,setDbError]             = useState(null);
  const [pendingDeletion,setPendingDeletion] = useState(null); // {deletedAt, daysLeft}
  const [purgeFlash,setPurgeFlash]       = useState(false);   // show confirmation banner on AuthScreen

  useEffect(() => {
    return firebase.auth().onAuthStateChanged(async firebaseUser => {
      if (!firebaseUser) {
        _userDocRef = null; _userCache = null;
        setUser(null); setDbError(null); setAuthState('unauthenticated');
        return;
      }
      try {
        const db      = firebase.firestore();
        _userDocRef   = db.doc(`users/${firebaseUser.uid}`);
        _booksColRef  = _userDocRef.collection('books');

        // Load user settings doc and books subcollection in parallel
        const [snap, booksSnap] = await Promise.all([
          _userDocRef.get(),
          _booksColRef.get(),
        ]);

        const userData = snap.exists ? snap.data() : {};
        let books;

        if (!booksSnap.empty) {
          // ── Already on subcollection format ──────────────────────────────────
          books = booksSnap.docs.map(d => d.data());
          if (userData.books) {
            _userDocRef.update({ books: firebase.firestore.FieldValue.delete() }).catch(() => {});
          }
        } else if (userData.books && userData.books.length > 0) {
          // ── Migrate: move books array → subcollection ─────────────────────
          console.log(`Bookshelf: migrating ${userData.books.length} books to subcollection…`);
          books = userData.books;
          const trimmed = books.map(trimBook);
          for (let i = 0; i < trimmed.length; i += 490) {
            const batch = db.batch();
            for (const b of trimmed.slice(i, i + 490)) batch.set(_booksColRef.doc(b.id), b);
            if (i === 0) batch.update(_userDocRef, { books: firebase.firestore.FieldValue.delete() });
            await batch.commit();
          }
          console.log('Bookshelf: migration complete');
        } else {
          books = [];
        }

        _booksInFS = new Map(books.map(b => [b.id, JSON.stringify(trimBook(b))]));

        const { books: _legacy, ...settingsData } = userData;
        _userCache = {
          goal:0, shelves:[], achievements:[], savedViews:[],
          onboarded:false, lastBackup:null, friends:[],
          ...settingsData,
          books: books.length ? books : null,
        };

        if (!snap.exists) await _userDocRef.set(settingsData);

        // ── Check for scheduled account deletion ────────────────────────────
        if (userData.deletedAt) {
          const daysElapsed = (Date.now() - userData.deletedAt.toMillis()) / 86400000;
          if (daysElapsed >= 90) {
            // Window expired — purge everything then bounce to sign-in screen
            try { await purgeAccount(firebaseUser.uid, firebaseUser.email); } catch(e) { console.warn('purge error:', e); }
            setPurgeFlash(true);
            // onAuthStateChanged fires again with null → sets unauthenticated
            return;
          }
          // Still within window — show restoration screen
          setPendingDeletion({ deletedAt: userData.deletedAt, daysLeft: Math.ceil(90 - daysElapsed) });
          setUser(firebaseUser);
          setAuthState('pending-deletion');
          return;
        }

        setUser(firebaseUser);
        setAuthState('authenticated');
        writePublicProfile(firebaseUser);
      } catch(e) {
        console.error("Failed to load user data:", e);
        setDbError(e.code || e.message || 'unknown error');
        setAuthState('unauthenticated');
      }
    });
  }, []);

  if (authState === 'loading') return <LoadingScreen/>;

  if (authState === 'pending-deletion') return (
    <AccountRestorationScreen
      user={user}
      pendingDeletion={pendingDeletion}
      onRestore={()=>{ setPendingDeletion(null); setAuthState('authenticated'); writePublicProfile(user); }}
      onKeepDeletion={()=>firebase.auth().signOut()}
    />
  );

  if (authState === 'unauthenticated') return (
    <AuthScreen dbError={dbError} purgeFlash={purgeFlash} onDismissPurge={()=>setPurgeFlash(false)}/>
  );

  return <App user={user}/>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(Root));

</script>
</body>
</html>
